中后，留守并负责该地区防御的主要大将是谁？","options":{"A":"曹休","B":"张辽","C":"曹仁","D":"夏侯渊"},"answer":"D","explanation":"曹操西征后以夏侯渊等镇守汉中，直到定军山之战。","source":"《三国志》卷9·夏侯渊传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"夏侯渊传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-089","level":"medium","topic":"刘备入蜀与建国","category":"史实与因果","question":"刘备与曹军争汉中期间，张飞在巴西地区主要击败了哪位曹魏名将？","options":{"A":"张郃","B":"于禁","C":"徐晃","D":"张辽"},"answer":"A","explanation":"《张飞传》记张郃入巴西，张飞在宕渠、瓦口一带利用险隘击败张郃。","source":"《三国志》卷36·张飞传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"张飞传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-090","level":"medium","topic":"刘备入蜀与建国","category":"史实与因果","question":"定军山之战中，蜀军何将亲率突击，斩杀曹魏方面的夏侯渊？","options":{"A":"黄忠","B":"赵云","C":"魏延","D":"马超"},"answer":"A","explanation":"《黄忠传》记黄忠率军推锋必进、斩夏侯渊；《法正传》另记法正观察战机、刘备命黄忠进攻。正史不能据此确定是黄忠本人在单挑中亲手斩首。","source":"《三国志》卷36·黄忠传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"黄忠传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-091","level":"hard","topic":"刘备入蜀与建国","category":"战略与历史判断","question":"《法正传》记夏侯渊分兵半助张郃后，法正的判断与刘备的行动是哪一组？","options":{"A":"夏侯渊分兵后可击，刘备命黄忠乘高进攻","B":"夏侯渊已退守城中，刘备命黄忠断其水源","C":"张郃已撤出汉中，刘备命黄忠攻阳平关","D":"曹操援军已到，刘备命黄忠退守定军山"},"answer":"A","explanation":"《法正传》记夏侯渊分兵半助张郃，法正判断可以进击，刘备命黄忠乘高鼓噪攻之。鹿角及修补部署另见《夏侯渊传》，不宜把该细节冒称为《法正传》的完整记载。","source":"《三国志》卷37·法正传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"法正传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-092","level":"medium","topic":"刘备入蜀与建国","category":"战略与历史判断","question":"曹操于汉中争夺失败后，最终采取了哪项战略收缩？","options":{"A":"退保巴西一带与张飞军长期对峙","B":"集中兵力重攻定军山并继续增援","C":"将主力缩至阳平关，坚守汉中东部","D":"撤出汉中主力，退保关中方向"},"answer":"D","explanation":"曹操在建安二十四年退军出汉中，刘备取得汉中地区，不等于曹魏放弃整个关中。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-093","level":"easy","topic":"刘备入蜀与建国","category":"战略与历史判断","question":"刘备在汉中获胜后，委任谁为汉中都督镇守该地？","options":{"A":"魏延","B":"马超","C":"张飞","D":"赵云"},"answer":"A","explanation":"《魏延传》记众以为必用张飞，刘备却拔魏延为督汉中镇远将军。","source":"《三国志》卷40·魏延传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷40","source_locator":"魏延传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-094","level":"easy","topic":"刘备入蜀与建国","category":"战略与历史判断","question":"关羽北攻襄樊时，率领魏军七军救援曹仁、后在洪水中被俘的是谁？","options":{"A":"于禁","B":"张郃","C":"张辽","D":"徐晃"},"answer":"A","explanation":"《于禁传》记于禁督七军救樊，遇秋水暴涨而降，庞德不屈被杀。","source":"《三国志》卷17·于禁传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷17","source_locator":"于禁传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-095","level":"easy","topic":"刘备入蜀与建国","category":"战略与历史判断","question":"与于禁同赴樊城救援，遭关羽俘获后拒降被杀的曹魏将领是谁？","options":{"A":"李典","B":"曹洪","C":"乐进","D":"庞德"},"answer":"D","explanation":"庞德随于禁救樊，遇水灾败俘，拒绝关羽劝降，见《庞德传》。","source":"《三国志》卷18·庞德传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷18","source_locator":"庞德传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-096","level":"hard","topic":"刘备入蜀与建国","category":"战略与历史判断","question":"樊城受关羽围攻期间，曹仁选择留守坚城的直接战略效果是什么？","options":{"A":"迫使蜀军移师汉中，减轻樊城压力","B":"令关羽分兵回救江陵后曹仁乘势南下","C":"牵制关羽主力，为徐晃等援军争取时间","D":"等待曹军由淮南合击关羽后夺回襄阳"},"answer":"C","explanation":"《曹仁传》记洪水使外军败没、樊城受围，满宠认为山水迅疾、不能持久，劝曹仁继续防守，后来徐晃救至。坚守为援军争取时间是据事件链作出的分析；孙权袭关羽后方另有其决策过程。","source":"《三国志》卷9·曹仁传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"曹仁传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-097","level":"easy","topic":"刘备入蜀与建国","category":"战略与历史判断","question":"最终率魏军援解樊城之围，并击退关羽军的主要将领是谁？","options":{"A":"邓艾","B":"张郃","C":"徐晃","D":"夏侯渊"},"answer":"C","explanation":"《徐晃传》记徐晃援樊城，破关羽围军并打通与曹仁的联系。","source":"《三国志》卷17·徐晃传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷17","source_locator":"徐晃传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-098","level":"hard","topic":"刘备入蜀与建国","category":"制度与史料细节","question":"吕蒙准备袭取荆州时，为让关羽放松对东吴方向警惕而采取何种人事安排？","options":{"A":"吕蒙托病离开，潘璋代陆口并与关羽约共同北伐","B":"吕蒙托病离开，诸葛瑾代陆口并向关羽公开索地","C":"陆逊托病离开，吕蒙代其职务并向关羽示谦","D":"吕蒙托病离开，陆逊代其前线职务并以谦辞致书"},"answer":"D","explanation":"《吕蒙传》《陆逊传》记吕蒙以病退、陆逊书辞卑下等举动，使关羽忽视东吴威胁。","source":"《三国志》卷54·吕蒙传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"吕蒙传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-099","level":"hard","topic":"刘备入蜀与建国","category":"制度与史料细节","question":"吕蒙奇袭荆州时，为隐蔽行踪而采取了哪项有史料记载的行船伪装？","options":{"A":"从陆路经公安以外山路绕袭江陵","B":"兵士穿白衣、扮商旅摇橹前行","C":"乘夜雾以小舟绕过沿江烽燧据点","D":"先派吴军公开换防沿江堡垒"},"answer":"B","explanation":"《吕蒙传》记使白衣摇橹、作商贾人服，昼夜兼行，袭取沿江守备。","source":"《三国志》卷54·吕蒙传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"吕蒙传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-100","level":"medium","topic":"刘备入蜀与建国","category":"制度与史料细节","question":"关羽荆州后方失守时，江陵守将糜芳与公安守将谁先后归降东吴？","options":{"A":"廖化","B":"傅佥","C":"霍峻","D":"士仁"},"answer":"D","explanation":"《关羽传》《吕蒙传》记糜芳守江陵、士仁守公安，二人最终降吴，削弱关羽退路。","source":"《三国志》卷36·关羽传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"关羽传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-101","level":"medium","topic":"刘备入蜀与建国","category":"制度与史料细节","question":"关羽败退后，被潘璋部下哪名司马擒获？","options":{"A":"韩当","B":"丁奉","C":"马忠","D":"朱然"},"answer":"C","explanation":"《潘璋传》记其部司马马忠擒关羽、关平及赵累等。此马忠是潘璋部下，须与蜀汉治理南中的马忠区分；原题所谓“东吴另一名将马忠”没有提供可确认的同名人物依据。","source":"《三国志》卷55·潘璋传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷55","source_locator":"潘璋传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-102","level":"easy","topic":"三国后期与禅代","category":"史实记忆","question":"曹丕取代汉室的皇位时，退位汉献帝刘协被封为何爵？","options":{"A":"弘农王","B":"山阳公","C":"陈留王","D":"魏王"},"answer":"B","explanation":"魏黄初元年曹丕受禅，封刘协为山阳公，保留一定礼遇；陈留王是刘协少年时封号。","source":"《三国志》卷2·文帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷02","source_locator":"文帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-103","level":"easy","topic":"三国后期与禅代","category":"史实记忆","question":"曹魏建立后，作为核心政治首都而非陪都的城市是哪里？","options":{"A":"邺城","B":"洛阳","C":"许昌","D":"长安"},"answer":"B","explanation":"曹丕建魏后以洛阳为都，邺、许昌等在魏都城体系中另有重要地位。","source":"《三国志》卷2·文帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷02","source_locator":"文帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-104","level":"easy","topic":"三国后期与禅代","category":"史实记忆","question":"曹丕称帝后，曹魏用来选任士人的九品官人制度主要出自哪位重臣的创议？","options":{"A":"钟繇","B":"司马懿","C":"刘晔","D":"陈群"},"answer":"D","explanation":"《陈群传》记陈群制九品官人之法，州郡设中正以品评人才。","source":"《三国志》卷22·陈群传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷22","source_locator":"陈群传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-105","level":"easy","topic":"三国后期与禅代","category":"史实与因果","question":"刘备221年出兵攻吴前，哪位拟率万人从阆中赴江州的将领遭部下杀害？","options":{"A":"张飞","B":"关羽","C":"黄忠","D":"马超"},"answer":"A","explanation":"《张飞传》记章武元年，张飞拟率万人自阆中会江州，临发为张达、范强所杀。关羽死于219年，不能说是张飞遇害的“前一年”；正史也没有桃园结义的记载。","source":"《三国志》卷36·张飞传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"张飞传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-106","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"刘备攻吴时，黄权请自任前驱而未获准，后来被部署在哪里以防魏军？","options":{"A":"长江以南","B":"成都附近","C":"长江以北","D":"汉水以北"},"answer":"C","explanation":"《黄权传》记黄权指出吴军悍战、水军顺流易进难退，请任前驱。刘备不从，令黄权督江北军防魏，自在江南。夷陵败后黄权归路隔绝才降魏，不是开战时主动倒戈。","source":"《三国志》卷43·黄权传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"黄权传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-107","level":"hard","topic":"三国后期与禅代","category":"史实与因果","question":"夷陵战役中，陆逊面对蜀军深入与多处营垒，采取的主要作战顺序是什么？","options":{"A":"坚守江陵等蜀军退兵后才派军追击","B":"先持重等待，待蜀军疲敝后集中火攻反击","C":"先夺公安切断刘备与成都的联络","D":"趁刘备尚未立营之际大军决战"},"answer":"B","explanation":"《陆逊传》记陆逊抵御刘备，待其兵疲、营垒连亘后反击。","source":"《三国志》卷58·陆逊传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"陆逊传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-108","level":"easy","topic":"三国后期与禅代","category":"史实与因果","question":"刘备夷陵失利后，退至哪处据点并最终在此去世？","options":{"A":"永安（白帝城）","B":"成都","C":"江陵","D":"汉中"},"answer":"A","explanation":"刘备退驻永安，于章武三年病逝，史书可称永安，白帝为常见地名。","source":"《三国志》卷32·先主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"先主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-109","level":"easy","topic":"三国后期与禅代","category":"史实与因果","question":"刘备临终托孤时，除诸葛亮之外另一位受托的大臣是谁？","options":{"A":"魏延","B":"李严","C":"马良","D":"法正"},"answer":"B","explanation":"《先主传》《李严传》记刘备托孤于诸葛亮、李严，后者为中都护统内外军事。","source":"《三国志》卷40·李严传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷40","source_locator":"李严传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-110","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"刘备死后继位的刘禅，在蜀汉使用的第一个年号是什么？","options":{"A":"建兴","B":"延熙","C":"章武","D":"景耀"},"answer":"A","explanation":"刘禅继位后改元建兴；章武属刘备，延熙与景耀是刘禅后续年号。","source":"《三国志》卷33·后主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷33","source_locator":"后主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-111","level":"hard","topic":"三国后期与禅代","category":"史实与因果","question":"孙权接受曹魏册封为吴王后，双方关系很快因哪一问题明显恶化？","options":{"A":"魏要求遣太子孙登入质，孙权推拒","B":"魏要求吴军撤出南郡而孙权拒绝","C":"魏要求吴出兵共同攻灭蜀汉而孙权拒绝","D":"魏要求吴廷交回刘备使节而孙权拒绝"},"answer":"A","explanation":"孙权先接受魏封号以处理刘备威胁，后拒绝送质，魏吴关系转为公开敌对。","source":"《三国志》卷47·吴主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"吴主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-112","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"曹丕对吴发动大规模军事进攻时，曹真与夏侯尚主要进攻由谁守备的江陵？","options":{"A":"朱然","B":"鲁肃","C":"太史慈","D":"甘宁"},"answer":"A","explanation":"黄初三年左右魏军分路攻吴，朱然守江陵抗曹真、夏侯尚等，见《朱然传》。","source":"《三国志》卷56·朱然传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷56","source_locator":"朱然传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-113","level":"hard","topic":"三国后期与禅代","category":"战略与历史判断","question":"魏军围江陵之际，朱然守城取得成功主要体现在哪一方面？","options":{"A":"先袭襄阳粮屯，迫使夏侯尚率军北归","B":"弃城据江中沙洲，引魏军分兵追击","C":"疫病、兵少及外援困难下持续守城并反击","D":"把守军撤至夷陵，待陆逊击败魏军"},"answer":"C","explanation":"《朱然传》记城中疾病众多、可战者有限，仍坚守并反击，最终魏军退去。","source":"《三国志》卷56·朱然传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷56","source_locator":"朱然传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-114","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"蜀汉在刘备去世后与吴恢复正式交聘，主要由哪位蜀臣出使孙权并促成关系稳定？","options":{"A":"张嶷","B":"李恢","C":"邓芝","D":"秦宓"},"answer":"C","explanation":"《邓芝传》记诸葛亮遣邓芝修好吴国，使两国再度结盟。","source":"《三国志》卷45·邓芝传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷45","source_locator":"邓芝传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-115","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"孙权向蜀汉答聘时，与邓芝互使往来的东吴使臣是哪位？","options":{"A":"薛综","B":"张纮","C":"诸葛恪","D":"张温"},"answer":"D","explanation":"《张温传》记张温出使蜀汉，与蜀吴复交外交环境相关；张温归国后遭政治打击。","source":"《三国志》卷57·张温传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷57","source_locator":"张温传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-116","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"刘备死后蜀汉南中出现动荡，诸葛亮南征的主要区域是哪一方？","options":{"A":"荆州南部武陵、零陵、桂阳等地","B":"益州南部越巂、益州郡、牂牁等地","C":"交州交趾、九真、日南等地","D":"益州北部汉中、阴平、武都等地"},"answer":"B","explanation":"诸葛亮于建兴三年南征，平定益州南部叛乱；并非东吴或魏国腹地作战。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-117","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"南中叛乱中，哪位益州郡势力人物与当地叛乱密切相关，后被高定部属所杀？","options":{"A":"韩遂","B":"士燮","C":"雍闿","D":"郭淮"},"answer":"C","explanation":"《吕凯传》等记雍闿反叛并与高定等相通，后为高定部所杀。","source":"《三国志》卷41·吕凯传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷41","source_locator":"吕凯传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-118","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"诸葛亮南征以后，蜀汉对南中地方实力的处理以什么目标更贴近史实？","options":{"A":"统一交给益州郡太守，不再分设诸郡","B":"驻重军替代所有地方豪族和官吏","C":"全部改设诸侯封国，免除郡县治理","D":"整顿郡县控制并取得兵甲、资源供给"},"answer":"D","explanation":"诸葛亮平定南中后调整官吏并整合南方资源，不是单纯一次战场胜负。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-119","level":"medium","topic":"三国后期与禅代","category":"制度与史料细节","question":"在蜀汉南中治理中，擅长平定叛乱并担任牂牁太守的将领是谁？","options":{"A":"夏侯霸","B":"诸葛诞","C":"马忠","D":"丁奉"},"answer":"C","explanation":"《马忠传》记马忠治理牂牁、平定南中反叛，逐渐成为蜀汉南方重臣。","source":"《三国志》卷43·马忠传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"马忠传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-120","level":"easy","topic":"三国后期与禅代","category":"制度与史料细节","question":"刘禅即位初年，吴蜀重建同盟后两国所共同面对的最主要外部对手是谁？","options":{"A":"曹魏","B":"益州南中诸部","C":"江东山越诸部","D":"魏国辽东公孙氏"},"answer":"A","explanation":"曹魏已于220年建国，吴蜀复交旨在协调面对北方魏国；西晋当时尚未建立。","source":"《三国志》卷33·后主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷33","source_locator":"后主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-121","level":"hard","topic":"三国后期与禅代","category":"制度与史料细节","question":"刘备夷陵败后，黄权归魏，刘备获悉后如何对待其在蜀家属？","options":{"A":"处斩黄权留蜀家属以示惩戒","B":"将黄权家属下狱等候魏国交人","C":"不加诛罚，并称是自己负黄权","D":"削夺黄权家产并流放家属"},"answer":"C","explanation":"《黄权传》记刘备不责黄权，谓孤负黄权、权不负孤，反映与战场败局相联系的个人责任判断。","source":"《三国志》卷43·黄权传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"黄权传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-122","level":"medium","topic":"蜀汉战略与北伐","category":"史实记忆","question":"诸葛亮第一次北伐时，在祁山方向形成策应的陇右三郡是哪一组？","options":{"A":"会稽、吴郡、丹阳","B":"武陵、长沙、零陵","C":"河东、河内、弘农","D":"南安、天水、安定"},"answer":"D","explanation":"《诸葛亮传》记建兴六年扬声由斜谷取郿、身率大军攻祁山，南安、天水、安定叛魏响应。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-123","level":"hard","topic":"蜀汉战略与北伐","category":"史实记忆","question":"第一次北伐中，诸葛亮命赵云、邓芝出箕谷，其主要战略职能是什么？","options":{"A":"箕谷疑军直取长安，诸葛亮主力出子午谷","B":"箕谷主力攻祁山，诸葛亮疑军守汉中","C":"箕谷主力牵制张郃，诸葛亮疑军出陈仓","D":"箕谷疑军牵制曹真，诸葛亮主力出祁山"},"answer":"D","explanation":"《诸葛亮传》记赵云、邓芝为疑军据箕谷，与诸葛亮攻祁山主力不同。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-124","level":"medium","topic":"蜀汉战略与北伐","category":"史实记忆","question":"赵云、邓芝箕谷方向遭曹真优势兵力进攻后，赵云对败退部队采取了什么措施？","options":{"A":"改由子午谷突进，迫魏军回防","B":"敛众固守，不致大败","C":"弃军器先退，以粮草引敌","D":"分军西趋陈仓，接诸葛亮主力"},"answer":"B","explanation":"《赵云传》记箕谷兵弱敌强，失利后赵云敛众固守，不致大败。","source":"《三国志》卷36·赵云传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"赵云传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-125","level":"medium","topic":"蜀汉战略与北伐","category":"史实与因果","question":"《王平传》记马谡在街亭违反诸葛亮部署，王平对此采取了何种态度？","options":{"A":"主张撤入陈仓，与赵云偏师合军","B":"主张先夺长安，不必驻守街亭","C":"赞成据山，反对把弓弩置于山下","D":"反复规谏马谡，但不被采纳"},"answer":"D","explanation":"《王平传》记马谡舍水上山、举措烦扰，王平连规谏而不能用。原题把王平的具体规谏内容补成“强调营地与水源配置”，超出了正文直述；这里只考明确记载的态度。","source":"《三国志》卷43·王平传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"王平传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-126","level":"hard","topic":"蜀汉战略与北伐","category":"史实与因果","question":"街亭战败后，王平率本部鸣鼓整队，这直接使魏军产生何种反应？","options":{"A":"曹真误以为祁山蜀军已全数到达","B":"张郃怀疑伏兵而不贸然逼近","C":"司马懿认为街亭不可围，主动撤军","D":"郭淮以为马谡投降，停止进攻"},"answer":"B","explanation":"《王平传》记王平鸣鼓自持，张郃疑有伏兵不逼，王平得以收合散军。","source":"《三国志》卷43·王平传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"王平传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-127","level":"hard","topic":"蜀汉战略与北伐","category":"史实与因果","question":"街亭之败后，诸葛亮上表自贬为何官，以示承担用兵失误的责任？","options":{"A":"右将军，仍行丞相事","B":"后将军，兼军师将军","C":"前将军，仍行丞相事","D":"中护军，兼尚书令"},"answer":"A","explanation":"《诸葛亮传》记诸葛亮请自贬三等，降右将军而行丞相事，实际仍主持军政。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-128","level":"medium","topic":"蜀汉战略与北伐","category":"史实与因果","question":"诸葛亮第二次北伐围攻陈仓时，负责守城并抵抗蜀军的魏将是谁？","options":{"A":"王双","B":"郝昭","C":"张郃","D":"郭淮"},"answer":"B","explanation":"《明帝纪》等记郝昭坚守陈仓，诸葛亮攻城不克退兵；王双在追击途中遭蜀军斩杀。","source":"《三国志》卷3·明帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷03","source_locator":"明帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-129","level":"medium","topic":"蜀汉战略与北伐","category":"史实与因果","question":"陈仓之役结束时，在追击蜀军过程中遭诸葛亮军击杀的魏将是谁？","options":{"A":"陈泰","B":"曹真","C":"王双","D":"郝昭"},"answer":"C","explanation":"《诸葛亮传》记陈仓撤军时魏将王双率骑追击，亮与战破之，斩双。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-130","level":"medium","topic":"蜀汉战略与北伐","category":"史实与因果","question":"诸葛亮建兴七年北伐取得的两个郡是哪一组？","options":{"A":"庐江与九江","B":"武陵与零陵","C":"南阳与汝南","D":"武都与阴平"},"answer":"D","explanation":"《诸葛亮传》记遣陈式攻武都、阴平，郭淮救援不及，两郡遂平。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-131","level":"medium","topic":"蜀汉战略与北伐","category":"史实与因果","question":"在攻取武都、阴平的行动中，谁受命率军直接进攻二郡？","options":{"A":"张嶷","B":"马谡","C":"陈式","D":"王平"},"answer":"C","explanation":"《诸葛亮传》明确记遣陈式攻武都、阴平，诸葛亮则亲自出至建威策应。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-132","level":"hard","topic":"蜀汉战略与北伐","category":"战略与历史判断","question":"魏国曾于太和四年准备大举伐蜀，诸葛亮在汉中防御后，促使行动停止的自然条件是什么？","options":{"A":"大雨持续、栈道受阻","B":"旱灾使河道无法漕运","C":"地震毁城、汉中诸关崩塌","D":"大雪封山、军马冻死"},"answer":"A","explanation":"《明帝纪》等记魏军多路伐蜀遇大雨、栈道断绝而撤；不是蜀军已攻陷长安。","source":"《三国志》卷3·明帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷03","source_locator":"明帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-133","level":"medium","topic":"蜀汉战略与北伐","category":"战略与历史判断","question":"诸葛亮建兴九年北伐祁山时，负责魏军总体应对并与蜀军对峙的主要统帅是谁？","options":{"A":"满宠","B":"夏侯渊","C":"司马懿","D":"曹仁"},"answer":"C","explanation":"建兴九年司马懿奉命统兵西防诸葛亮，郭淮、张郃等参与陇右作战。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-134","level":"medium","topic":"蜀汉战略与北伐","category":"战略与历史判断","question":"诸葛亮建兴九年攻祁山后撤时，在木门道中伏而死的魏国名将是谁？","options":{"A":"于禁","B":"徐晃","C":"张郃","D":"张辽"},"answer":"C","explanation":"《张郃传》记郃追诸葛亮至木门，与蜀军交战中箭而死。","source":"《三国志》卷17·张郃传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷17","source_locator":"张郃传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-135","level":"medium","topic":"蜀汉战略与北伐","category":"战略与历史判断","question":"建兴九年蜀军粮运问题后，负责汉中军粮事务且被诸葛亮追究责任的蜀臣是谁？","options":{"A":"费祎","B":"邓芝","C":"蒋琬","D":"李严"},"answer":"D","explanation":"《李严传》记李严改名李平，督运不继，又有推卸责任等事，终被废为民。","source":"《三国志》卷40·李严传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷40","source_locator":"李严传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-136","level":"medium","topic":"蜀汉战略与北伐","category":"战略与历史判断","question":"孙吴黄武七年石亭之战中，被东吴将领周鲂诱入伏击的曹魏统帅是谁？","options":{"A":"曹仁","B":"曹休","C":"曹真","D":"曹洪"},"answer":"B","explanation":"《曹休传》《陆逊传》记周鲂诱曹休深入，吴军陆逊等于石亭大破之。","source":"《三国志》卷9·曹休传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"曹休传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-137","level":"hard","topic":"蜀汉战略与北伐","category":"战略与历史判断","question":"吴将周鲂在石亭之战前，为使曹休信其诈降，采取过什么有记载的行动？","options":{"A":"率全郡兵先攻吴寨，显示叛吴决心","B":"送子入魏为质，配合让出庐江太守职","C":"烧毁郡中粮仓，使曹休确信吴军缺粮","D":"剃发示屈等举动，配合反复致书诈降"},"answer":"D","explanation":"《周鲂传》记周鲂向曹休多次致书，并有剃发谢罪等伪装举动以增信。","source":"《三国志》卷60·周鲂传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷60","source_locator":"周鲂传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-138","level":"easy","topic":"蜀汉战略与北伐","category":"战略与历史判断","question":"石亭之战中担任吴军主要指挥并大败曹休的是谁？","options":{"A":"丁奉","B":"陆逊","C":"吕蒙","D":"周泰"},"answer":"B","explanation":"石亭之战陆逊为大都督，与朱桓、全琮等分兵击败曹休，时间在夷陵之后。","source":"《三国志》卷58·陆逊传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"陆逊传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-139","level":"hard","topic":"蜀汉战略与北伐","category":"制度与史料细节","question":"东吴在孙权称帝之前后，对曹魏与蜀汉的对等外交最具体的变化是什么？","options":{"A":"吴称臣于汉，由刘禅统一授予吴国官爵","B":"先停用双方年号，共奉汉献帝旧年号","C":"互换荆州和汉中现有郡县，以偿旧日争地","D":"承认吴帝号，并约定将来破魏后的疆界"},"answer":"D","explanation":"孙权称帝后吴蜀通使，盟文规定分天下并相互承认帝号，是针对曹魏的政治安排。","source":"《三国志》卷47·吴主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"吴主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-140","level":"medium","topic":"蜀汉战略与北伐","category":"制度与史料细节","question":"诸葛亮死于军中后，蜀军组织撤退时，谁主要负责收军回汉中并与魏延产生指挥争执？","options":{"A":"谯周","B":"张裔","C":"李恢","D":"杨仪"},"answer":"D","explanation":"《魏延传》《杨仪传》记诸葛亮临终后撤军事宜委托杨仪等，魏延不服部署，致内讧。","source":"《三国志》卷40·杨仪传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷40","source_locator":"杨仪传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-141","level":"medium","topic":"蜀汉战略与北伐","category":"制度与史料细节","question":"诸葛亮死后与杨仪军发生冲突，败走后被马岱追斩的蜀将是谁？","options":{"A":"王平","B":"张翼","C":"廖化","D":"魏延"},"answer":"D","explanation":"《魏延传》记魏延先南归并烧阁道，后与杨仪军冲突，部众离散，带数人奔汉中，马岱追斩。是魏延被追击，不是题干原称“率兵追击并被杀”；陈寿还解释其意并不在叛魏。","source":"《三国志》卷40·魏延传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷40","source_locator":"魏延传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-142","level":"easy","topic":"曹魏军政","category":"史实记忆","question":"魏明帝曹叡死后，继位的曹魏皇帝是谁？","options":{"A":"曹奂","B":"曹植","C":"曹芳","D":"曹髦"},"answer":"C","explanation":"曹叡于景初三年去世，齐王曹芳继位，由曹爽与司马懿辅政。","source":"《三国志》卷3·明帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷03","source_locator":"明帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-143","level":"easy","topic":"曹魏军政","category":"史实记忆","question":"曹芳即位之初，被指定共同辅政的两位关键人物是谁？","options":{"A":"曹仁与张辽","B":"钟会与邓艾","C":"曹爽与司马懿","D":"曹真与诸葛诞"},"answer":"C","explanation":"《三少帝纪》记曹爽与司马懿受遗诏辅政；曹真、曹仁、张辽均已先于此阶段去世。","source":"《三国志》卷4·三少帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-144","level":"easy","topic":"曹魏军政","category":"史实记忆","question":"曹爽掌权后，司马懿因被排挤而以什么方式淡出日常朝政？","options":{"A":"转任地方郡守，不再参与中枢事务","B":"主动让出太傅之职，改领并州军务","C":"称病不出","D":"请调关中任都督并长驻长安"},"answer":"C","explanation":"司马懿以疾病为由退避，曹爽集团掌握朝政，为高平陵事变留下背景。","source":"《三国志》卷4·三少帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-145","level":"medium","topic":"曹魏军政","category":"史实与因果","question":"249年高平陵政变爆发时，曹爽兄弟为什么恰好不在洛阳城内？","options":{"A":"随皇帝曹芳出城祭陵","B":"远征辽东公孙渊","C":"率军出散关攻汉中","D":"赴淮南围攻诸葛诞"},"answer":"A","explanation":"曹爽随曹芳谒高平陵，司马懿趁其出城控制洛阳并发动政变。","source":"《三国志》卷4·三少帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-146","level":"medium","topic":"曹魏军政","category":"史实与因果","question":"司马懿在高平陵政变后对曹爽集团的最终处置是什么？","options":{"A":"免官放归封国，保留宗室爵位","B":"令曹爽献出禁军后流放河东","C":"以谋反罪处死曹爽及其重要党羽","D":"剥夺曹爽兵权但允许退居许昌"},"answer":"C","explanation":"曹爽放弃抵抗后仍被诛灭，魏国军政权柄由司马氏掌握。","source":"《三国志》卷4·三少帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-147","level":"easy","topic":"曹魏军政","category":"史实与因果","question":"曹魏朝廷最终平定辽东公孙渊叛乱，统军攻取襄平的将领是谁？","options":{"A":"曹仁","B":"司马懿","C":"邓艾","D":"曹洪"},"answer":"B","explanation":"司马懿于238年征公孙渊，围襄平并平定辽东。","source":"《三国志》卷3·明帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷03","source_locator":"明帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-148","level":"medium","topic":"曹魏军政","category":"史实与因果","question":"公孙渊反魏自立时，采用的称王号与国号对应哪一项？","options":{"A":"燕王、燕国","B":"汉中王、汉国","C":"吴王、吴国","D":"赵王、赵国"},"answer":"A","explanation":"公孙渊在辽东称燕王、置百官，随后被魏军平定。","source":"《三国志》卷8·公孙度传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"公孙度传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-149","level":"medium","topic":"曹魏军政","category":"史实与因果","question":"孙权曾遣使厚赐公孙渊，但公孙渊后来怎样对待东吴使者？","options":{"A":"让使者驻守辽东统领海军","B":"将全部礼物转送蜀汉","C":"迎吴使共同渡海攻魏","D":"杀使并送首级于魏国"},"answer":"D","explanation":"《吴主传》记公孙渊杀张弥、许晏等吴使以迎合魏廷，孙权极为愤怒。","source":"《三国志》卷47·吴主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"吴主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-150","level":"medium","topic":"曹魏军政","category":"史实与因果","question":"曹叡统治期间，大兴宫室营建而屡遭儒臣直谏，哪位魏臣以论礼制、灾异等著称？","options":{"A":"辛毗","B":"高堂隆","C":"王肃","D":"杨阜"},"answer":"B","explanation":"《高堂隆传》多记其对奢侈营建、礼仪与天象的直谏，属魏明帝朝政治问题。","source":"《三国志》卷25·高堂隆传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷25","source_locator":"高堂隆传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-151","level":"easy","topic":"曹魏军政","category":"史实与因果","question":"蜀汉诸葛亮病逝后，最先接手主持朝政的丞相府重臣是谁？","options":{"A":"蒋琬","B":"费祎","C":"姜维","D":"诸葛瞻"},"answer":"A","explanation":"《蒋琬传》记蒋琬继诸葛亮辅政，为尚书令、大将军等，其后费祎再居枢要。","source":"《三国志》卷44·蒋琬传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"蒋琬传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-152","level":"medium","topic":"曹魏军政","category":"战略与历史判断","question":"蒋琬执政后曾考虑从汉、沔水道出兵，军事目标主要指向哪里？","options":{"A":"辽东襄平","B":"魏兴、上庸一带","C":"吴郡会稽","D":"关中潼关"},"answer":"B","explanation":"《蒋琬传》记蒋琬欲由汉沔水路袭魏兴、上庸，因疾病及众议反对未能实施。","source":"《三国志》卷44·蒋琬传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"蒋琬传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-153","level":"hard","topic":"曹魏军政","category":"战略与历史判断","question":"与蒋琬相比，费祎主政期间对姜维大规模北伐的态度更接近哪项？","options":{"A":"限制出兵规模，谨慎扩大战争","B":"主张姜维常驻荆州配合孙吴北上","C":"允许姜维集结全国兵力自行大举北伐","D":"禁止蜀军越出汉中而只许守城"},"answer":"A","explanation":"《姜维传》记费祎常裁制姜维用兵，所给不超过万人，并非无任何边境行动。","source":"《三国志》卷44·姜维传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-154","level":"easy","topic":"曹魏军政","category":"战略与历史判断","question":"姜维最初投向蜀汉，发生在诸葛亮哪次北伐期间？","options":{"A":"第二次陈仓之战","B":"第四次祁山之役","C":"第五次五丈原之役","D":"第一次北伐"},"answer":"D","explanation":"《姜维传》记天水太守疑姜维等有异心，姜维在228年第一次北伐时归蜀。","source":"《三国志》卷44·姜维传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-155","level":"hard","topic":"曹魏军政","category":"战略与历史判断","question":"姜维归蜀前在曹魏担任的地方官职是哪一项？","options":{"A":"天水郡主簿","B":"天水郡中郎将","C":"天水郡功曹","D":"雍州刺史参军"},"answer":"B","explanation":"《姜维传》记姜维本为天水郡中郎将，随郡太守巡行而遇战乱。","source":"《三国志》卷44·姜维传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-156","level":"easy","topic":"曹魏军政","category":"战略与历史判断","question":"孙权晚年的“二宫之争”，矛盾核心涉及哪两位皇子？","options":{"A":"孙休与孙皓","B":"孙和与孙霸","C":"孙虑与孙奋","D":"孙登与孙亮"},"answer":"B","explanation":"孙和为太子、孙霸为鲁王，围绕储位结党，破坏吴廷秩序，见《吴主五子传》。","source":"《三国志》卷59·孙和传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷59","source_locator":"孙和传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-157","level":"medium","topic":"曹魏军政","category":"战略与历史判断","question":"东吴原立太子孙登早逝后，谁继为太子并卷入储位争端？","options":{"A":"孙奋","B":"孙虑","C":"孙和","D":"孙霸"},"answer":"C","explanation":"孙登死后孙和被立为太子，后来与鲁王孙霸党争，终被废黜。","source":"《三国志》卷59·孙和传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷59","source_locator":"孙和传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-158","level":"medium","topic":"曹魏军政","category":"战略与历史判断","question":"吴国名将陆逊晚年受孙权反复诘责，直接与哪项政治争端有关？","options":{"A":"诸葛恪出任辅政大臣的争论","B":"孙和、孙霸储位争端","C":"孙皓迁都武昌的财政争论","D":"孙休诛孙綝后的政权重组"},"answer":"B","explanation":"陆逊因涉及东吴储位争端多次受责，最终愤懑去世；不能把其去世归于夷陵战败。","source":"《三国志》卷58·陆逊传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"陆逊传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-159","level":"medium","topic":"曹魏军政","category":"制度与史料细节","question":"魏将毌丘俭出征高句丽时，攻破的高句丽重要都城是哪里？","options":{"A":"襄平","B":"丸都","C":"乐浪","D":"带方"},"answer":"B","explanation":"《毌丘俭传》《东夷传》记魏军攻高句丽王都丸都，体现魏国东北边疆军事经营。","source":"《三国志》卷28·毌丘俭传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"毌丘俭传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-160","level":"hard","topic":"曹魏军政","category":"制度与史料细节","question":"高平陵事变之前，曹爽集团于244年发动一次失败的伐蜀行动，主要出兵地点是哪处？","options":{"A":"骆谷","B":"子午谷","C":"阴平","D":"散关"},"answer":"A","explanation":"曹爽以大军经骆谷伐蜀，在兴势受阻，补给艰难，后撤军。","source":"《三国志》卷9·曹爽传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"曹爽传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-161","level":"hard","topic":"曹魏军政","category":"制度与史料细节","question":"曹爽骆谷伐蜀时，率蜀军据兴势等要地、抗击魏军的主要将领是谁？","options":{"A":"王平","B":"张翼","C":"姜维","D":"费祎"},"answer":"A","explanation":"《王平传》记曹爽入骆谷，王平主张守兴势，拒魏军深入，后援至而敌退。","source":"《三国志》卷43·王平传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"王平传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-162","level":"easy","topic":"三国后期与禅代","category":"史实记忆","question":"司马懿控制魏国朝政后，王凌在淮南酝酿改立皇帝一事，最终由谁率军压境使其投降？","options":{"A":"司马昭","B":"诸葛诞","C":"司马懿","D":"司马师"},"answer":"C","explanation":"王凌之谋败于251年司马懿亲自东征；司马师、司马昭随后分别处理其他政治军事危机。","source":"《三国志》卷28·王凌传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"王凌传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-163","level":"easy","topic":"三国后期与禅代","category":"史实记忆","question":"255年在寿春起兵反对司马氏的魏将组合是哪一组？","options":{"A":"曹爽与何晏","B":"王凌与令狐愚","C":"毌丘俭与文钦","D":"诸葛诞与文鸯"},"answer":"C","explanation":"毌丘俭、文钦因曹芳被废等反对司马师，兵败后文钦投吴。","source":"《三国志》卷28·毌丘俭传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"毌丘俭传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-164","level":"easy","topic":"三国后期与禅代","category":"史实记忆","question":"文钦在255年兵败后归附何国，并于诸葛诞后来的寿春起事中再度出现？","options":{"A":"蜀汉","B":"西晋","C":"辽东燕国","D":"孙吴"},"answer":"D","explanation":"文钦投吴，随后受吴命援诸葛诞；此与其原是曹魏将领的身份要结合时间区分。","source":"《三国志》卷28·毌丘俭传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"毌丘俭传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-165","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"魏帝曹芳被废后，司马师迎立了哪位皇帝？","options":{"A":"曹丕","B":"曹奂","C":"曹叡","D":"曹髦"},"answer":"D","explanation":"曹髦于正元元年入继大统，后来与司马昭发生致命冲突。","source":"《三国志》卷4·三少帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-166","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"魏帝曹髦于260年试图亲自讨伐司马昭，最终被谁的部下成济所杀？","options":{"A":"曹爽","B":"邓艾","C":"钟会","D":"贾充"},"answer":"D","explanation":"《三少帝纪》记曹髦率宫人讨司马昭，被贾充部下成济杀害；曹髦在此事后并非退位为王。","source":"《三国志》卷4·三少帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-167","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"曹髦遇弑后，魏廷改立的最后一位曹魏皇帝是谁？","options":{"A":"曹奂","B":"曹植","C":"曹宇","D":"曹芳"},"answer":"A","explanation":"曹奂于260年即位，至265年禅位于司马炎。","source":"《三国志》卷4·三少帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-168","level":"easy","topic":"三国后期与禅代","category":"史实与因果","question":"诸葛诞在寿春反抗司马昭时，向哪一国正式请求军事援助？","options":{"A":"孙吴","B":"蜀汉","C":"辽东燕国","D":"鲜卑诸部"},"answer":"A","explanation":"诸葛诞遣使向孙吴求援，吴军与魏军因而在淮南交战。","source":"《三国志》卷28·诸葛诞传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"诸葛诞传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-169","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"寿春诸葛诞起兵后，东吴派兵援救，哪位吴将因作战不利遭孙綝杀害？","options":{"A":"朱桓","B":"朱异","C":"朱治","D":"朱然"},"answer":"B","explanation":"《诸葛滕二孙濮阳传》记孙綝怒朱异不能解围而杀之。","source":"《三国志》卷64·孙綝传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷64","source_locator":"孙綝传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-170","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"费祎在蜀汉主持军政时，最终因何种事件去世？","options":{"A":"与司马懿决战战死","B":"宴饮中遭郭循刺杀","C":"在曹魏监狱中病故","D":"奉使孙吴时坠江溺亡"},"answer":"B","explanation":"《费祎传》记延熙十六年岁首大会，魏降人郭循（亦作郭脩）刺杀费祎。裴注引《魏氏春秋》又记姜维此前警告费祎防备新附之人，不能把刺杀动机简化为所有降人的共同行为。","source":"《三国志》卷44·费祎传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"费祎传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-171","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"姜维于255年北伐在洮西大破哪位魏将，随后围攻狄道？","options":{"A":"夏侯尚","B":"曹真","C":"郭淮","D":"王经"},"answer":"D","explanation":"《姜维传》《陈泰传》记姜维在洮西大破王经，魏军退据狄道。","source":"《三国志》卷44·姜维传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-172","level":"hard","topic":"三国后期与禅代","category":"战略与历史判断","question":"洮西之败后，主持解救王经所守狄道，并判断姜维不能久围的魏国征西将军是谁？","options":{"A":"王经","B":"郭淮","C":"邓艾","D":"陈泰"},"answer":"D","explanation":"《陈泰传》记陈泰反对等诸军齐集再救狄道，判断蜀军利于野战、难以久攻坚城，遂据险进援。邓艾也参加西线军务，不能说他未参与；本题限定征西将军陈泰的具体决策。","source":"《三国志》卷22《陈泰传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷22","source_locator":"陈泰","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-173","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"姜维于256年在段谷失利时，主要被哪位曹魏将领击败？","options":{"A":"邓艾","B":"乐进","C":"曹仁","D":"夏侯渊"},"answer":"A","explanation":"《姜维传》《邓艾传》记姜维与邓艾战于段谷失利，蜀军损失较重。","source":"《三国志》卷44·姜维传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-174","level":"hard","topic":"三国后期与禅代","category":"战略与历史判断","question":"蜀汉后期，姜维对汉中防御曾提出的制度性调整是什么？","options":{"A":"收兵聚谷守汉、乐二城，待敌疲退后诸军并进","B":"保留外山诸围，阻敌入汉中而不战腹地","C":"弃守汉乐两城，以沓中屯田部队主守诸关","D":"撤出汉中城池，专在剑阁集结全部军队"},"answer":"A","explanation":"《姜维传》记姜维建议改变分兵守险模式，聚兵守汉、乐二城，企图歼灭深入魏军。","source":"《三国志》卷44·姜维传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-175","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"蜀汉末年姜维忌惮成都朝中宦官掣肘，长期在何处屯田避祸？","options":{"A":"沓中","B":"武昌","C":"寿春","D":"襄平"},"answer":"A","explanation":"《姜维传》记姜维自危，求沓中种麦以避内廷矛盾。","source":"《三国志》卷44·姜维传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-176","level":"easy","topic":"三国后期与禅代","category":"战略与历史判断","question":"吴大帝孙权于252年去世后，直接继位的皇帝是谁？","options":{"A":"孙亮","B":"孙和","C":"孙休","D":"孙皓"},"answer":"A","explanation":"孙亮为孙权幼子，继吴帝位；孙休与孙皓先后在孙亮之后即位。","source":"《三国志》卷48·孙亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"孙亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-177","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"诸葛恪在东兴获胜后，于253年发动的大规模北伐主要围攻哪处曹魏据点？","options":{"A":"合肥新城","B":"襄平","C":"上庸","D":"陇西狄道"},"answer":"A","explanation":"诸葛恪率众围合肥新城，未能取胜，军中疾病、兵员损耗严重。","source":"《三国志》卷64·诸葛恪传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷64","source_locator":"诸葛恪传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-178","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"诸葛恪北伐失败归国后，最终被哪位吴国权臣以宴会为场合杀害？","options":{"A":"滕胤","B":"陆抗","C":"孙峻","D":"孙綝"},"answer":"C","explanation":"诸葛恪遭孙峻设宴伏兵诛杀；孙綝在孙峻死后才继掌权柄。","source":"《三国志》卷64·孙峻传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷64","source_locator":"孙峻传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-179","level":"easy","topic":"三国后期与禅代","category":"制度与史料细节","question":"孙峻死后，继续掌握孙吴朝政并与宗室冲突的是谁？","options":{"A":"孙休","B":"孙皓","C":"孙綝","D":"孙霸"},"answer":"C","explanation":"孙綝为孙峻从弟，继领朝政，后与吴主孙亮、孙休分别发生冲突。","source":"《三国志》卷64·孙綝传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷64","source_locator":"孙綝传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-180","level":"medium","topic":"三国后期与禅代","category":"制度与史料细节","question":"孙亮试图铲除孙綝失败后，最终遭到什么政治处置？","options":{"A":"获加封长沙王而继续主持朝政","B":"被降为庶人并迁往交州","C":"被软禁宫内但仍保有皇帝名号","D":"被废为会稽王"},"answer":"D","explanation":"孙綝废孙亮为会稽王，拥立孙休；吴国皇位更替与魏国同时期废立需分开记。","source":"《三国志》卷48·孙亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"孙亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-181","level":"easy","topic":"三国后期与禅代","category":"制度与史料细节","question":"被孙綝拥立即位、后来反过来诛灭孙綝的吴国皇帝是谁？","options":{"A":"孙奋","B":"孙霸","C":"孙登","D":"孙休"},"answer":"D","explanation":"孙休于258年继位，随后在张布、丁奉等配合下诛孙綝。","source":"《三国志》卷48·孙休传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"孙休传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-182","level":"easy","topic":"三国后期与禅代","category":"史实记忆","question":"魏伐蜀期间，率主力在剑阁方向与姜维僵持的曹魏统帅是谁？","options":{"A":"王濬","B":"邓艾","C":"钟会","D":"诸葛绪"},"answer":"C","explanation":"钟会主力进逼剑阁，被姜维阻挡；邓艾另从阴平方向突入蜀地，不能混为同一路军。","source":"《三国志》卷28·钟会传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"钟会传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-183","level":"medium","topic":"三国后期与禅代","category":"史实记忆","question":"263年魏军进入汉中时，阳安关口守将谁投降钟会军，另一位守将傅佥奋战而死？","options":{"A":"蒋舒","B":"马邈","C":"张翼","D":"诸葛瞻"},"answer":"A","explanation":"《姜维传》记蒋舒开城出降，傅佥战死；江由守将马邈之降是另一地点。","source":"《三国志》卷44·姜维传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-184","level":"medium","topic":"三国后期与禅代","category":"史实记忆","question":"钟会在伐蜀中以失职等理由夺取哪位魏将的兵权，从而增加手中部队？","options":{"A":"郭淮","B":"夏侯霸","C":"诸葛绪","D":"张郃"},"answer":"C","explanation":"《钟会传》记钟会密奏诸葛绪畏懦不进，收其军队；此时诸葛绪不是蜀将。","source":"《三国志》卷28·钟会传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"钟会传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v14-185","level":"hard","topic":"三国后期与禅代","category":"史实与因果","question":"蜀汉亡国后，姜维为什么仍与钟会保持密切联系？","options":{"A":"借钟会发动叛乱，再伺机除会、恢复蜀汉","B":"借钟会向孙吴移交成都，自己出镇永安","C":"借钟会保留原蜀军编制，先接受魏廷永久册封","D":"借钟会解除邓艾之兵，再请刘禅赴洛阳自辩"},"answer":"A","explanation":"《姜维传》正文记姜维、钟会被乱兵所杀；裴注引《汉晋春秋》明说姜维意欲借钟会之乱恢复蜀汉。复国意图是有特定注引来源的说法，不能冒称该句出自陈寿正文。","source":"《三国志》卷44《姜维传》（正文及裴注引《汉晋春秋》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-186","level":"hard","topic":"三国后期与禅代","category":"史实与因果","question":"魏军入蜀后，钟会对邓艾采取了哪项政治军事行动？","options":{"A":"将邓艾调守剑阁，再命姜维以蜀军将其收捕","B":"直接在成都拘邓艾，不经魏廷而废其将军号","C":"先公开与邓艾决战，再自行向魏廷报告战果","D":"与卫瓘等密白邓艾有反状，邓艾后被诏收捕"},"answer":"D","explanation":"《钟会传》记会与卫瓘密白邓艾有反状，魏廷诏收捕邓艾；裴注又记改动邓艾表文等构陷细节。向中枢指控与奉诏收捕是两个环节，不能写成钟会在未得诏令时已自行杀邓艾。","source":"《三国志》卷28《钟会传》（正文及裴注引《世语》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"钟会","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-187","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"钟会成都叛乱最终以怎样的结果告终？","options":{"A":"魏军兵变杀钟会，姜维亦死","B":"司马昭接受钟会禅位","C":"钟会与姜维顺利复立刘禅","D":"孙吴派兵在成都接应钟会"},"answer":"A","explanation":"《钟会传》记众军士发难，钟会及姜维被杀，蜀汉复兴计划失败。","source":"《三国志》卷28·钟会传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"钟会传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-188","level":"easy","topic":"三国后期与禅代","category":"史实与因果","question":"司马昭去世之后，继承晋王之位并于同年受魏禅建立晋朝的是谁？","options":{"A":"司马炎","B":"司马攸","C":"司马孚","D":"司马师"},"answer":"A","explanation":"司马炎于265年承继司马昭权势，随后受曹奂禅位为晋武帝。","source":"《三国志》卷4·三少帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-189","level":"easy","topic":"三国后期与禅代","category":"史实与因果","question":"曹魏最后一位皇帝曹奂禅位后，被西晋封为何王？","options":{"A":"广陵王","B":"陈留王","C":"吴王","D":"山阳公"},"answer":"B","explanation":"曹奂退位后封陈留王；山阳公是东汉献帝刘协退位后的封号。","source":"《三国志》卷4·三少帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-190","level":"medium","topic":"三国后期与禅代","category":"史实与因果","question":"孙吴末帝孙皓即位之前，以什么封爵身份被迎立？","options":{"A":"鲁王","B":"会稽王","C":"长沙桓王","D":"乌程侯"},"answer":"D","explanation":"孙皓为孙和之子、封乌程侯，孙休死后被迎立为吴帝。","source":"《三国志》卷48·孙皓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"孙皓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-191","level":"hard","topic":"三国后期与禅代","category":"史实与因果","question":"孙休死于264年后，孙吴为什么没有由孙休年幼的太子直接继承？","options":{"A":"孙休生前已明令废止皇太子","B":"孙吴各郡公开拥立孙亮复位","C":"孙皓此前被孙权指定为唯一储君","D":"重臣在外患压力下改迎已成年的孙皓"},"answer":"D","explanation":"《孙皓传》记孙休死时太子年幼，濮阳兴、张布等因蜀亡、交阯叛离等外患希望择长君，迎立孙皓。孙皓即位后又诛二人，不能用后来暴政倒推其当时已公开的评价。","source":"《三国志》卷48·孙皓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"孙皓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-192","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"孙皓初即位时，曾把吴国都城从建业移往哪里，后来又迁回？","options":{"A":"交趾","B":"长沙","C":"江陵","D":"武昌"},"answer":"D","explanation":"《孙皓传》记甘露元年迁都武昌，后来还都建业；不可误认孙权早年武昌称帝的迁都顺序。","source":"《三国志》卷48·孙皓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"孙皓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-193","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"孙皓统治后期，哪位吴国重臣在书疏中反复批评时政并力劝改善？","options":{"A":"陆凯","B":"陆抗","C":"丁奉","D":"濮阳兴"},"answer":"A","explanation":"《陆凯传》保存多篇向孙皓的上疏，陆凯是吴国后期丞相。","source":"《三国志》卷61·陆凯传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷61","source_locator":"陆凯传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-194","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"西晋对吴发动全面战争前，长期镇守襄阳、主张经营荆州并积极筹划伐吴的重臣是谁？","options":{"A":"羊祜","B":"贾充","C":"杜预","D":"王濬"},"answer":"A","explanation":"《晋书·羊祜传》记羊祜在荆州与吴对峙并筹划伐吴，其后杜预继任。","source":"《晋书》卷34·羊祜传（正文）","source_url":"https://zh.wikisource.org/wiki/晉書/卷034","source_locator":"羊祜传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-195","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"羊祜去世后，接替其荆州军事职务、参与灭吴战役的晋将是谁？","options":{"A":"王濬","B":"卫瓘","C":"马隆","D":"杜预"},"answer":"D","explanation":"《晋书·杜预传》记杜预继羊祜都督荆州军事，并在灭吴时由荆州方向进军。","source":"《晋书》卷34·杜预传（正文）","source_url":"https://zh.wikisource.org/wiki/晉書/卷034","source_locator":"杜预传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-196","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"晋朝为顺江东下攻吴，在哪一上游地区大量建造水军舰船？","options":{"A":"益州","B":"徐州","C":"扬州","D":"荆州"},"answer":"A","explanation":"晋军以益州水军沿长江东下，是对孙吴江防的关键压力。","source":"《晋书》卷42·王濬传（正文）","source_url":"https://zh.wikisource.org/wiki/晉書/卷042","source_locator":"王濬传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-197","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"西晋灭吴之战中，率益州水军顺长江东进的重要将领是谁？","options":{"A":"王浑","B":"司马孚","C":"杜预","D":"王濬"},"answer":"D","explanation":"王濬由益州统舟师东下，王浑是另一路进攻的晋将，两人战功与受降问题需区别。","source":"《晋书》卷42·王濬传（正文）","source_url":"https://zh.wikisource.org/wiki/晉書/卷042","source_locator":"王濬传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-198","level":"medium","topic":"三国后期与禅代","category":"战略与历史判断","question":"面对晋军上游大舰，吴国在长江险要处曾设置怎样的阻航障碍？","options":{"A":"横江铁锁和水下铁锥","B":"横江浮桥和水下木桩","C":"水下铁锥和江中沉船","D":"横江铁锁和两岸连弩"},"answer":"A","explanation":"《王濬传》记吴军置铁锁与铁锥阻舰，王濬以火炬、筏等办法破除障碍。","source":"《晋书》卷42·王濬传（正文）","source_url":"https://zh.wikisource.org/wiki/晉書/卷042","source_locator":"王濬传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-199","level":"medium","topic":"三国后期与禅代","category":"制度与史料细节","question":"280年张悌率沈莹、孙震等渡江迎击晋军，最终在哪种战局中阵亡？","options":{"A":"渡江迎敌、在长江下游正面遭晋军击败","B":"守卫建业而不与晋军展开野战","C":"在夏口与上游王濬舟师交战身死","D":"驻江陵坚守直到吴廷献降"},"answer":"A","explanation":"《孙皓传》等记张悌率沈莹等迎晋兵，败死，是吴国末期正面抵抗的重要战事。","source":"《三国志》卷48·孙皓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"孙皓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-200","level":"medium","topic":"三国后期与禅代","category":"制度与史料细节","question":"280年东吴最终投降西晋时，孙皓向哪一路晋军主将献降？","options":{"A":"王浑","B":"胡奋","C":"杜预","D":"王濬"},"answer":"D","explanation":"《孙皓传》记晋军至建业，孙皓降于王濬；司马昭已在265年前去世。","source":"《三国志》卷48·孙皓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"孙皓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-201","level":"easy","topic":"三国后期与禅代","category":"制度与史料细节","question":"蜀汉、曹魏、东吴相继结束各自政权的先后顺序是哪一项？","options":{"A":"蜀汉263年亡，孙吴265年亡，曹魏280年禅晋","B":"蜀汉263年亡，曹魏265年禅晋，孙吴280年亡","C":"蜀汉265年亡，曹魏266年禅晋，孙吴279年亡","D":"曹魏263年禅晋，蜀汉265年亡，孙吴280年亡"},"answer":"B","explanation":"三国政权终结并不同步：魏灭蜀在先，司马炎代魏随后，晋灭吴完成统一最晚。","source":"《三国志》卷48·孙皓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"孙皓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-202","level":"medium","topic":"边疆与地方治理","category":"史实与因果","question":"曹魏在扬州淮南前线重建秩序时，哪位官员广修堤陂以改善合肥周边的防备与民生？","options":{"A":"刘馥","B":"刘晔","C":"满宠","D":"蒋济"},"answer":"A","explanation":"《刘馥传》记刘馥治理扬州，兴建城垒、陂堨并积蓄军资，为合肥边防提供基础。","source":"《三国志》卷15·刘馥传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷15","source_locator":"刘馥传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-203","level":"medium","topic":"边疆与地方治理","category":"史实与因果","question":"曹魏治理关中初年，长期主持长安一带行政并安集民众的魏臣是谁？","options":{"A":"满宠","B":"陈群","C":"钟繇","D":"徐晃"},"answer":"C","explanation":"《钟繇传》记其为司隶校尉督关中诸军，参与关中安抚与管理。","source":"《三国志》卷13·钟繇传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷13","source_locator":"钟繇传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-204","level":"medium","topic":"边疆与地方治理","category":"史实与因果","question":"曹操时期主管选官、以举清正之士和抑制奢侈著称的重臣是谁？","options":{"A":"毛玠","B":"曹爽","C":"张鲁","D":"何晏"},"answer":"A","explanation":"《毛玠传》记其主张举用清正之士、裁抑奢侈，为曹操早期选官风格的重要体现。","source":"《三国志》卷12·毛玠传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷12","source_locator":"毛玠传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-205","level":"medium","topic":"边疆与地方治理","category":"史实与因果","question":"魏臣司马芝治理河南尹时，处理豪强与官吏关系的突出原则是什么？","options":{"A":"维护法令，不因势家门第随意曲法","B":"将地方争讼主要交由世家裁断","C":"对豪族之家采用从轻处置惯例","D":"以宗族乡约代替郡县法令"},"answer":"A","explanation":"《司马芝传》多记其整饬法令、抗拒豪强请托的做法；这里强调史书行为，不推断其全部政绩。","source":"《三国志》卷12·司马芝传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷12","source_locator":"司马芝传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-206","level":"medium","topic":"边疆与地方治理","category":"史实与因果","question":"《田豫传》记魏文帝初年，受命持节护乌丸校尉、经营鲜卑诸部关系的是谁？","options":{"A":"郭淮","B":"牵招","C":"解儁","D":"田豫"},"answer":"D","explanation":"《田豫传》明确记魏文帝初年使田豫持节护乌丸校尉，牵招、解儁并护鲜卑。牵招另有兼领袁绍乌丸突骑、担任雁门太守等经历，不能混写成同一任命。","source":"《三国志》卷26《田豫传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷26","source_locator":"田豫","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-207","level":"easy","topic":"边疆与地方治理","category":"史实与因果","question":"魏将郭淮在陇右经营边事时，常处理的是哪类地方社会力量？","options":{"A":"羌、胡诸部及其部落首领","B":"辽东高句丽王室","C":"江东山越与沿海商旅","D":"交州日南海上诸国"},"answer":"A","explanation":"《郭淮传》载郭淮在关陇与羌胡诸部往来、征抚，其地理范围不在东吴岭南。","source":"《三国志》卷26·郭淮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷26","source_locator":"郭淮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-208","level":"medium","topic":"边疆与地方治理","category":"史实与因果","question":"魏国凉州刺史徐邈在边郡施政时，特别着力于哪类事务？","options":{"A":"修水利扩田、整顿吏治、安抚羌胡","B":"只发展盐铁官营，不处理地方诉讼","C":"迁边民入关中、裁撤凉州郡县","D":"专建堡垒、限制边民耕种、撤销互市"},"answer":"A","explanation":"《徐邈传》记凉州因乱少雨、谷贵，徐邈修武威与酒泉盐池、广开水田，又整顿吏治、抚羌胡。这里的盐池并非仅指盐铁官营部门，水利与地方关系须合读。","source":"《三国志》卷27·徐邈传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷27","source_locator":"徐邈传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-209","level":"medium","topic":"边疆与地方治理","category":"史实与因果","question":"曹魏名医华佗在与曹操关系破裂后，最终遭何种处置？","options":{"A":"被留在许县医署，终于病卒","B":"因拒绝征辟，被流放边郡","C":"因病不能诊治，免罪归乡","D":"被曹操拘捕处死"},"answer":"D","explanation":"《华佗传》记华佗为曹操诊病，后因归家不返被收考处死，诊疗传说与小说情节需区分。","source":"《三国志》卷29·华佗传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷29","source_locator":"华佗传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-210","level":"medium","topic":"边疆与地方治理","category":"史实与因果","question":"建安文学人物王粲在早年避乱期间，先依附哪位荆州牧，后才入曹操幕府？","options":{"A":"刘璋","B":"刘焉","C":"陶谦","D":"刘表"},"answer":"D","explanation":"《王粲传》记王粲避乱荆州依刘表，刘表死后转入曹操集团。","source":"《三国志》卷21·王粲传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷21","source_locator":"王粲传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-211","level":"easy","topic":"边疆与地方治理","category":"史实与因果","question":"曹魏宗室诗人曹植曾获“陈思王”谥号，其父是谁？","options":{"A":"曹仁","B":"曹丕","C":"曹叡","D":"曹操"},"answer":"D","explanation":"曹植为曹操子、曹丕之弟，后封陈王，谥思；陈思王不是生前的建安封号。","source":"《三国志》卷19·陈思王传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷19","source_locator":"陈思王传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v14-212","level":"medium","topic":"边疆与地方治理","category":"战略与历史判断","question":"《蜀科》的拟定工作中，以下哪位蜀臣与诸葛亮、法正、刘巴、李严一同参与讨论法制？","options":{"A":"董和","B":"伊籍","C":"费祎","D":"蒋琬"},"answer":"B","explanation":"《伊籍传》记伊籍与诸葛亮、法正、刘巴、李严共造蜀科，属于蜀汉入蜀建制事务。","source":"《三国志》卷38·伊籍传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷38","source_locator":"伊籍传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-213","level":"medium","topic":"边疆与地方治理","category":"战略与历史判断","question":"蜀汉重要经济事务中，王连曾主管哪类官营资源部门，为政权提供财政供给？","options":{"A":"盐府及盐铁事务","B":"成都官营粮仓与漕运","C":"益州郡山泽采矿和铸币","D":"蜀锦官营织作部门"},"answer":"A","explanation":"《王连传》记王连迁司盐校尉，校盐铁之利，利入甚多，有裨国用。可确认的是职务与盐铁财政作用，不应擅自等同于后世整套盐铁专卖制度。","source":"《三国志》卷41·王连传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷41","source_locator":"王连传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-214","level":"medium","topic":"边疆与地方治理","category":"战略与历史判断","question":"诸葛亮南征时，守永昌郡并拒绝与雍闿叛军合作的地方官员是谁？","options":{"A":"李严","B":"郭攸之","C":"夏侯霸","D":"吕凯"},"answer":"D","explanation":"《吕凯传》记吕凯与府丞王伉率吏民闭境拒雍闿，维持永昌郡控制。","source":"《三国志》卷41·吕凯传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷41","source_locator":"吕凯传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-215","level":"medium","topic":"边疆与地方治理","category":"战略与历史判断","question":"蜀汉将领张嶷任越巂太守期间，采取过什么主要治理策略？","options":{"A":"恩威并用，重开被阻断的交通与郡县联系","B":"迁徙大部分越巂人口离开本郡","C":"以严禁通商并封闭道路维持边界","D":"让部族首领全权取代郡县官员"},"answer":"A","explanation":"《张嶷传》记其在越巂招抚、征讨并改善道路交通，地方治理是其重要功绩。","source":"《三国志》卷43·张嶷传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"张嶷传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v14-216","level":"medium","topic":"边疆与地方治理","category":"战略与历史判断","question":"东吴将领潘濬在平定荆州南部蛮夷叛乱中，主要面对哪一地区的五溪诸部？","options":{"A":"长沙","B":"武陵","C":"桂阳","D":"零陵"},"answer":"B","explanation":"《潘濬传》记潘濬率军讨五溪蛮，涉及吴国荆南边郡治理而非北方羌胡。","source":"《三国志》卷61·潘濬传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷61","source_locator":"潘濬传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-217","level":"medium","topic":"边疆与地方治理","category":"战略与历史判断","question":"孙吴名臣胡综长期承担了什么类型的政务工作？","options":{"A":"统交州地方兵与海外使团","B":"起草国书诏诰与对外文书","C":"专任太子师傅而不参与国书","D":"专掌吴郡盐税与屯田财政"},"answer":"B","explanation":"《胡综传》记其善属文，吴国国书、诏命多出其手。","source":"《三国志》卷62·胡综传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷62","source_locator":"胡综传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-218","level":"medium","topic":"边疆与地方治理","category":"战略与历史判断","question":"东吴史官韦曜晚年与孙皓发生冲突，最终遭遇什么结局？","options":{"A":"因政争流徙到交州而卒","B":"被下狱诛杀","C":"出使西晋被扣押而病亡","D":"被罢史职归乡后善终"},"answer":"B","explanation":"《韦曜传》记韦曜参与国史编撰，后遭孙皓杀害，不能与初唐韦氏学者混同。","source":"《三国志》卷65·韦曜传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷65","source_locator":"韦曜传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-219","level":"medium","topic":"边疆与地方治理","category":"制度与史料细节","question":"《三国志》吴书卷65保存了哪位吴末史官劝减徭役、关心民生的多篇上疏？","options":{"A":"薛综","B":"华核","C":"陆凯","D":"韦曜"},"answer":"B","explanation":"《华核传》在卷65，保存多篇上疏和史官相关讨论；其他人物属于此前的吴国世代，不能套用这一卷的记载。","source":"《三国志》卷65·华核传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷65","source_locator":"华核传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-220","level":"medium","topic":"边疆与地方治理","category":"制度与史料细节","question":"孙权曾命卫温与诸葛直率船队出海，史书所记主要目的地是什么？","options":{"A":"夷洲、亶洲","B":"乐浪、带方","C":"辽东、玄菟","D":"扶南、林邑"},"answer":"A","explanation":"《吴主传》记孙权遣将军卫温、诸葛直将甲士万人浮海求夷洲、亶洲，实际到达及岛屿定位须与现代推断区分。","source":"《三国志》卷47·吴主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"吴主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v14-221","level":"hard","topic":"边疆与地方治理","category":"制度与史料细节","question":"蜀汉将领霍峻守葭萌城期间，面对优势敌军，采取的主要防守方式是什么？","options":{"A":"退守巴中要塞等待魏延援军","B":"出城迎击敌军主力、孤军决战","C":"以少兵坚守，待敌懈怠时反击","D":"全军避敌撤往荆州保全兵力"},"answer":"C","explanation":"《霍峻传》记葭萌城中仅数百兵，向存、扶禁等领万人攻围，霍峻坚守约一年，后乘懈怠出击并斩向存。不同规模与持续时间都是对史书叙事的转述，不应额外添加小说中的救兵或单挑细节。","source":"《三国志》卷41·霍峻传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷41","source_locator":"霍峻传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v15-001","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"张角组织起事前，泄露马元义等人京师内应计划的是哪位弟子？","options":{"A":"张曼成","B":"唐周","C":"马元义","D":"卜己"},"answer":"B","explanation":"《后汉书》载唐周上书，马元义事泄被车裂，张角遂仓促发动。","source":"《后汉书》卷71","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"唐周","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-002","level":"hard","topic":"汉末群雄与政局","category":"军事与决策","period":"184—189 黄巾与汉末危机","question":"黄巾军原定京师内应者中，哪一组均为中常侍？","options":{"A":"曹节、王甫","B":"蹇硕、郭胜","C":"封谞、徐奉","D":"张让、赵忠"},"answer":"C","explanation":"张角党人马元义以封谞、徐奉为内应，与外部各方相约起兵。","source":"《后汉书》卷71","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"封諝","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-003","level":"hard","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"皇甫嵩征讨颍川黄巾前，向朝廷提出过哪项应急建议？","options":{"A":"解除党禁并取中藏钱、西园马助军","B":"任重臣为州牧并准其自行征兵","C":"赦免黄巾并令各郡自行招抚","D":"迁都长安并以边军替代郡兵"},"answer":"A","explanation":"皇甫嵩提出解党禁、出中藏钱和西园厩马用于军士。","source":"《后汉书》卷71","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"解黨禁","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-004","level":"hard","topic":"汉末群雄与政局","category":"军事与决策","period":"184—189 黄巾与汉末危机","question":"皇甫嵩在广宗击败张梁的关键作战转换是什么？","options":{"A":"先据外围营垒，再昼夜交替攻城","B":"先撤围示弱，诱张梁追兵出城","C":"先闭营休士察敌，再夜集兵黎明进击","D":"先攻其粮道，待张梁出城再决战"},"answer":"C","explanation":"皇甫嵩此前久攻未克，改为闭营休士、观察敌懈，然后夜袭。","source":"《后汉书》卷71","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"廣宗","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-005","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"张角死后，其遗体在皇甫嵩攻克广宗后遭到怎样处理？","options":{"A":"与张梁遗体一同焚毁于营中","B":"剖棺戮尸并传首京师","C":"保留墓葬，仅斩其继任首领","D":"由乡里迁葬，不再追究遗体"},"answer":"B","explanation":"《后汉书》明确记张角已病死，朝廷军剖棺戮尸、传首京师；并非战阵斩杀。","source":"《后汉书》卷71","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"角先已病死","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-006","level":"hard","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"皇甫嵩平定黄巾主力后，曾请求减免冀州什么负担以赈饥民？","options":{"A":"免冀州两年田租","B":"免冀州一年算赋","C":"免冀州一年徭役","D":"免冀州一年田租"},"answer":"D","explanation":"皇甫嵩奏请免冀州一年田租，用于安抚受战乱影响的民众。","source":"《后汉书》卷71","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"一年田租","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-007","level":"medium","topic":"汉末群雄与政局","category":"军事与决策","period":"184—189 黄巾与汉末危机","question":"劝皇甫嵩凭军功取代朝廷却遭拒绝的说客是谁？","options":{"A":"阎圃","B":"阎柔","C":"阎忠","D":"阎象"},"answer":"C","explanation":"阎忠认为皇甫嵩功高可自立；皇甫嵩以奉公守臣节拒之。","source":"《后汉书》卷71","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"閻忠","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-008","level":"hard","topic":"汉末群雄与政局","category":"军事与决策","period":"184—189 黄巾与汉末危机","question":"《后汉书·朱儁传》记南阳黄巾的首领先后更替，哪组人名次序相符？","options":{"A":"张曼成、赵弘、韩忠","B":"张纯、张举、丘力居","C":"波才、彭脱、卜己","D":"张角、张梁、张宝"},"answer":"A","explanation":"南阳太守秦颉先杀张曼成，黄巾再以赵弘、韩忠等为帅，朱儁参与后续围攻。因此不是三人均为朱儁本人所斩；南阳这一支也不同于冀州张角兄弟主力。","source":"《后汉书》卷71","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"南陽","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-009","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"刘焉上书建议设置州牧的政治背景中，核心问题是什么？","options":{"A":"边郡外交繁复，拟以州牧替换护羌校尉","B":"刺史不能有效禁乱，拟由重臣出任州牧","C":"中枢军费不足，拟由州牧专掌盐铁","D":"地方太守权重，拟以州牧限制郡兵"},"answer":"B","explanation":"刘焉认为刺史贪浊不能禁乱，提议由重臣出任州牧加强一州控制。","source":"《三国志》卷31（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷31","source_locator":"劉焉","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-010","level":"hard","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"刘焉赴益州前曾想争取出任哪一州牧，后因消息改变方向？","options":{"A":"荆州","B":"交州","C":"幽州","D":"扬州"},"answer":"B","explanation":"《刘焉传》载刘焉先欲交州，闻益州有天子气，改求益州牧。","source":"《三国志》卷31（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷31","source_locator":"交州","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-011","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"刘焉派张修与张鲁攻取汉中后，谁袭杀张修并吞并其部众，进而据有汉中？","options":{"A":"张修","B":"阎圃","C":"张鲁","D":"苏固"},"answer":"C","explanation":"《张鲁传》记张鲁随张修攻汉中，继而袭杀张修并夺其众，逐渐以宗教性军政势力据汉中。","source":"《三国志》卷8（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"張修","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-012","level":"medium","topic":"汉末群雄与政局","category":"军事与决策","period":"184—189 黄巾与汉末危机","question":"灵帝末建立西园军时，宦官中哪一人担任上军校尉居于诸校尉之首？","options":{"A":"赵忠","B":"张让","C":"蹇硕","D":"郭胜"},"answer":"C","explanation":"蹇硕领西园上军，曹操为典军校尉，袁绍为中军校尉。","source":"《后汉书》卷69","source_url":"https://zh.wikisource.org/wiki/後漢書/卷69","source_locator":"西園","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-014","level":"medium","topic":"汉末群雄与政局","category":"军事与决策","period":"184—189 黄巾与汉末危机","question":"何进遇害后，袁绍等率兵入宫诛宦官；挟持少帝和陈留王出宫的是哪位宦官？","options":{"A":"蹇硕","B":"段珪","C":"郭胜","D":"赵忠"},"answer":"B","explanation":"《后汉书》载张让、段珪等挟二王出走，至北芒附近被追及。","source":"《后汉书》卷69","source_url":"https://zh.wikisource.org/wiki/後漢書/卷69","source_locator":"段珪","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-016","level":"hard","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"张燕为何取得汉廷承认的平难中郎将名义？","options":{"A":"迎献帝东归有功，授平难中郎将","B":"主动遣使请降，授平难中郎将","C":"平黄巾后被举荐，授平难中郎将","D":"助公孙瓒破袁绍，授平难中郎将"},"answer":"B","explanation":"张燕遣使乞降，汉廷拜为平难中郎将，领河北诸山谷事。","source":"《三国志》卷8（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"平難中郎將","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-017","level":"hard","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"刘虞与公孙瓒后来的冲突，首先体现了幽州对哪项基本政策的分歧？","options":{"A":"刘虞主全面禁市，公孙瓒主互市换马","B":"刘虞重招抚，公孙瓒主张利用不服从之机讨击","C":"刘虞主边族独立治郡，公孙瓒主撤销边郡","D":"刘虞主迁边民内地，公孙瓒主保留旧部落"},"answer":"B","explanation":"刘虞重招抚、轻杀伐，公孙瓒倾向军事打击，二人在对乌桓等的政策上有冲突。","source":"《后汉书》卷73","source_url":"https://zh.wikisource.org/wiki/後漢書/卷73","source_locator":"劉虞","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-018","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"184—189 黄巾与汉末危机","question":"中平末幽州张纯、张举叛乱期间，张举曾僭称何号？","options":{"A":"安北将军","B":"天子","C":"燕王","D":"弥天将军"},"answer":"B","explanation":"张举在幽州叛乱中自称天子，张纯自号弥天将军等，二人的称号不可混用。","source":"《后汉书》卷73","source_url":"https://zh.wikisource.org/wiki/後漢書/卷73","source_locator":"張舉","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-019","level":"hard","topic":"汉末群雄与政局","category":"军事与决策","period":"189—196 董卓与诸侯割据","question":"董卓初入洛阳兵力有限时，如何制造麾下部众众多的观感？","options":{"A":"令京师军轮流换旗，宣称已尽属凉州","B":"令禁军在城外列营，示意各州援军已至","C":"令京师百官领兵巡城，佯作郡县兵来援","D":"令兵夜间潜出、白日鼓噪入城，制造增兵印象"},"answer":"D","explanation":"董卓初入洛阳带来的兵力有限，夜间潜出、次日大张声势再入，使人误以为西方援军接连到达。这一细节见裴注引《九州春秋》；不能把制造声势等同于真实持续增兵。","source":"《三国志》卷6《董卓传》（裴注引《九州春秋》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓","novel_note":"董卓废立、迁都与献帝东归须按史书时间区分；貂蝉连环计、曹操献刀等演义情节不用于补定政治事件的因果。"},{"id":"v15-022","level":"hard","topic":"汉末群雄与政局","category":"史实与政略","period":"189—196 董卓与诸侯割据","question":"比较《董卓传》对李傕、郭汜互斗的记载，哪项把劫持对象对应正确？","options":{"A":"杨奉挟帝、李傕拘公卿","B":"李傕挟帝、张济拘公卿","C":"郭汜挟帝、李傕拘公卿","D":"李傕挟帝、郭汜拘公卿"},"answer":"D","explanation":"李傕把献帝移至营中，郭汜则扣留前来和解的公卿。两人的控制对象不同，汉廷也不是一个独立行动者；杨奉后来护驾东归，不能倒置为这一阶段的劫帝者。","source":"《三国志》卷6《董卓传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓","novel_note":"董卓废立、迁都与献帝东归须按史书时间区分；貂蝉连环计、曹操献刀等演义情节不用于补定政治事件的因果。","option_explanations":{"A":"杨奉后来参与护驾东归，本段劫帝者为李傕。","B":"此时拘公卿者为郭汜，不是張济。","C":"把李傕劫帝与郭汜拘公卿的对象对换了。","D":"李傕把献帝移至营中，郭汜则扣留前来和解的公卿。两人的控制对象不同，汉廷也不是一个独立行动者；杨奉后来护驾东归，不能倒置为这一阶段的劫帝者。"}},{"id":"v15-023","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"189—196 董卓与诸侯割据","question":"朱儁在李傕掌权长安期间，曾被哪位地方武装首领推举为对抗李傕的盟主？","options":{"A":"袁绍","B":"陶谦","C":"袁术","D":"刘表"},"answer":"B","explanation":"陶谦与诸州郡谋迎朱儁号召关东讨李傕，但朱儁后来未能实际主持这一联盟。","source":"《后汉书》卷71","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"朱儁","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-024","level":"hard","topic":"汉末群雄与政局","category":"军事与决策","period":"189—196 董卓与诸侯割据","question":"关东联军时期，袁绍曾与韩馥筹谋改立哪位幽州宗室取代献帝？","options":{"A":"刘表","B":"刘焉","C":"刘宠","D":"刘虞"},"answer":"D","explanation":"袁绍、韩馥谋拥刘虞即位，刘虞拒绝；与后来的袁术称帝是不同事件。","source":"《三国志》卷6（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"劉虞","novel_note":"董卓废立、迁都与献帝东归须按史书时间区分；貂蝉连环计、曹操献刀等演义情节不用于补定政治事件的因果。"},{"id":"v15-027","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"189—196 董卓与诸侯割据","question":"袁绍取得冀州的重要方式是哪一项？","options":{"A":"击败韩馥守军后夺取州治","B":"借公孙瓒威胁等压力促韩馥让州","C":"受汉廷诏令直接替代韩馥","D":"联韩馥败公孙瓒后由韩馥让州"},"answer":"B","explanation":"袁绍通过联络公孙瓒施压，韩馥畏惧而让冀州，不是一次单纯攻城取胜。","source":"《三国志》卷6（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"韓馥","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-028","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"189—196 董卓与诸侯割据","question":"韩馥让冀州后，起初赴何处依附，最终因忧惧袁绍而自杀？","options":{"A":"张邈","B":"袁术","C":"张杨","D":"刘表"},"answer":"A","explanation":"《袁绍传》相关记载韩馥依张邈，因惧使者欲害而自尽。","source":"《三国志》卷6（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"韓馥","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-030","level":"medium","topic":"汉末群雄与政局","category":"军事与决策","period":"189—196 董卓与诸侯割据","question":"公孙瓒晚期筑楼自守，其最终被袁绍军攻破的核心据点为何？","options":{"A":"界桥","B":"广川","C":"蓟城","D":"易京"},"answer":"D","explanation":"公孙瓒筑易京楼堑自守，袁绍军围攻并于建安四年使其覆亡。","source":"《三国志》卷8（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"易京","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-031","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"189—196 董卓与诸侯割据","question":"吕布被李傕集团逐出长安后，曾先后辗转依附哪些北方诸侯？","options":{"A":"袁绍、公孙瓒","B":"韩馥、袁术","C":"袁术、袁绍","D":"刘表、张鲁"},"answer":"C","explanation":"吕布脱离长安后辗转于袁术、袁绍、张杨等势力之间，未立刻占据徐州。","source":"《三国志》卷7（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷07","source_locator":"呂布","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-032","level":"medium","topic":"汉末群雄与政局","category":"军事与决策","period":"189—196 董卓与诸侯割据","question":"张邈与曹操反目、迎吕布入兖州时，张邈守护的郡治中心主要在哪里？","options":{"A":"东郡","B":"陈留","C":"济阴","D":"山阳"},"answer":"B","explanation":"张邈为陈留太守，弟张超亦参与迎吕布，反叛源于兖州的联盟破裂。","source":"《三国志》卷7（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷07","source_locator":"張邈","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-033","level":"medium","topic":"汉末群雄与政局","category":"军事与决策","period":"189—196 董卓与诸侯割据","question":"曹操夺回兖州后，张邈的弟弟张超最终在何城兵败？","options":{"A":"定陶","B":"濮阳","C":"鄄城","D":"雍丘"},"answer":"D","explanation":"曹操围雍丘，张超战败，张邈集团瓦解。","source":"《三国志》卷7（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷07","source_locator":"雍丘","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-034","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"189—196 董卓与诸侯割据","question":"陶谦死后，哪一组徐州人物支持刘备接领徐州？","options":{"A":"糜芳、孙乾","B":"曹豹、许耽","C":"麋竺、陈登","D":"陈珪、臧霸"},"answer":"C","explanation":"《先主传》记麋竺率州人迎刘备，陈登劝其领州，北海相孔融也致劝。麋竺、陈登是同一政治安排中的支持者；此题不把他们统称为同一年龄层的“长者”。","source":"《三国志》卷32（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"陶謙","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-035","level":"medium","topic":"汉末群雄与政局","category":"史实与政略","period":"189—196 董卓与诸侯割据","question":"刘备受陶谦部众拥立徐州时，最初倾向于把徐州让给哪位人物？","options":{"A":"吕布","B":"袁术","C":"袁绍","D":"孔融"},"answer":"B","explanation":"刘备初辞而提出由袁术领徐州，陈登、孔融劝其不要把徐州交给袁术。","source":"《三国志》卷32（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"袁術","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-036","level":"medium","topic":"汉末群雄与政局","category":"军事与决策","period":"189—196 董卓与诸侯割据","question":"汉献帝东归途中，护驾武将杨奉本来所依附的军队组织是什么？","options":{"A":"黑山军","B":"青州黄巾","C":"白波军","D":"凉州义从"},"answer":"C","explanation":"杨奉与白波军有关，其部将徐晃后来被曹操招纳。","source":"《三国志》卷1（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"楊奉","novel_note":"董卓废立、迁都与献帝东归须按史书时间区分；貂蝉连环计、曹操献刀等演义情节不用于补定政治事件的因果。"},{"id":"v15-040","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"197—207 官渡与河北归曹","question":"《郭嘉传》记曹操拟先击徐州刘备，哪位谋臣认为袁绍迟疑、来援不会迅速？","options":{"A":"郭嘉","B":"贾诩","C":"荀攸","D":"荀彧"},"answer":"A","explanation":"《郭嘉传》记郭嘉指出刘备新起、众心未附，袁绍性迟且多疑，故可疾击刘备；《武帝纪》另记曹操本人回应诸将顾虑。指定传文可避免把不同记录混为同一句话。","source":"《三国志》卷14（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷14","source_locator":"劉備","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-042","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"197—207 官渡与河北归曹","question":"沮授反对袁绍轻进官渡时，提出的核心资源判断是什么？","options":{"A":"曹方粮少宜固守，袁方当以骑兵速决","B":"袁方粮足却士气低，应立即夺营决战","C":"双方皆须速战，河北不宜作后续基地","D":"袁方粮众足宜持久，曹方更利速战"},"answer":"D","explanation":"沮授认为兵多粮足的一方宜持久，曹军相对利于迅速决战。","source":"《三国志》卷6（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"沮授","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-043","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"197—207 官渡与河北归曹","question":"袁绍围曹操官渡时，首先出现的两类互相对抗的主要工事是什么？","options":{"A":"袁军高橹土山，曹军以发石车反制","B":"袁军高橹土山，曹军以内堑反制","C":"袁军地道突入，曹军以高橹反制","D":"袁军地道突入，曹军以发石车反制"},"answer":"A","explanation":"《武帝纪》载袁军筑土山、起楼，曹军作发石车破之。","source":"《三国志》卷1（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"發石車","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-044","level":"hard","topic":"曹魏军政","category":"军事与决策","period":"197—207 官渡与河北归曹","question":"官渡攻防后，袁军掘地道时曹军采用哪项办法应对？","options":{"A":"在营内挖长堑拦截地道","B":"在营外垒土山压实地道","C":"以发石车击毁敌方掘进营垒","D":"从侧旁掘道引水倒灌敌道"},"answer":"A","explanation":"袁军改掘地道，曹军内作长堑抗之；这与此前发石车反制高橹是不同攻防阶段。","source":"《三国志》卷1（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"地道","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-045","level":"hard","topic":"曹魏军政","category":"军事与决策","period":"197—207 官渡与河北归曹","question":"荀攸曾劝曹操以佯攻延津诱袁绍分兵，其主要配合的真正行动是什么？","options":{"A":"佯趋白马分敌，实际渡河袭邺","B":"佯撤官渡分敌，实际夜袭乌巢","C":"佯攻黎阳分敌，实际袭击延津辎重","D":"佯趋延津分敌，实际轻兵救白马"},"answer":"D","explanation":"荀攸提出佯趋延津以分袁军，曹操得以轻兵解白马之围。","source":"《三国志》卷10（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷10","source_locator":"荀攸","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-046","level":"hard","topic":"曹魏军政","category":"军事与决策","period":"197—207 官渡与河北归曹","question":"曹操在延津败文丑时，荀攸的作战建议侧重于什么？","options":{"A":"利用袁军争夺辎重、队形散乱时突击","B":"先烧辎重，使袁军失去争夺目标","C":"弃辎重退回官渡，等袁军步兵离散","D":"先让运粮船渡河，依船阻挡袁骑"},"answer":"A","explanation":"荀攸认为可利用敌军争取辎重时队形混乱，以少击多。","source":"《三国志》卷10（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷10","source_locator":"文醜","novel_note":"《武帝纪》记曹军在延津附近击破袁军并斩文丑，未将斩杀归于关羽；关羽斩颜良另有《关羽传》正文依据。"},{"id":"v15-047","level":"expert","topic":"曹魏军政","category":"史实与政略","period":"197—207 官渡与河北归曹","question":"关于许攸离袁赴曹的原因，下列哪项准确区分《武帝纪》正文与裴注引《曹瞒传》？","options":{"A":"正文记其反对南征、被逐；注引另记审配同意他出使曹操","B":"正文记其贪财、袁绍不能满足；注引另记家犯法、妻子被收","C":"正文记其因郭图谗言失宠；注引另记其家犯法但袁绍赦免","D":"正文记家犯法、妻子被收；注引另记其贪财、袁绍不能满足"},"answer":"B","explanation":"《武帝纪》正文记许攸贪财、袁绍不能满足；裴注引《曹瞒传》另说其家犯法、审配收其妻子，许攸因怒而离袁。史料有不同细节，应注明出处，不能把注引内容无标记地并入正文。","source":"《三国志》卷1《武帝纪》（正文及裴注引《曹瞒传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","option_explanations":{"A":"这里的正文不是以反对南征、被逐解释许攸来奔。","B":"《武帝纪》正文记许攸贪财、袁绍不能满足；裴注引《曹瞒传》另说其家犯法、审配收其妻子，许攸因怒而离袁。史料有不同细节，应注明出处，不能把注引内容无标记地并入正文。","C":"原文与注引没有这组郭图进谗、家人获赦的组合。","D":"将正文与《曹瞒传》注引的两种原因互换了。"}},{"id":"v15-048","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"197—207 官渡与河北归曹","question":"据《武帝纪》，曹操袭乌巢时袁绍如何分配救粮屯与攻曹营的兵力？","options":{"A":"以轻骑救乌巢，另以张郃、高览攻曹操主营","B":"全军转救乌巢，留下淳于琼攻曹操主营","C":"淳于琼撤乌巢来援，袁绍坚守原营","D":"张郃、高览救乌巢，袁绍自攻曹操主营"},"answer":"A","explanation":"正文既记袁绍遣骑救淳于琼，也记张郃、高览攻曹洪所守主营不下而降。不能说袁绍完全未救乌巢。攻曹营、救粮屯与部将投降应按传文分别表述。","source":"《三国志》卷1《武帝纪》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-049","level":"medium","topic":"曹魏军政","category":"军事与决策","period":"197—207 官渡与河北归曹","question":"袁绍在官渡败后，哪位谋士原已被其拘禁并在战败消息传来后被杀？","options":{"A":"审配","B":"沮授","C":"郭图","D":"田丰"},"answer":"D","explanation":"田丰先谏袁绍勿轻进，后被囚，袁绍战败回河北后将其杀害。","source":"《三国志》卷6（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"田豐","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-051","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"197—207 官渡与河北归曹","question":"邺城破后，曹操对袁绍旧臣陈琳的基本处置是什么？","options":{"A":"迁其入许，专任汉廷谏官而不属曹府","B":"免死归乡，禁止其再入曹氏幕府","C":"赦其旧怨，任用其文书才能","D":"留在冀州，令其续为袁氏家属作书"},"answer":"C","explanation":"陈琳曾为袁绍作讨曹檄文，曹操不以旧怨拒其文才，录用之。","source":"《三国志》卷21（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷21","source_locator":"陳琳","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-052","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"197—207 官渡与河北归曹","question":"曹操夺冀州后，将冀州当地名士崔琰任为何职从而参与州政？","options":{"A":"主簿","B":"典农都尉","C":"别驾从事","D":"治中从事"},"answer":"C","explanation":"《崔琰传》记曹操领冀州牧，辟崔琰为别驾从事。","source":"《三国志》卷12（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷12","source_locator":"別駕","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-054","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"197—207 官渡与河北归曹","question":"袁谭与袁尚相争时，袁谭曾用哪位人物充当使节与曹操议和？","options":{"A":"辛评","B":"郭图","C":"辛毗","D":"逢纪"},"answer":"C","explanation":"袁谭遣辛毗诣曹操，辛毗劝曹操趁袁氏内争进图河北。","source":"《三国志》卷25（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷25","source_locator":"辛毗","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-056","level":"hard","topic":"曹魏军政","category":"军事与决策","period":"197—207 官渡与河北归曹","question":"审配被俘临刑时，请求朝向何方，其给出的理由是什么？","options":{"A":"请求南向，表示要直面曹操","B":"请求西向，表示汉廷在西","C":"请求东向，表示旧都在东","D":"请求北向，表示旧主在北"},"answer":"D","explanation":"审配临刑表示其君在北方，故愿北面而死，体现其效忠袁氏。","source":"《三国志》卷6（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"審配","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-057","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"197—207 官渡与河北归曹","question":"并州高干曾在袁氏覆亡后再次反曹，曹操最终迫使其败逃的要地是哪处？","options":{"A":"邺城","B":"黎阳","C":"壶关","D":"井陉"},"answer":"C","explanation":"高干据并州叛曹，曹操围壶关，遂瓦解其在并州的基础。","source":"《三国志》卷1（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"壺關","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-059","level":"medium","topic":"曹魏军政","category":"军事与决策","period":"197—207 官渡与河北归曹","question":"为北征乌桓开辟捷径，田畴带曹军绕行哪条地理方向？","options":{"A":"由白马津渡河直趋辽东","B":"经卢龙塞旧道穿越险阻","C":"经傍海道沿海岸正面进军","D":"经居庸关转赴云中截击"},"answer":"B","explanation":"田畴熟悉幽州边塞，指引曹军经卢龙塞旧道迂回出乌桓背后。","source":"《三国志》卷11（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷11","source_locator":"田疇","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-060","level":"medium","topic":"曹魏军政","category":"军事与决策","period":"197—207 官渡与河北归曹","question":"田畴引曹军北征后，多次拒绝哪一种奖赏？","options":{"A":"封侯","B":"任护乌桓校尉","C":"任幽州刺史","D":"增领乌桓突骑"},"answer":"A","explanation":"田畴以自己归顺、导路是为讨乱为由，坚辞封爵。","source":"《三国志》卷11（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷11","source_locator":"封侯","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-061","level":"hard","topic":"曹魏军政","category":"军事与决策","period":"197—207 官渡与河北归曹","question":"郭嘉北征乌桓途中提出轻兵疾进，其要规避的主要作战风险是什么？","options":{"A":"先夺柳城、后击白狼山，以免敌军集结","B":"去辎重、轻兵兼道，以免拖延给敌备战时间","C":"保辎重、逐站建营，以免远征失去补给","D":"留骑兵护粮、以步兵先行，以免山区损马"},"answer":"B","explanation":"郭嘉主张留辎重、轻兵兼道以出其不意，而非由重装大军缓行。","source":"《三国志》卷14（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷14","source_locator":"郭嘉","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-066","level":"medium","topic":"东吴外交与战争","category":"军事与决策","period":"194—208 江东与淮南经营","
