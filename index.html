question":"孙策取江东过程中，丹杨太守周尚与哪位著名将领有亲族关系？","options":{"A":"周瑜之兄","B":"周瑜之祖父","C":"周瑜之从父","D":"周瑜之父"},"answer":"C","explanation":"《周瑜传》记周瑜从父周尚为丹杨太守，周瑜往省之，后来迎孙策于历阳。这里“从父”表示父亲的兄弟一辈亲属，不能简化为亲生父亲。","source":"《三国志》卷54（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"周尚","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-067","level":"hard","topic":"东吴外交与战争","category":"军事与决策","period":"194—208 江东与淮南经营","question":"裴注引《江表传》记孙策再见袁术，袁术将孙坚余兵多少人交还给他？","options":{"A":"千余人","B":"三千余人","C":"五千余人","D":"万人左右"},"answer":"A","explanation":"裴注引《江表传》记孙策先在丹杨募数百人，遭祖郎袭击后复往袁术处，获还孙坚余兵千余人。本题问该次交还数目，不能与此后渡江时总兵力或孙坚早年募兵数混同。","source":"《三国志》卷46《孙策传》（裴注引《江表传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙策","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-071","level":"medium","topic":"东吴外交与战争","category":"军事与决策","period":"194—208 江东与淮南经营","question":"会稽太守王朗败于孙策后，最终归附谁并在其政权中仕进？","options":{"A":"曹操","B":"袁绍","C":"刘表","D":"刘备"},"answer":"A","explanation":"王朗失会稽后辗转为曹操所辟，后来在曹魏官至三公。","source":"《三国志》卷13（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷13","source_locator":"王朗","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-072","level":"medium","topic":"东吴外交与战争","category":"史实与政略","period":"194—208 江东与淮南经营","question":"汉廷通过曹操承认孙策时，后来加授的将军号与爵位是哪一组？","options":{"A":"讨逆将军、吴侯","B":"征虏将军、吴郡太守","C":"破虏将军、乌程侯","D":"扬武将军、会稽太守"},"answer":"A","explanation":"《孙策传》记汉廷先有明汉将军之命，后拜讨逆将军、封吴侯。将军号和侯爵都不是地方太守职名，原题问“地方职务”不当。","source":"《三国志》卷46（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"討逆將軍","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-078","level":"medium","topic":"东吴外交与战争","category":"史实与政略","period":"194—208 江东与淮南经营","question":"黄祖被孙权攻灭前，其部将苏飞与甘宁之间有何关键关系？","options":{"A":"苏飞曾替甘宁向刘表请求江夏兵权","B":"苏飞曾在孙策军中救过甘宁","C":"苏飞曾射杀甘宁之父而后归吴","D":"苏飞曾荐举并帮助甘宁离开黄祖"},"answer":"D","explanation":"甘宁在黄祖处不得志，苏飞曾予以荐举，后来甘宁请孙权宽赦苏飞。","source":"《三国志》卷55（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷55","source_locator":"蘇飛","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-079","level":"hard","topic":"东吴外交与战争","category":"史实与政略","period":"194—208 江东与淮南经营","question":"裴注引《吴书》记甘宁为苏飞求免，哪项准确表述了他的举动与担保？","options":{"A":"请苏飞留作人质，待其部众全部来降","B":"主动辞去兵职，用所领部曲赎苏飞","C":"叩头流血求免，并以自身性命担保","D":"请在江夏立功后再释放苏飞"},"answer":"C","explanation":"注引《吴书》记甘宁下席叩头流血，为曾帮助自己的苏飞请求赦免；孙权担心苏飞逃走，甘宁表示愿以自己的首级相代。题目不把这段注引冒称为陈寿正文。","source":"《三国志》卷55《甘宁传》（裴注引《吴书》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷55","source_locator":"甘宁","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-080","level":"medium","topic":"东吴外交与战争","category":"史实与政略","period":"194—208 江东与淮南经营","question":"据《吴主传》，孙权208年击破黄祖后，对所获人口的记载是哪项？","options":{"A":"将俘获者全交曹操，换取江夏太守号","B":"虏其男女数万口","C":"只取黄祖将吏，令全部平民返回原居","D":"保留黄祖为太守，原人口仍归其独立管辖"},"answer":"B","explanation":"《吴主传》记攻灭黄祖后虏其男女数万口。可确认的是俘获人口；将他们纳入孙氏控制是据上下文的表述，不额外推定每个人的具体安置郡县。","source":"《三国志》卷47（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"江夏","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-081","level":"hard","topic":"东吴外交与战争","category":"军事与决策","period":"194—208 江东与淮南经营","question":"《孙翊传》正文与《孙韶传》裴注合读，哪项正确对应孙翊遇害的直接凶手与谋划者？","options":{"A":"妫览、戴员谋使边鸿刺杀孙翊","B":"孙权命周泰处死孙翊","C":"徐氏谋使孙高刺杀孙翊","D":"孙河谋使傅婴刺杀孙翊"},"answer":"A","explanation":"《孙翊传》正文记为左右边鸿所杀；《孙韶传》裴注引《吴历》补述妫览、戴员与边鸿（注引亦作边洪）谋变。直接刺杀者、幕后谋划者及后来的复仇者不能混为一人。","source":"《三国志》卷51《孙翊传、孙韶传》（正文及裴注引《吴历》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷51","source_locator":"孙翊、孙韶","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-082","level":"medium","topic":"东吴外交与战争","category":"史实与政略","period":"194—208 江东与淮南经营","question":"孙翊遇害后，配合孙翊之妻徐氏诛杀妫览、戴员的是哪两名孙家旧将？","options":{"A":"徐盛、丁奉","B":"孙河、孙韶","C":"孙高、傅婴","D":"吕范、朱治"},"answer":"C","explanation":"《孙韶传》正文记徐元、孙高、傅婴等杀妫览、戴员；裴注引《吴历》详记徐氏联系孙高、傅婴实施复仇。本题问徐氏联系的两名旧将，不等于正文只列这二人。","source":"《三国志》卷51《孙韶传》（裴注引《吴历》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷51","source_locator":"孙韶","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-083","level":"hard","topic":"东吴外交与战争","category":"军事与决策","period":"194—208 江东与淮南经营","question":"孙权遥领会稽太守却不亲至郡治时，委托顾雍履行何种地方职务？","options":{"A":"吴郡郡丞，行太守事","B":"会稽功曹，兼典农事务","C":"会稽郡丞，行太守事","D":"会稽太守，不再置郡丞"},"answer":"C","explanation":"《顾雍传》记孙权领会稽太守而不之郡，以顾雍为丞、行太守事；顾雍在郡内整治盗贼取得政绩。","source":"《三国志》卷52（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷52","source_locator":"顧雍","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-086","level":"hard","topic":"东吴外交与战争","category":"史实与政略","period":"194—208 江东与淮南经营","question":"孙策得知吴郡太守许贡曾向汉廷上表后将其杀害，许贡的主张是什么？","options":{"A":"许贡请求废孙策吴侯爵而赐给孙坚旧将","B":"许贡认为孙策骁勇，宜召还京师以制约","C":"许贡请求以孙权代孙策主持会稽事务","D":"许贡认为孙策善战，宜授荆州牧使其西征"},"answer":"B","explanation":"裴注引《江表传》记许贡称孙策有项籍之风，宜召还京邑，否则可能为外患。许贡曾为吴郡太守，原题误称“会稽许贡”。许贡门客后来报仇，又是另一事件。","source":"《三国志》卷46《孙策传》（裴注引《江表传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙策","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-087","level":"hard","topic":"东吴外交与战争","category":"史实与政略","period":"194—208 江东与淮南经营","question":"东吴名士严畯与诸葛瑾、步骘等在江东交游，孙权欲令严畯负责何项任务时他坚辞不受？","options":{"A":"代吕蒙主持濡须坞防御","B":"代程普任江夏太守","C":"代鲁肃督兵万人屯陆口","D":"代周瑜任南郡太守屯江陵"},"answer":"C","explanation":"严畯以自己书生不谙军事，拒绝继鲁肃统军的差遣。","source":"《三国志》卷53（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷53","source_locator":"嚴畯","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-091","level":"hard","topic":"东吴外交与战争","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"鲁肃论劝降时以个人与孙权利益不同举例，其推理前提是什么？","options":{"A":"鲁肃可归刘备，孙权只能在荆州另立政权","B":"臣下降曹尚可能仕进，孙权降曹将失去君主地位","C":"臣下降曹须弃家族，孙权降曹可保整个江东","D":"江东群臣皆主降，孙权抗曹须先更换全部官吏"},"answer":"B","explanation":"《鲁肃传》记鲁肃认为自己降曹后仍可作下曹从事、逐步仕进，孙权却无同样退路。题目考其当时以身份差异劝抗曹的论证；不能把这番判断写成曹操已经承诺的待遇。","source":"《三国志》卷54（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"肅可迎操","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-093","level":"medium","topic":"东吴外交与战争","category":"军事与决策","period":"208—215 赤壁与荆益格局","question":"曹操南征荆州时，受刘琮之降却先不应召，后为曹操任江夏太守的荆州将领是谁？","options":{"A":"魏延","B":"黄忠","C":"文聘","D":"霍峻"},"answer":"C","explanation":"文聘因守土失节而惭愧，曹操称其忠臣，用以守江夏。","source":"《三国志》卷18（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷18","source_locator":"文聘","novel_note":"荆州问题须区分208年后分治、215年议界与219年吴军袭取；“借荆州”是争议叙事，不能当作一次交付整州所有权。"},{"id":"v15-094","level":"hard","topic":"东吴外交与战争","category":"军事与决策","period":"208—215 赤壁与荆益格局","question":"曹操在赤壁战后撤离荆州南部时，江陵与襄阳仍由谁分别主持防卫？","options":{"A":"乐进守江陵，曹仁守襄阳","B":"曹仁守江陵，乐进守襄阳","C":"曹仁守江陵，于禁守襄阳","D":"夏侯尚守江陵，曹休守襄阳"},"answer":"B","explanation":"《武帝纪》记赤壁后留曹仁、徐晃于江陵，乐进于襄阳。正确项只对应两地主要将领，不意味着江陵只有曹仁一将，也不应把后来江陵失守后的部署倒写到此时。","source":"《三国志》卷1《武帝纪》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝","novel_note":"《周瑜传》把建策、诈降火攻归于黄盖，记当时东南风急；“借东风”、蒋干盗书及庞统献连环计不能据此传作为已证史实。"},{"id":"v15-095","level":"hard","topic":"东吴外交与战争","category":"军事与决策","period":"208—215 赤壁与荆益格局","question":"甘宁在夷陵被曹军包围时，哪位吴将建议让凌统留守、自己与周瑜驰援？","options":{"A":"韩当","B":"程普","C":"吕蒙","D":"凌统"},"answer":"C","explanation":"《吕蒙传》记吕蒙建议留凌统守营，自己与周瑜前去解甘宁之围，并在道路安排三百人柴断敌退路。凌统是被建议留守者，吕蒙是提出计划者。","source":"《三国志》卷54（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"夷陵","novel_note":"正史记陆逊待机反击及火攻，但不能由小说情节推定诸葛亮八阵图困陆逊或其他神异救援。"},{"id":"v15-096","level":"medium","topic":"东吴外交与战争","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"周瑜围江陵期间，甘宁先据哪处西线据点，以牵制曹仁？","options":{"A":"夷陵","B":"公安","C":"陆口","D":"夏口"},"answer":"A","explanation":"甘宁取夷陵后遭曹仁分兵围攻，周瑜、吕蒙前往救援。","source":"《三国志》卷55（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷55","source_locator":"夷陵","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-097","level":"medium","topic":"东吴外交与战争","category":"军事与决策","period":"208—215 赤壁与荆益格局","question":"周瑜军进击江陵时，周瑜本人曾遭什么伤情却仍出阵鼓励将士？","options":{"A":"刀伤左肩","B":"流矢伤右胁","C":"流矢伤左腿","D":"坠马伤右臂"},"answer":"B","explanation":"《周瑜传》记周瑜在江陵战事中被流矢伤右胁，曹仁闻其卧未起兵来攻，周瑜起而行军营激励士卒。右胁是传文明载，不能改成三气周瑜等小说致死情节。","source":"《三国志》卷54（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"右脅","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-099","level":"medium","topic":"东吴外交与战争","category":"军事与决策","period":"208—215 赤壁与荆益格局","question":"赤壁后刘备占有荆南诸郡期间，哪位零陵太守因在刘备入境时投降而非被魏军俘获？","options":{"A":"刘度","B":"韩玄","C":"金旋","D":"赵范"},"answer":"A","explanation":"《先主传》记武陵金旋、长沙韩玄、桂阳赵范、零陵刘度等郡响应刘备，性质需与曹魏守江陵区别。","source":"《三国志》卷32（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"零陵","novel_note":"《周瑜传》把建策、诈降火攻归于黄盖，记当时东南风急；“借东风”、蒋干盗书及庞统献连环计不能据此传作为已证史实。"},{"id":"v15-104","level":"medium","topic":"刘备入蜀与建国","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"刘璋遣法正到荆州迎刘备入蜀时，法正与谁已先谋划奉刘备代刘璋？","options":{"A":"郑度","B":"黄权","C":"董和","D":"张松"},"answer":"D","explanation":"法正、张松密谋迎刘备入益州，刘璋并不知其另有更易政权的意图。","source":"《三国志》卷37（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"張松","novel_note":"荆州问题须区分208年后分治、215年议界与219年吴军袭取；“借荆州”是争议叙事，不能当作一次交付整州所有权。"},{"id":"v15-105","level":"medium","topic":"刘备入蜀与建国","category":"军事与决策","period":"208—215 赤壁与荆益格局","question":"张松和法正在劝刘备取益州时，哪个益州官员反对引外军入境并向刘璋进谏？","options":{"A":"法正","B":"张松","C":"许靖","D":"黄权"},"answer":"D","explanation":"黄权劝刘璋不要轻迎刘备，并非所有益州士人都赞同。","source":"《三国志》卷43（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"黃權","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-107","level":"medium","topic":"刘备入蜀与建国","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"张松密谋刘备取益州，事情暴露而遭刘璋诛杀，与哪位亲属告发有关？","options":{"A":"其兄张肃","B":"其子张翼","C":"其弟张任","D":"其父张衡"},"answer":"A","explanation":"《刘璋传》记张松兄广汉太守张肃白其谋，刘璋收斩张松。张任是刘璋军中另一人物，不是张松的弟弟；后者在雒城战事中的遭遇也应另读。","source":"《三国志》卷31《刘璋传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷31","source_locator":"刘璋","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-109","level":"hard","topic":"刘备入蜀与建国","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"刘备攻雒县期间，哪位刘璋方面将领后来被俘拒降而遭处死？","options":{"A":"黄权","B":"张任","C":"李严","D":"吴懿"},"answer":"B","explanation":"《先主传》裴注引《益部耆旧杂记》记张任在雒城战事中被执，不肯改事二主，刘备杀之。指定注引可以避免把演义落凤坡射杀庞统的情节并入正文。","source":"《三国志》卷32《先主传》（裴注引《益部耆旧杂记》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"先主","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-111","level":"medium","topic":"刘备入蜀与建国","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"刘备得成都后，刘璋最终被安置在何处而非直接在成都任官？","options":{"A":"江陵","B":"公安","C":"汉中","D":"成都"},"answer":"B","explanation":"刘备得益州后迁刘璋于公安，后来孙权取荆州又曾扶立刘璋为益州牧名义。","source":"《三国志》卷31（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷31","source_locator":"公安","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-115","level":"hard","topic":"东吴外交与战争","category":"军事与决策","period":"208—215 赤壁与荆益格局","question":"吕蒙诱零陵太守郝普投降时，最核心的欺敌信息是什么？","options":{"A":"谎称刘璋复领益州，刘备已降曹操","B":"谎称刘备困于汉中、关羽在南郡，均不能救零陵","C":"谎称魏军已破零陵，劝郝普先退武陵","D":"谎称刘备已到公安，关羽即将先袭长沙"},"answer":"B","explanation":"《吕蒙传》记吕蒙明知刘备已到公安、关羽在益阳，仍对郝普的故人邓玄之宣称刘备被困汉中、关羽困在南郡，二人无力救零陵。关键是故意隐瞒真实军情，不是郝普受公开议界命令而降。","source":"《三国志》卷54（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"郝普","novel_note":"荆州问题须区分208年后分治、215年议界与219年吴军袭取；“借荆州”是争议叙事，不能当作一次交付整州所有权。"},{"id":"v15-117","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"刘晔建议曹操刚平汉中便急进蜀地，其论证中的时机条件是什么？","options":{"A":"孙权愿放弃荆州、与曹操同时入蜀","B":"刘备已将主力移往江东，成都全无兵守","C":"张鲁承诺率旧部入蜀，故不必经营补给","D":"刘备新得益州、人心未固，可乘蜀人震动急进"},"answer":"D","explanation":"裴注引《傅子》记刘晔建议趁刘备新得益州、蜀人震动时继续进兵。这是未被采用的时机判断，不能由建议倒推成都无人守、孙权已经答应同时伐蜀。","source":"《三国志》卷14《刘晔传》（裴注引《傅子》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷14","source_locator":"刘晔","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-119","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"曹操取得汉中时，张鲁为何先拒绝焚毁库藏并决定封存？","options":{"A":"府库不足供军，应先封存避免兵士争抢","B":"府库应交刘璋管理，不能献给曹操","C":"府库为教团私产，应留待汉中民众分取","D":"府库为国家所有，不应因撤退焚毁"},"answer":"D","explanation":"《张鲁传》载张鲁撤离时封藏府库，称国家所有不应焚，曹操嘉其举措。","source":"《三国志》卷8（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"封藏","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-120","level":"medium","topic":"边疆与地方治理","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"张鲁在汉中推行“五斗米道”管理期间，处理小错的一项特点是什么？","options":{"A":"只罚非教徒，教徒永不受刑","B":"犯法先宽宥三次，之后才施刑","C":"初犯即重刑，复犯才准赎罪","D":"由祭酒按财产多寡确定刑罚"},"answer":"B","explanation":"张鲁教团政教相连，曾设祭酒管理教化，强调宽刑与赎罪。","source":"《三国志》卷8（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"祭酒","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-121","level":"medium","topic":"边疆与地方治理","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"张鲁治理汉中，史书所记“义舍”的直接功能是什么？","options":{"A":"供祭酒专用、普通行人不得入","B":"供教徒定期集中领田租","C":"供过往行人按需要取米肉","D":"供驻军征发粮食与军器"},"answer":"C","explanation":"张鲁在道路置义舍，供往来者自取饮食，形成其政教秩序的一部分。","source":"《三国志》卷8（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"義舍","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-122","level":"medium","topic":"边疆与地方治理","category":"史实与政略","period":"208—215 赤壁与荆益格局","question":"汉中平定后，曹操对张鲁采取的安排是什么？","options":{"A":"免死迁许，但不许宗属留居","B":"仍留汉中以宗教身份自行称王","C":"迁其入邺为质，不给官爵","D":"礼遇封侯，宗属亦获封赏"},"answer":"D","explanation":"张鲁归曹后受礼遇封侯，家族多人获封，汉中随后改由曹魏部将控制。","source":"《三国志》卷8（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"張魯","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-125","level":"hard","topic":"东吴外交与战争","category":"军事与决策","period":"208—215 赤壁与荆益格局","question":"裴注引《江表传》记孙权撤出合肥、跨越断桥时，谁在马后加鞭助其超度？","options":{"A":"谷利","B":"周泰","C":"甘宁","D":"凌统"},"answer":"A","explanation":"《吴主传》裴注引《江表传》记谷利让孙权持鞍缓控，自己在后加鞭，帮助马跃过桥缺。孙权骑马，谷利助势，不能说谷利“为其驾马”；小说叙述须与所引材料区分。","source":"《三国志》卷47《吴主传》（裴注引《江表传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"吴主","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-127","level":"expert","topic":"东吴外交与战争","category":"军事与决策","period":"208—215 赤壁与荆益格局","question":"裴注引《吴录》记修筑濡须坞的讨论。哪项准确对应诸将意见与吕蒙的反驳？","options":{"A":"诸将以为可上岸迎敌、退则入船；吕蒙认为敌步骑紧逼时未必来得及","B":"孙权以为舟师不必上岸作战；吕蒙认为必须弃船固守水口","C":"吕蒙以为可上岸迎敌、退则入船；诸将认为敌步骑紧逼时未必来得及","D":"诸将以为修坞后舟船无用；吕蒙主张将船全撤回建业再修坞"},"answer":"A","explanation":"注引《吴录》记诸将以为上岸击敌、洗足入船即可，不必筑坞；吕蒙指出战无百胜，若敌步骑紧逼，未必来得及退船。孙权认可吕蒙而筑坞。原题把诸将意见误作孙权担心，又把吕蒙的反驳倒置。","source":"《三国志》卷54《吕蒙传》（裴注引《吴录》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"吕蒙","novel_note":"荆州问题须区分208年后分治、215年议界与219年吴军袭取；“借荆州”是争议叙事，不能当作一次交付整州所有权。","option_explanations":{"A":"注引《吴录》记诸将以为上岸击敌、洗足入船即可，不必筑坞；吕蒙指出战无百胜，若敌步骑紧逼，未必来得及退船。孙权认可吕蒙而筑坞。原题把诸将意见误作孙权担心，又把吕蒙的反驳倒置。","B":"原文没有把孙权的意见写成舟师不必上岸；孙权认可吕蒙筑坞。","C":"倒置诸将和吕蒙的意见：诸将认为可随时回船，吕蒙才提出紧逼风险。","D":"传文说敌军逼迫时来不及入船，不是筑坞后船无用，更不是全撤回建业。"}},{"id":"v15-129","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"216—223 汉中襄樊与三国建国","question":"曹操选择继承人时，贾诩借提及袁绍、刘表父子的先例主要劝其避免什么？","options":{"A":"以公孙度、公孙康为鉴，主张先分封诸子","B":"以孙策、孙权为鉴，主张由年少而能者继位","C":"以袁绍、刘表父子为鉴，暗示慎重处理废长立少","D":"以刘焉、刘璋为鉴，主张由群臣投票推戴"},"answer":"C","explanation":"贾诩以袁绍、刘表因继承问题内部分裂为鉴，暗示曹操慎重处理曹丕、曹植之争。","source":"《三国志》卷10（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷10","source_locator":"賈詡","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-130","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"216—223 汉中襄樊与三国建国","question":"在曹丕、曹植争夺继承权期间，曹操曾密问崔琰，崔琰如何答复？","options":{"A":"露板答复，主张依嫡长次序立曹丕","B":"秘密答复，主张并封曹丕与曹植以分权","C":"露板答复，主张先立曹彰再议储君","D":"秘密答复，主张立姻亲曹植"},"answer":"A","explanation":"崔琰以立长为原则，露板答曹操，不顾曹植为其姻亲。","source":"《三国志》卷12（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷12","source_locator":"立子以長","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-131","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"216—223 汉中襄樊与三国建国","question":"曹操晚年处理杨修时，杨修与哪位争储王子的关系尤其密切？","options":{"A":"曹熊","B":"曹植","C":"曹丕","D":"曹彰"},"answer":"B","explanation":"杨修助曹植参与争储，曹操忌其聪敏与关系，最后杀杨修。","source":"《三国志》卷19（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷19","source_locator":"楊脩","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-132","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"216—223 汉中襄樊与三国建国","question":"曹操攻汉中后，为控制人口与阻隔刘备势力，曾从哪一地区大批迁民入关中？","options":{"A":"河北","B":"淮南","C":"河东","D":"汉中"},"answer":"D","explanation":"曹操取汉中后迁移汉中民众进入关中等地，既调整边区人口也关乎资源和防卫。","source":"《三国志》卷1（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"漢中","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-136","level":"medium","topic":"蜀汉战略与北伐","category":"军事与决策","period":"216—223 汉中襄樊与三国建国","question":"夏侯渊在定军山败亡后，郭淮等推举谁为军主以稳定曹军？","options":{"A":"张郃","B":"曹洪","C":"徐晃","D":"郭淮"},"answer":"A","explanation":"《张郃传》《郭淮传》记夏侯渊死后军中扰动，郭淮主张推张郃统摄诸军。汉中随后还有曹操亲临与最终撤军，不是夏侯渊死后曹军立即全部投降。","source":"《三国志》卷17（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷17","source_locator":"張郃","novel_note":"《黄忠传》记黄忠军攻杀夏侯渊；“五虎上将”不是蜀汉正式官号，不宜倒推将军授任与班序。"},{"id":"v15-138","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"216—223 汉中襄樊与三国建国","question":"对照《关羽传》与《蒋济传》，曹操因关羽攻樊考虑迁许都，哪项准确对应劝止者与建议？","options":{"A":"司马懿、刘晔建议先弃樊城，集中救江陵","B":"贾诩、蒋济建议利用刘备不愿关羽坐大的矛盾","C":"贾诩、刘晔建议移汉廷到邺，再联合孙吴","D":"司马懿、蒋济建议利用孙权不愿关羽坐大的矛盾"},"answer":"D","explanation":"《关羽传》记司马懿、蒋济判断孙权不愿关羽得志，可利用孙吴牵制；《蒋济传》也保存劝止迁都的分析。此时荀彧、郭嘉均已去世。两人建议与孙权自己的袭荆州决策有关，但不是代孙权直接指挥吴军。","source":"《三国志》卷36《关羽传》（正文；参卷14《蒋济传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"关羽","novel_note":"荆州问题须区分208年后分治、215年议界与219年吴军袭取；“借荆州”是争议叙事，不能当作一次交付整州所有权。","option_explanations":{"A":"把刘晔代入劝止组合，又把坚守待援改成弃樊。","B":"本段劝止者是司马懿、蒋济，所分析的是孙权而非刘备对关羽扩大的顾虑。","C":"没有先迁邺再联吴的步骤；劝说的要点正是不用迁都。","D":"《关羽传》记司马懿、蒋济判断孙权不愿关羽得志，可利用孙吴牵制；《蒋济传》也保存劝止迁都的分析。此时荀彧、郭嘉均已去世。两人建议与孙权自己的袭荆州决策有关，但不是代孙权直接指挥吴军。"}},{"id":"v15-139","level":"hard","topic":"曹魏军政","category":"军事与决策","period":"216—223 汉中襄樊与三国建国","question":"关羽攻樊、汉水暴涨之际，徐晃率援军采取何种战术以扰关羽围军？","options":{"A":"佯攻四冢，实际攻击围头","B":"佯攻江陵，实际攻击公安","C":"佯攻公安，实际攻击江陵","D":"佯攻围头，实际攻击四冢"},"answer":"D","explanation":"《徐晃传》记佯攻围头、实向四冢，关羽出战不利，樊城之围遂解。","source":"《三国志》卷17（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷17","source_locator":"四冢","novel_note":"荆州问题须区分208年后分治、215年议界与219年吴军袭取；“借荆州”是争议叙事，不能当作一次交付整州所有权。"},{"id":"v15-145","level":"hard","topic":"刘备入蜀与建国","category":"军事与决策","period":"216—223 汉中襄樊与三国建国","question":"刘备拜黄忠为后将军，关羽不愿与老兵同列；哪位使者解释后使关羽受拜？","options":{"A":"简雍","B":"费诗","C":"伊籍","D":"费祎"},"answer":"B","explanation":"《费诗传》记刘备为汉中王，拜关羽为前将军、黄忠为后将军。关羽因同列将军而不悦，不是黄忠也被拜前将军。费诗以功业与刘备亲重劝说，关羽遂受拜。","source":"《三国志》卷41《费诗传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷41","source_locator":"费诗","novel_note":"荆州问题须区分208年后分治、215年议界与219年吴军袭取；“借荆州”是争议叙事，不能当作一次交付整州所有权。"},{"id":"v15-147","level":"hard","topic":"刘备入蜀与建国","category":"史实与政略","period":"216—223 汉中襄樊与三国建国","question":"《赵云传》裴注引《云别传》记刘备欲伐吴，赵云主张先讨哪一方？","options":{"A":"孙吴，应先取荆州再讨曹魏","B":"曹魏，应先讨国贼再处理吴蜀争端","C":"南中，应先平叛乱再议吴魏","D":"关中，应与孙权约定同时进攻"},"answer":"B","explanation":"注引《云别传》记赵云以国贼为曹氏而非孙权，曹丕篡汉后应早图关中，反对先打孙吴。这是注引所载意见，不是陈寿正文的一条实际执行命令。","source":"《三国志》卷36《赵云传》（裴注引《云别传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"赵云","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-149","level":"hard","topic":"东吴外交与战争","category":"军事与决策","period":"216—223 汉中襄樊与三国建国","question":"陆逊在夷陵取胜后，对吴军诸将追击白帝的建议作何回应？","options":{"A":"警惕曹魏乘虚来攻，收兵不再深入","B":"蜀军已重新据夷陵，须先守住旧战场","C":"孙权要求西征成都，陆逊主先取南中","D":"江陵将领已独立，须率军回师平叛"},"answer":"A","explanation":"陆逊顾虑曹魏可能趁吴军深入反击，未无限追击刘备。","source":"《三国志》卷58（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"白帝","novel_note":"正史记陆逊待机反击及火攻，但不能由小说情节推定诸葛亮八阵图困陆逊或其他神异救援。"},{"id":"v15-151","level":"hard","topic":"蜀汉战略与北伐","category":"军事与决策","period":"216—223 汉中襄樊与三国建国","question":"《陆逊传》在夷陵战果中列举的降将是哪一组？","options":{"A":"张南、冯习","B":"杜路、刘宁","C":"傅肜、程畿","D":"马良、黄权"},"answer":"B","explanation":"《陆逊传》记斩张南、冯习等，杜路、刘宁等降。正文并未在这里逐一写这两人为水军统帅，原题“负责水军”应删去；战死、降吴和黄权归魏是不同结局。","source":"《三国志》卷58（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"杜路","novel_note":"正史记陆逊待机反击及火攻，但不能由小说情节推定诸葛亮八阵图困陆逊或其他神异救援。"},{"id":"v15-154","level":"medium","topic":"曹魏军政","category":"军事与决策","period":"216—223 汉中襄樊与三国建国","question":"曹丕发动三路攻吴时，东路曹休主要对峙的江淮战线是哪一处？","options":{"A":"濡须","B":"洞口","C":"皖城","D":"江陵"},"answer":"B","explanation":"黄初三年曹休向洞口，曹仁向濡须，曹真、夏侯尚等攻江陵。题目限定曹休的东路，三处均为实际战线；不能靠把剑阁、木门等蜀战场当作干扰项来伪造难度。","source":"《三国志》卷2《文帝纪》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷02","source_locator":"文帝","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-155","level":"hard","topic":"东吴外交与战争","category":"军事与决策","period":"216—223 汉中襄樊与三国建国","question":"吴将吕范在曹丕南征洞口战事中的主要战场职责是什么？","options":{"A":"驻濡须抗曹仁，趁魏军分兵袭濡须坞","B":"督吴军抵御曹休，舟师又受暴风损害","C":"驻夷陵抗刘备，火攻后追至白帝","D":"率陆军救朱然，江陵水道被魏军截断"},"answer":"B","explanation":"《吕范传》记吕范督军御曹休等，吴军遭暴风、人马多损，后来贺齐等舟船与鲜于丹援军形成新的局势。对抗曹休是吕范职责，不能把整场战役概括为吴军毫无损失。","source":"《三国志》卷56（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷56","source_locator":"呂範","novel_note":"孟获及七纵七擒见裴注引《汉晋春秋》等材料，不能一概说成小说虚构，也不能冒称《诸葛亮传》正文；祝融、藤甲兵等小说细节需另辨。"},{"id":"v15-159","level":"hard","topic":"蜀汉战略与北伐","category":"军事与决策","period":"216—223 汉中襄樊与三国建国","question":"刘备托孤给李严时，李严获授的具体军政职务及驻地是什么？","options":{"A":"尚书令，统内外军事，留镇江州","B":"中护军，统荆州诸军，留镇公安","C":"军师将军，统成都政务，留镇汉中","D":"中都护，统内外军事，留镇永安"},"answer":"D","explanation":"《李严传》载拜中都护，统内外军事，留镇永安；诸葛亮另受命辅政。","source":"《三国志》卷40（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷40","source_locator":"中都護","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-163","level":"hard","topic":"蜀汉战略与北伐","category":"史实与政略","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"南中叛乱中，李恢曾遭围于哪一地区，后通过示弱诱敌脱困？","options":{"A":"味县","B":"且兰","C":"昆明","D":"邛都"},"answer":"C","explanation":"《李恢传》记至昆明被围，李恢骗敌称双方同乡、官军粮少将还，自己准备与当地共事。对方围稍宽后他出击，继而与诸葛亮军相连。昆明是当时地域称谓，不直接等于现代城市边界。","source":"《三国志》卷43（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"昆明","novel_note":"孟获及七纵七擒见裴注引《汉晋春秋》等材料，不能一概说成小说虚构，也不能冒称《诸葛亮传》正文；祝融、藤甲兵等小说细节需另辨。"},{"id":"v15-165","level":"expert","topic":"蜀汉战略与北伐","category":"军事与决策","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"比较《诸葛亮传》正文和裴注，南征后“不留外兵”的理由在何处、包含什么？","options":{"A":"不留外兵的三项理由见正文，南征及南方军资见注引《汉晋春秋》","B":"南征和南方军资见正文，不留外兵的兵力、粮运及怨嫌理由见注引《汉晋春秋》","C":"南征和南方军资见正文，注引《汉晋春秋》只说缺粮，不谈兵少及地方怨嫌","D":"南征见正文，不留外兵的三项理由见注引《魏略》，南方军资仅见注引"},"answer":"B","explanation":"南征与军资出于南方见正文；详细“不留兵、不运粮”论述见裴注引《汉晋春秋》，包括留兵少无力、多则粮运困难及外人与当地易生怨嫌。它不等于蜀汉取消全部郡县或终止当地兵赋征调。","source":"《三国志》卷35《诸葛亮传》（正文及裴注引《汉晋春秋》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮","novel_note":"孟获及七纵七擒见裴注引《汉晋春秋》等材料，不能一概说成小说虚构，也不能冒称《诸葛亮传》正文；祝融、藤甲兵等小说细节需另辨。","option_explanations":{"A":"把正文与裴注的记载层次对换了。","B":"南征与军资出于南方见正文；详细“不留兵、不运粮”论述见裴注引《汉晋春秋》，包括留兵少无力、多则粮运困难及外人与当地易生怨嫌。它不等于蜀汉取消全部郡县或终止当地兵赋征调。","C":"注引除了运粮，还讨论少兵不能控制与当地怨嫌，不能缩成单一缺粮。","D":"三项理由所引为《汉晋春秋》，不是《魏略》；南方军资还见正文。"}},{"id":"v15-167","level":"hard","topic":"蜀汉战略与北伐","category":"史实与政略","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"《出师表》提到向宠并建议将营中事务委任他，向宠此前参与哪次失败退却而仍获好评？","options":{"A":"夷陵东征","B":"陈仓攻坚","C":"第一次祁山之役","D":"汉中争夺"},"answer":"A","explanation":"向宠在刘备东征时所属部伍特别完好，受刘备称许，故诸葛亮建议用之。","source":"《三国志》卷35（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"向寵","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-173","level":"hard","topic":"蜀汉战略与北伐","category":"军事与决策","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"《明帝纪》裴注引《魏略》记陈仓攻防，郝昭怎样应对蜀军云梯？","options":{"A":"用火箭烧毁云梯","B":"开城门以骑兵冲击云梯","C":"引水浸湿城下梯身","D":"以长矛推翻云梯"},"answer":"A","explanation":"郝昭守陈仓的攻防细节见《明帝纪》裴注引《魏略》：云梯以火箭焚，冲车以石磨压，井阑以重墙应对，地突以内穿地横截。原题所谓独立的《郝昭传》不够准确。","source":"《三国志》卷3《明帝纪》（裴注引《魏略》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷03","source_locator":"明帝","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-175","level":"hard","topic":"蜀汉战略与北伐","category":"军事与决策","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"曹魏在陈仓方向的防守中，谁此前坚持修筑陈仓城，因而有利于郝昭守城？","options":{"A":"司马懿","B":"郭淮","C":"曹真","D":"张郃"},"answer":"C","explanation":"《曹真传》记曹真判断诸葛亮因祁山受挫，后出必从陈仓，命郝昭、王生守城并修筑。曹真筹建与郝昭临战守城是两种不同职责。","source":"《三国志》卷9《曹真传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"曹真","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-178","level":"hard","topic":"蜀汉战略与北伐","category":"军事与决策","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"建兴九年北伐时，蜀将王平临战率少兵在祁山方向应对何种情况？","options":{"A":"张郃攻击王平所守的南围，王平坚持防守","B":"司马懿攻破王平营地，王平转守街亭","C":"邓艾攻击蜀军后方，王平舍营救魏延","D":"郭淮切断王平粮道，王平撤回陈仓"},"answer":"A","explanation":"《王平传》记建兴九年诸葛亮围祁山，王平别守南围，张郃攻平，平坚守不动。地点与部署须按本传，不是街亭败后的那次鸣鼓收军。","source":"《三国志》卷43《王平传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷43","source_locator":"王平","novel_note":"北伐各次路线、统帅与补给条件不同，不能将陈仓、祁山、五丈原合为一役；禳星续命等演义情节不作史实依据。"},{"id":"v15-179","level":"expert","topic":"蜀汉战略与北伐","category":"军事与决策","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"《李严传》如何记载李平在231年粮运不继后的三层文书与传话矛盾？","options":{"A":"先派狐忠、成藩召还，后称粮足何以返，又向刘禅称佯退诱敌","B":"先派狐忠、成藩传刘禅诏令，后诸葛亮自行退兵，最后李平报告雨停粮足","C":"先称粮足何以返，后派狐忠、成藩催还，最后向刘禅称主动撤围","D":"先向刘禅称佯退诱敌，后派狐忠、成藩催出军，最后承认粮尽"},"answer":"A","explanation":"李严改名李平。因霖雨运粮不继，他派参军狐忠、督军成藩传意令诸葛亮还军；军退后又称粮足何以返；再对刘禅称军队佯退诱敌。诸葛亮列示前后文书，使其无法解释。要区分召还者、受命撤军者和事后对皇帝的说法。","source":"《三国志》卷40《李严传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷40","source_locator":"李严","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","option_explanations":{"A":"李严改名李平。因霖雨运粮不继，他派参军狐忠、督军成藩传意令诸葛亮还军；军退后又称粮足何以返；再对刘禅称军队佯退诱敌。诸葛亮列示前后文书，使其无法解释。要区分召还者、受命撤军者和事后对皇帝的说法。","B":"是李平派人传还军意，不能改称二人传刘禅诏书；文书矛盾也是关键。","C":"召还在先，军退后李平才反问粮足何以返，不是此序。","D":"狐忠、成藩传的是还军意，不是催出军；对刘禅的诱敌说在还军之后。"}},{"id":"v15-183","level":"medium","topic":"东吴外交与战争","category":"军事与决策","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"石亭战后曹休因败而郁愤，随后发生何事，使魏军主将更替？","options":{"A":"自杀","B":"被处死","C":"阵亡","D":"病卒"},"answer":"D","explanation":"曹休败归后患病去世，并非临阵被吴将斩首。","source":"《三国志》卷9（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"曹休","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-185","level":"medium","topic":"东吴外交与战争","category":"史实与政略","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"吴黄龙元年孙权称帝时，谁从蜀汉奉命前来表示祝贺并缔结约定？","options":{"A":"费祎","B":"张温","C":"邓芝","D":"陈震"},"answer":"D","explanation":"《陈震传》记建兴七年孙权称帝，陈震以卫尉身份前往庆贺，并盟约交分天下。邓芝主要见较早的修好外交，张温是吴使，两者不能因都出使就替换为此次蜀使。","source":"《三国志》卷39《陈震传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷39","source_locator":"陈震","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-187","level":"hard","topic":"东吴外交与战争","category":"史实与政略","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"孙权派出卫温、诸葛直远航夷洲亶洲时，最终带回何种结果更符合史书记载？","options":{"A":"至亶洲并带回其王，未到夷洲","B":"两洲皆未至，只与辽东交换使者","C":"未至亶洲，只带回夷洲数千人","D":"两洲皆至，但没有带回人口"},"answer":"C","explanation":"《吴主传》记卫温、诸葛直浮海求夷洲、亶洲，亶洲远而未至，只得夷洲数千人还；军士因疾病损失甚多，后两将受诛。史书名称与现代岛屿定位应分开，不将某种现代说法当作确定航线。","source":"《三国志》卷47（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"夷洲","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-189","level":"hard","topic":"东吴外交与战争","category":"史实与政略","period":"223—234 魏蜀吴对峙与诸葛北伐","question":"诸葛恪受命经营丹杨山越后，采取的主要办法是什么？","options":{"A":"立即分兵深入山谷，逐寨正面强攻","B":"迁郡县百姓入山，与山越共同耕作","C":"许山越不入户籍，换取其永久提供兵员","D":"封锁谷口和粮源，待山民粮尽出降"},"answer":"D","explanation":"《诸葛恪传》记丹杨山民依险自保，诸葛恪分据谷口，禁止平地人输谷入山，并待山中粮源耗竭再招降。不是率兵逐寨硬攻，更不等于完全放弃郡县户籍控制。","source":"《三国志》卷64（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷64","source_locator":"丹楊","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-200","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"魏明帝曹叡临终托孤人选发生变化，刘放、孙资在其中主要发挥何种作用？","options":{"A":"刘放、孙资坚持曹宇、曹肇顾命，排除曹爽","B":"曹宇与曹肇共同荐司马懿，刘放反对","C":"曹爽以兵围宫迫曹叡改诏，孙资出逃","D":"刘放、孙资影响顾命人选，最终为曹爽、司马懿"},"answer":"D","explanation":"《刘放传》记魏明帝临终曾拟曹宇等辅政，刘放、孙资多次影响人选，最后曹爽、司马懿受托。传文与裴注另保存对刘放、孙资行为的批评，不能把顾命过程简化为没有争议的自愿推举。","source":"《三国志》卷14《刘放传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷14","source_locator":"刘放","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-201","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"曹叡最初考虑辅政的人选中，曾涉及哪位曹氏宗王而后作罢？","options":{"A":"陈王曹植","B":"楚王曹彪","C":"东海王曹霖","D":"燕王曹宇"},"answer":"D","explanation":"《明帝纪》《刘放传》记曹叡一度以燕王曹宇为大将军参与顾命安排，后来改变。曹彪是王凌谋议迎立的楚王，曹霖则是曹髦之父，须分别对应事件。","source":"《三国志》卷14《刘放传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷14","source_locator":"刘放","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-203","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"曹爽集团中主张改革官制、曾与何晏等人共同掌权的谋士是哪位？","options":{"A":"邓飏","B":"丁仪","C":"丁谧","D":"丁廙"},"answer":"C","explanation":"丁谧为曹爽亲信，参与集团行政安排，与后世东吴丁奉非一人。","source":"《三国志》卷9（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"丁謐","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-204","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"曹爽执政期间，名士何晏在中央担任何种要职并参与选举人事？","options":{"A":"尚书令","B":"吏部尚书","C":"中书监","D":"侍中"},"answer":"B","explanation":"何晏任吏部尚书，参与官吏选举，属于曹爽集团的中央用人核心。","source":"《三国志》卷9（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"何晏","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-205","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"高平陵之变前，曹爽安排李胜出任荆州刺史，李胜借辞行试探谁的状况？","options":{"A":"司马师","B":"蒋济","C":"司马懿","D":"高柔"},"answer":"C","explanation":"《曹爽传》裴注引《魏末传》记李胜辞行试探司马懿，后者装作病笃、听觉失常，使李胜误报其不足为虑。这个细节须注明注引来源；不能以表演倒推司马懿毫无真实疾病。","source":"《三国志》卷9《曹爽传》（裴注引《魏末传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"曹爽","novel_note":"荆州问题须区分208年后分治、215年议界与219年吴军袭取；“借荆州”是争议叙事，不能当作一次交付整州所有权。"},{"id":"v15-207","level":"hard","topic":"曹魏军政","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"高平陵之变中，曹爽拒从桓范建议的主要后果是什么？","options":{"A":"没有赴许昌据帝与武库，而选择交出权力","B":"没有归洛阳而赴邺城，因河北不响应失势","C":"赴许昌后武库被封，转向寿春求援","D":"先归洛阳控制禁军，因曹芳反对而失势"},"answer":"A","explanation":"《曹爽传》正文与裴注记桓范劝曹爽挟皇帝赴许昌，利用武库及粮食组织抵抗。曹爽没有采用而交权，后来被诛。桓范方案未执行，不能写成已经控制许昌或必定可以获胜。","source":"《三国志》卷9《曹爽传》（正文及裴注引《魏略》《魏末传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"曹爽","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-209","level":"medium","topic":"曹魏军政","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"辽东公孙渊自立燕王时所采用的年号是什么？","options":{"A":"延康","B":"绍汉","C":"青龙","D":"太和"},"answer":"B","explanation":"公孙渊自称燕王，建元绍汉，属对魏叛立名号。","source":"《三国志》卷8（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"紹漢","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-213","level":"medium","topic":"边疆与地方治理","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"《魏书·东夷传》所载授卑弥呼的诏书，给女王的名号是哪一项？","options":{"A":"亲魏倭王","B":"率善中郎将","C":"率善校尉","D":"归义侯"},"answer":"A","explanation":"《东夷传》记授卑弥呼亲魏倭王、金印紫绶；难升米另授率善中郎将，牛利授率善校尉。女王、使者官号与印绶应分别对应。相关景初年次有校勘争议，本题不据此定精确公历年。","source":"《三国志》卷30《东夷传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷30","source_locator":"东夷","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-215","level":"hard","topic":"蜀汉战略与北伐","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"蒋琬北伐路线争论中，朝臣反对轻易顺流东下的核心顾虑是什么？","options":{"A":"取上庸后必失汉中，不能同时设防","B":"顺流进兵容易，失利时逆流退还困难","C":"水师易征发，但魏兴、上庸不通汉沔","D":"顺流运输困难，逆流撤退反而方便"},"answer":"B","explanation":"《蒋琬传》记蒋琬认为诸葛亮越秦川道险运艰，拟由汉、沔东下取魏兴、上庸。群臣担心失败时逆流退还困难，且蒋琬久病，计划没有按原样实施。不能把未行计划写成蜀军已经攻入上庸。","source":"《三国志》卷44《蒋琬传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"蒋琬","novel_note":"北伐各次路线、统帅与补给条件不同，不能将陈仓、祁山、五丈原合为一役；禳星续命等演义情节不作史实依据。"},{"id":"v15-217","level":"medium","topic":"蜀汉战略与北伐","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"蜀汉宦官黄皓早年受谁制约，因而在该臣任内不敢肆意干政？","options":{"A":"董和","B":"董允","C":"董厥","D":"费祎"},"answer":"B","explanation":"《董允传》记董允秉正，黄皓敬惮，不敢为非，后来其势日盛。","source":"《三国志》卷39（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷39","source_locator":"董允","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-218","level":"hard","topic":"蜀汉战略与北伐","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"蜀汉大臣董允在刘禅后宫问题上的主要政治立场是什么？","options":{"A":"赞同扩充后宫但反对黄皓掌军","B":"仅限制外戚，不干预宦官参与朝政","C":"只要求后宫节用，不反对增选女子","D":"反对扩充后宫并抑制黄皓干政"},"answer":"D","explanation":"董允坚持先帝旧制，限制后宫与宦官扩张，维护朝廷秩序。","source":"《三国志》卷39（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷39","source_locator":"董允","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-223","level":"hard","topic":"东吴外交与战争","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"孙和与孙霸储位之争中，顾雍之孙顾谭最终受到何种惩处？","options":{"A":"下狱处死","B":"流徙交州","C":"免职归乡","D":"降为郡丞"},"answer":"B","explanation":"《顾雍传》附顾谭记顾谭维护太子与藩王名分，与孙霸、全琮等发生矛盾，后因芍陂论功相关指控被徙交州。储位派系是背景，具体论功指控是传文中的处置过程，不能省略后者。","source":"《三国志》卷52《顾雍传附顾谭》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷52","source_locator":"顾雍附顾谭","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-224","level":"medium","topic":"东吴外交与战争","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"东吴名臣吾粲因在储位问题上维护太子孙和，遭受哪种结局？","options":{"A":"流徙交州","B":"留任但罢太子府职","C":"下狱被杀","D":"免官归乡"},"answer":"C","explanation":"吾粲持太子正统立场，最终因二宫斗争下狱受害。","source":"《三国志》卷57（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷57","source_locator":"吾粲","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-225","level":"expert","topic":"东吴外交与战争","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"合读《徐夫人传》《步夫人传》，孙权后位争论及步夫人追赠的时间关系是哪一项？","options":{"A":"孙权欲立步氏，孙登坚持潘氏；步氏在孙权死后追赠","B":"孙权欲立潘氏，群臣主张步氏；步氏生前已正式立后","C":"孙权欲立步氏，群臣主张徐氏；步氏死后追赠皇后","D":"孙权欲立徐氏，群臣主张步氏；徐氏死后追赠皇后"},"answer":"C","explanation":"《徐夫人传》记徐氏曾母养孙登、群臣请立其为后；《步夫人传》记孙权意在步氏，群臣议在徐氏，长期未正式定后，步氏死后追赠。步氏卒于238年、孙权卒于252年，原解析“孙权死后追尊”不对。","source":"《三国志》卷50《徐夫人传、步夫人传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷50","source_locator":"徐夫人、步夫人","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","option_explanations":{"A":"孙登与徐氏有母养关系；这段不能换成其坚持潘氏。步氏追赠也早于孙权去世。","B":"步氏宫内被称皇后不等于生前已正式立后，正文明确说死后追正名号。","C":"《徐夫人传》记徐氏曾母养孙登、群臣请立其为后；《步夫人传》记孙权意在步氏，群臣议在徐氏，长期未正式定后，步氏死后追赠。步氏卒于238年、孙权卒于252年，原解析“孙权死后追尊”不对。","D":"徐氏与步氏的角色倒置，追赠皇后的对象为步氏。"}},{"id":"v15-226","level":"hard","topic":"东吴外交与战争","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"吴国陆逊被召入二宫之争时，支持哪项原则而遭孙权疏远？","options":{"A":"太子与藩王名分应有差等，不宜并尊","B":"先废太子与鲁王，改由群臣推举继承者","C":"太子宜留武昌、鲁王宜居建业分治","D":"太子应统民政、鲁王应独立统全国兵权"},"answer":"A","explanation":"陆逊反对太子与鲁王礼秩近似，涉储位争端并屡受责问。","source":"《三国志》卷58（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"太子","novel_note":"正史记陆逊待机反击及火攻，但不能由小说情节推定诸葛亮八阵图困陆逊或其他神异救援。"},{"id":"v15-227","level":"hard","topic":"东吴外交与战争","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"《朱据传》记朱据维护孙和而受罚后，谁趁孙权病重制诏追赐其死？","options":{"A":"孙和复任太子后下令诛朱据","B":"孙弘趁孙权病重伪诏赐死朱据","C":"孙权亲临江陵按军法处死朱据","D":"孙霸获罪后将朱据交魏廷处置"},"answer":"B","explanation":"朱据先被左迁新都郡丞，未到任，中书令孙弘趁孙权寝疾制作诏书追赐死。需要区分孙权先前贬黜与孙弘后来的制诏，不能将每一步都写成孙权亲自明令处死。","source":"《三国志》卷57《朱据传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷57","source_locator":"朱据","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-229","level":"hard","topic":"边疆与地方治理","category":"史实与政略","period":"235—249 魏明帝后政与三国中期","question":"三国时代吴将吕岱经营交州时，曾使哪一域外政权向吴遣使？","options":{"A":"高句丽","B":"大月氏","C":"于阗","D":"扶南"},"answer":"D","explanation":"《吕岱传》记吕岱在交州及南方经营，并遣从事南宣国化，扶南、林邑、堂明等遣使贡献。此题问所列选项中见于该段的政权，不意味着只与扶南交往。","source":"《三国志》卷60（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷60","source_locator":"扶南","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-234","level":"medium","topic":"三国后期与禅代","category":"史实与政略","period":"249—263 权臣更替与三国晚局","question":"曹髦试图亲率宫中部众讨司马昭时，哪位魏臣当面劝他暂缓，以免孤注一掷？","options":{"A":"贾充","B":"王经","C":"陈泰","D":"王沈"},"answer":"B","explanation":"《三少帝纪》裴注引《汉晋春秋》记曹髦召王沈、王经、王业，王经劝止，王沈、王业则奔告司马昭。王经没有与二人一同告发，事件后亦被杀。","source":"《三国志》卷4《三少帝纪》（裴注引《汉晋春秋》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-235","level":"hard","topic":"三国后期与禅代","category":"史实与政略","period":"249—263 权臣更替与三国晚局","question":"曹髦遇害后，魏廷对直接指使成济击帝的贾充采取怎样的政治处理？","options":{"A":"贾充被流放，王经保留官位主持审理","B":"成济兄弟获诛，贾充未作为首恶被公开处死","C":"贾充与成济皆诛，司马昭改由陈泰辅政","D":"只免贾充官职，成济以奉军令获封侯"},"answer":"B","explanation":"曹髦死后的具体议论见《三少帝纪》裴注引《汉晋春秋》等记载，成济兄弟被追究，而贾充未按陈泰所议被诛。史书保留不同叙事，政治判断应指明这一出处，不能说正文完整直述所有弑君经过。","source":"《三国志》卷4《三少帝纪》（裴注引《汉晋春秋》等）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-236","level":"medium","topic":"三国后期与禅代","category":"军事与决策","period":"249—263 权臣更替与三国晚局","question":"诸葛诞起兵寿春时，把自己儿子送往吴国主要为了什么？","options":{"A":"遣子入蜀求援，牵制魏国西线","B":"遣子赴洛阳作质，以争取赦免","C":"遣子入吴作质，以获取援兵","D":"遣子入吴求婚，不涉及军事援助"},"answer":"C","explanation":"诸葛诞遣子入吴请求援军，双方结盟存在明显的质子安排。","source":"《三国志》卷28（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"諸葛誕","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-241","level":"hard","topic":"蜀汉战略与北伐","category":"军事与决策","period":"249—263 权臣更替与三国晚局","question":"据《陈泰传》，解狄道之围时陈泰如何利用地形、守军与蜀军处境安排援救？","options":{"A":"正面强渡洮水，企图当天与姜维决战","B":"绕险据高处示援，并判断守军尚可坚持、蜀军易受前后夹击","C":"待狄道守军弃城，再在西面追击蜀军","D":"先攻沓中，迫姜维放弃狄道回救屯田"},"answer":"B","explanation":"陈泰判断狄道城坚、王经尚能守，姜维虽野战得利却未必有持久围城准备；遂绕险进军、据高处举烽鼓噪，使城内恢复信心，并以将有后援造成围军顾虑。不是单靠虚报援军人数的另一场蒋济合肥计策。","source":"《三国志》卷22《陈泰传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷22","source_locator":"陈泰","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-242","level":"hard","topic":"蜀汉战略与北伐","category":"史实与政略","period":"249—263 权臣更替与三国晚局","question":"蜀汉后期多次北伐遭反对，张翼公开反对姜维继续推进的理由更贴近哪项？","options":{"A":"吴蜀联盟将破裂，应先渡江攻吴","B":"新占土地不足，应先夺长安再考虑休兵","C":"狄道已有足粮，围城无需再征发兵民","D":"国小民劳，已有战果应停止扩大进攻"},"answer":"D","explanation":"《张翼传》记张翼先以国小民劳反对姜维出兵，姜维胜王经后，张翼又主张既有战果宜停止扩张。要区分战前反对与战后止进两次表态，不把它们压成一次固定命令。","source":"《三国志》卷45《张翼传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷45","source_locator":"张翼","novel_note":"北伐各次路线、统帅与补给条件不同，不能将陈仓、祁山、五丈原合为一役；禳星续命等演义情节不作史实依据。"},{"id":"v15-243","level":"hard","topic":"蜀汉战略与北伐","category":"史实与政略","period":"249—263 权臣更替与三国晚局","question":"姜维在段谷败后，其与原定会师的胡济之间发生什么配合问题？","options":{"A":"胡济与邓艾共同袭击姜维后军","B":"胡济在狄道先与陈泰决战","C":"胡济放弃汉中转赴永安","D":"胡济未按约到上邽会师"},"answer":"D","explanation":"《姜维传》记姜维与镇西大将军胡济约期在上邽会师，胡济失誓不至，后来姜维在段谷被邓艾击败。会师失期是记载的一项因素，不宜据此排除其他战术和兵力原因。","source":"《三国志》卷44《姜维传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷44","source_locator":"姜维","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-247","level":"expert","topic":"蜀汉战略与北伐","category":"军事与决策","period":"249—263 权臣更替与三国晚局","question":"对照《钟会传》的伐蜀分工，邓艾与诸葛绪的目标哪项配对正确？","options":{"A":"邓艾趋甘松、沓中牵制姜维；钟会趋武街、桥头断归路；诸葛绪入汉中","B":"邓艾趋武街、桥头断归路；诸葛绪趋甘松、沓中牵制姜维；钟会入汉中","C":"钟会趋甘松、沓中牵制姜维；诸葛绪趋武街、桥头断归路；邓艾入汉中","D":"邓艾趋甘松、沓中牵制姜维；诸葛绪趋武街、桥头断归路；钟会入汉中"},"answer":"D","explanation":"《钟会传》明确分为邓艾趣甘松、沓中连缀姜维，诸葛绪趣武街、桥头绝其归路；钟会主力分从斜谷、骆谷入汉中。《邓艾传》又记姜维摆脱桥头堵截。牵制、断退路与主攻不能统称同一任务。","source":"《三国志》卷28《钟会传、邓艾传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"钟会、邓艾","novel_note":"以《邓艾传》《钟会传》区分奇袭、受降和战后叛乱；成功战果不证明阴平行军无粮运风险。","option_explanations":{"A":"把钟会汉中主攻与诸葛绪桥头堵截任务互换了。","B":"把邓艾和诸葛绪的牵制、断归路任务互换了。","C":"把邓艾与钟会任务互换；诸葛绪的任务虽保留，整组仍错。","D":"《钟会传》明确分为邓艾趣甘松、沓中连缀姜维，诸葛绪趣武街、桥头绝其归路；钟会主力分从斜谷、骆谷入汉中。《邓艾传》又记姜维摆脱桥头堵截。牵制、断退路与主攻不能统称同一任务。"}},{"id":"v15-248","level":"hard","topic":"蜀汉战略与北伐","category":"史实与政略","period":"249—263 权臣更替与三国晚局","question":"魏攻蜀时姜维撤往剑阁之前，成功摆脱哪位魏将试图截断归路的堵截？","options":{"A":"诸葛绪","B":"邓艾","C":"王颀","D":"杨欣"},"answer":"A","explanation":"《邓艾传》记姜维从孔函谷入北道，诸葛绪误判其意图而后退，姜维又返回经桥头越过堵截。是姜维佯动改变对方判断，不是诸葛绪主动为蜀军开放归路。","source":"《三国志》卷28《邓艾传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"邓艾","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-250","level":"hard","topic":"三国后期与禅代","category":"军事与决策","period":"249—263 权臣更替与三国晚局","question":"魏军深入成都平原后，蜀汉官员谯周提出的主要政治建议是什么？","options":{"A":"退南中，以当地兵粮继续抗魏","B":"投吴，等待孙吴再助其收复益州","C":"赴剑阁，把皇帝所在与姜维主力合一","D":"降魏，反对投吴或逃往南中"},"answer":"D","explanation":"《谯周传》比较奔吴、走南中与降魏的后果，认为吴也可能向魏称臣，两度称臣不如一次，南中逃避又有兵粮与民心困难。属于谯周的当时判断，不能改写成所有朝臣一致赞成。","source":"《三国志》卷42《谯周传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷42","source_locator":"谯周","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-251","level":"hard","topic":"三国后期与禅代","category":"军事与决策","period":"264—280 吴晋对峙与统一战争","question":"《晋书·罗宪传》记蜀亡后吴军向永安进逼，罗宪采取了哪项行动？","options":{"A":"脱离蜀魏，自立巴东郡守政权","B":"守永安拒吴，继而向魏方求援","C":"率军赴剑阁，接应姜维反攻汉中","D":"按刘禅令撤城，将永安交吴军"},"answer":"B","explanation":"蜀汉降魏之后，吴军趁机向永安进军，罗宪认为吴违背援蜀名义而坚守，后向魏方求援，魏令胡烈攻西陵迫吴军退。求援时仍是曹魏，晋朝尚未建立；不能笼统写成求西晋援军。","source":"《晋书》卷57《罗宪传》（正文）","source_url":"https://zh.wikisource.org/wiki/晉書/卷057","source_locator":"罗宪","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-253","level":"hard","topic":"三国后期与禅代","category":"军事与决策","period":"249—263 权臣更替与三国晚局","question":"魏伐蜀期间，孙吴令丁奉从哪一方向进兵以牵制魏军？","options":{"A":"攻襄阳，以夺魏国汉水舟船","B":"由永安西进，直援成都","C":"攻合肥新城，以擒钟会后军","D":"向寿春进兵，以牵制魏军"},"answer":"D","explanation":"《丁奉传》记魏伐蜀，丁奉督诸军向寿春以救蜀；蜀亡后乃还。进兵牵制属于伐蜀期间，不是蜀亡后才开始的计划。","source":"《三国志》卷55《丁奉传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷55","source_locator":"丁奉","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-262","level":"hard","topic":"三国后期与禅代","category":"史实与政略","period":"264—280 吴晋对峙与统一战争","question":"魏禅晋后，曹奂的陈留王封国相较历代亡国之君，较显著的礼遇是什么？","options":{"A":"获封后须以庶人身份入朝、不许置官","B":"可统原魏全部军队，但不得祭祀魏祖","C":"保留魏正朔与礼制，并享有上书不称臣等礼遇","D":"只能保留王爵，须全面改行晋国祭礼"},"answer":"C","explanation":"《三少帝纪》及裴注保存曹奂封陈留王的诏制，许其用魏正朔和服色，享有上书不称臣、受诏不拜等礼遇。这是封国礼制，不能等同保留原魏军政统治权。","source":"《三国志》卷4《三少帝纪》（正文及裴注所载封王诏制）","source_url":"https://zh.wikisource.org/wiki/三國志/卷04","source_locator":"三少帝","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-264","level":"expert","topic":"三国后期与禅代","category":"史实与政略","period":"264—280 吴晋对峙与统一战争","question":"比较《陆抗传》正文与裴注，对陆抗、羊祜往来药酒的记载哪项正确？","options":{"A":"西陵交兵与药酒往来都见正文；裴注只评价两人，没有引书叙事","B":"西陵交兵见正文；羊祜赠酒、陆抗赠药见注引《晋阳秋》","C":"药酒往来见正文；西陵交兵只见注引《晋阳秋》，未见《汉晋春秋》","D":"西陵交兵见正文；陆抗赠酒、羊祜赠药见注引《晋阳秋》，求药细节又见《汉晋春秋》"},"answer":"D","explanation":"《陆抗传》正文记西陵战事中羊祜率军向江陵、陆抗识破运粮意图；裴注另引《晋阳秋》《汉晋春秋》记药酒往来与边境信义。军事对立与人物往来可以分别存在，不能从个人交往推出两国缔盟。","source":"《三国志》卷58《陆抗传》（正文及裴注引《晋阳秋》《汉晋春秋》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"陆抗","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","option_explanations":{"A":"裴注明确引《晋阳秋》《汉晋春秋》叙事，不是只加评论。","B":"药酒对象倒置：陆抗遗羊祜酒，羊祜馈陆抗药。","C":"正文记西陵交兵，药酒见裴注，不能对换层次。","D":"《陆抗传》正文记西陵战事中羊祜率军向江陵、陆抗识破运粮意图；裴注另引《晋阳秋》《汉晋春秋》记药酒往来与边境信义。军事对立与人物往来可以分别存在，不能从个人交往推出两国缔盟。"}},{"id":"v15-268","level":"hard","topic":"三国后期与禅代","category":"军事与决策","period":"264—280 吴晋对峙与统一战争","question":"晋武帝决定伐吴前，力主趁吴防备未成、乘势东下的益州水军将是谁？","options":{"A":"胡奋","B":"杜预","C":"王浑","D":"王濬"},"answer":"D","explanation":"《王濬传》記王濬在益州治水军、上疏促伐吴。王浑在下游方向用兵，杜预继羊祜主持荆州军事，职责和进军方向不同。","source":"《晋书》卷42《王濬传》（正文）","source_url":"https://zh.wikisource.org/wiki/晉書/卷042","source_locator":"王濬","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-271","level":"hard","topic":"三国后期与禅代","category":"史实与政略","period":"264—280 吴晋对峙与统一战争","question":"《晋书·王濬传》记晋舟师如何分别处理吴军水下铁锥和横江铁锁？","options":{"A":"大筏撞断铁锁，大炬烧毁水下铁锥","B":"先决堰降低江水，再让陆军拆除两岸铁锁","C":"先以潜水士卒拆铁锥，再以重舰拉断铁锁","D":"大筏处理铁锥，大炬以麻油火烧铁锁"},"answer":"D","explanation":"王濬先制大筏使铁锥着筏而去，另作长炬、灌麻油焚烧铁锁，遇锁燃炬，须臾融液断绝。铁锥与铁锁各有对应器具，不能把火烧作用写到水下铁锥。","source":"《晋书》卷42《王濬传》（正文）","source_url":"https://zh.wikisource.org/wiki/晉書/卷042","source_locator":"王濬","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-274","level":"hard","topic":"三国后期与禅代","category":"史实与政略","period":"264—280 吴晋对峙与统一战争","question":"孙吴末期的交州刺史陶璜，在吴亡后对西晋采取何种安排？","options":{"A":"杀晋使拒降，死于西晋讨伐","B":"弃交州赴建业，晋廷不再用其","C":"归顺晋朝，并继续任交州刺史","D":"投扶南为王，保留独立吴国名号"},"answer":"C","explanation":"《晋书·陶璜传》记吴平后孙皓致手书劝归顺，陶璜最初流涕数日，后来奉印绶；晋武帝仍用为交州刺史。改属与延任都是传文明载，不能写成他在交州另建吴王朝。","source":"《晋书》卷57《陶璜传》（正文）","source_url":"https://zh.wikisource.org/wiki/晉書/卷057","source_locator":"陶璜","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-276","level":"medium","topic":"边疆与地方治理","category":"军事与决策","period":"264—280 吴晋对峙与统一战争","question":"西晋平吴前，东吴广州一带曾出现哪位地方将领起兵反吴的重大事件？","options":{"A":"郭马","B":"郭脩","C":"郭淮","D":"郭攸之"},"answer":"A","explanation":"郭马于吴末广州起兵，吴朝分兵镇压时晋伐吴战争迫近。","source":"《三国志》卷48（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"郭馬","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"},{"id":"v15-279","level":"hard","topic":"曹魏军政","category":"军事与决策","period":"197—207 官渡与河北归曹","question":"《袁绍传》裴注引《英雄记》记界桥交战，率先登兵与强弩击破公孙瓒骑兵的是谁？","options":{"A":"淳于琼","B":"高览","C":"麹义","D":"颜良"},"answer":"C","explanation":"《袁绍传》裴注引《英雄记》详记麹义率八百兵、配强弩，应对公孙瓒骑兵。《公孙瓒传》正文亦记袁绍令麹义先登与瓒战，但界桥阵法细节须标为注引。麹义不是颜良、淳于琼或高览。","source":"《三国志》卷6《袁绍传》（裴注引《英雄记》；参卷8《公孙瓒传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"袁绍","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。"}];</script>
<script>/* 纯答题规则，浏览器与Node测试共用。学习记录只留在浏览器本机。 */
(function(global){
  'use strict';
  const levels={easy:'初级',medium:'中级',hard:'高级',expert:'专家级'};
  const clone=x=>JSON.parse(JSON.stringify(x));
  function shuffle(array,rng=Math.random){const out=[...array];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
  function validate(q){
    if(!q||typeof q!=='object'||Array.isArray(q))throw Error('题目必须是对象');
    for(const key of ['id','level','question','answer','explanation','source'])if(typeof q[key]!=='string'||!q[key].trim())throw Error(`${key}需要非空文字`);
    if(['__proto__','constructor','prototype'].includes(q.id))throw Error('请使用普通题号');
    if(!Object.hasOwn(levels,q.level))throw Error('level必须为easy/medium/hard/expert');
    if(!q.options||Object.keys(q.options).sort().join('')!=='ABCD'||!['A','B','C','D'].includes(q.answer))throw Error('需填写四选项和一个答案字母');
    const options=Object.values(q.options);if(options.some(x=>typeof x!=='string'||!x.trim())||new Set(options.map(x=>x.trim())).size!==4)throw Error('选项不能为空或重复');
    if(q.source_url&&!/^https?:\/\//i.test(q.source_url))throw Error('史料链接需以http/https开头，或留空');
    if(q.source_url){try{const u=new URL(q.source_url);if(!u.hostname)throw Error();}catch{throw Error('史料链接格式不正确');}}
    if(q.option_explanations&&(Object.keys(q.option_explanations).sort().join('')!=='ABCD'||Object.values(q.option_explanations).some(x=>typeof x!=='string'||!x.trim())))throw Error('逐项解析需完整填写ABCD');
    for(const key of ['topic','category','source_url','source_locator'])if(q[key]!=null&&typeof q[key]!=='string')throw Error(`${key}必须是文字`);
    return q;
  }
  function normalize(row){
    if(!row||typeof row!=='object'||Array.isArray(row))throw Error('题目必须是对象');
    const q=clone(row);for(const k in q)if(typeof q[k]==='string')q[k]=q[k].trim();
    const alias=Object.fromEntries(Object.entries(levels).map(([k,v])=>[v,k]));q.level=alias[q.level]||q.level;
    q.answer=typeof q.answer==='string'?q.answer.toUpperCase():q.answer;
    if(!q.options){q.options={};for(const k of 'ABCD'){q.options[k]=q['option_'+k.toLowerCase()]||'';delete q['option_'+k.toLowerCase()];}}
    for(const k in q.options)if(typeof q.options[k]==='string')q.options[k]=q.options[k].trim();
    q.topic=q.topic||'综合';q.category=q.category||'史实记忆';q.source_url=q.source_url||'';q.source_locator=q.source_locator||'';delete q.archived;
    return validate(q);
  }
  function parseCSV(text){
    text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}
      else if(c==='"'){if(cell)throw Error('CSV引号位置不正确');quoted=true;}
      else if(c===','){row.push(cell);cell='';}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}
      else cell+=c;
    }
    if(quoted)throw Error('CSV引号没有闭合');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);
    if(!rows.length)throw Error('CSV为空');const headers=rows.shift().map(x=>x.trim());
    for(const k of ['id','level','question','option_a','option_b','option_c','option_d','answer','explanation','source'])if(!headers.includes(k))throw Error(`CSV表头缺少${k}`);
    if(new Set(headers).size!==headers.length)throw Error('CSV表头重复');
    return rows.map((r,i)=>{if(r.length>headers.length)throw Error(`数据行${i+2}列数超出表头`);return Object.fromEntries(headers.map((h,j)=>[h,r[j]||'']));});
  }
  function equivalent(a,b){const fields=['id','level','topic','period','category','question','answer','explanation','source','source_url','source_locator'];return fields.every(k=>(a[k]||'')===(b[k]||''))&&'ABCD'.split('').every(k=>a.options[k]===b.options[k]);}
  function importPlan(text,kind,existing){
    const plan={rows:[],errors:[],skipped:0,total:0};let raw;
    try{raw=kind==='csv'?parseCSV(text):JSON.parse(text.replace(/^\uFEFF/,''));if(!Array.isArray(raw))raw=raw?.questions;if(!Array.isArray(raw)||!raw.length)throw Error('需有非空题目列表');}catch(e){plan.errors.push(e.message);return plan;}
    const byId=new Map(existing.map(q=>[q.id,q])),seen=new Set();
    raw.forEach((r,i)=>{plan.total++;try{const q=normalize(r);if(seen.has(q.id))throw Error('文件内题号重复');seen.add(q.id);if(byId.has(q.id)){if(equivalent(q,byId.get(q.id)))plan.skipped++;else throw Error(`题号${q.id}已存在且内容不同，请用新题号`);}else plan.rows.push(q);}catch(e){plan.errors.push(`${kind==='csv'?'数据行'+(i+2):'第'+(i+1)+'题'}：${e.message}`);}});
    return plan;
  }
  function select(bank,{level='hard',topic='全部专题',mode='考试',count=5},mistakes,rng=Math.random){
    const period=arguments[1]?.period||'全部时期';
    const pool=bank.filter(q=>(level==='all'||q.level===level)&&(topic==='全部专题'||(q.topic||'综合')===topic)&&(period==='全部时期'||(q.period||'未分类时期')===period)&&(mode==='错题复习'?mistakes[q.id]&&!mistakes[q.id].resolved:!q.archived));
    return shuffle(pool,rng).slice(0,count).map(q=>{const out=clone(q),order=shuffle(['A','B','C','D'],rng);out.options=Object.fromEntries(order.map((old,i)=>['ABCD'[i],q.options[old]]));out.answer='ABCD'[order.indexOf(q.answer)];if(q.option_explanations)out.option_explanations=Object.fromEntries(order.map((old,i)=>['ABCD'[i],q.option_explanations[old]]));return out;});
  }
  function report(session){const details=session.paper.map(q=>{const chosen=session.answers[q.id];if(!chosen)throw Error('本轮尚未完成');return{id:q.id,question:q.question,chosen,answer:q.answer,correct:chosen===q.answer,chosen_text:q.options[chosen],answer_text:q.options[q.answer],options:q.options};});const correct=details.filter(x=>x.correct).length;return{id:session.id,time:new Date().toISOString(),mode:session.mode,level:session.level,topic:session.topic,period:session.period||'全部时期',total:details.length,correct,wrong:details.length-correct,score:Math.round(correct/details.length*1000)/10,details};}
  function saveResult(state,result){const out=clone(state);if(out.scores.some(x=>x.id===result.id))return out;out.scores.push(result);result.details.forEach(row=>{if(!row.correct){const old=out.mistakes[row.id]||{};out.mistakes[row.id]={...row,wrong_count:(old.wrong_count||0)+1,last_time:result.time,resolved:false};}else if(out.mistakes[row.id])out.mistakes[row.id].resolved=true;});out.session=null;return out;}
  function validState(s){
    if(!s||s.version!==1||!Array.isArray(s.scores)||!s.mistakes||typeof s.mistakes!=='object'||Array.isArray(s.mistakes))throw Error('学习记录格式不正确');
    if(s.custom!=null){if(!Array.isArray(s.custom))throw Error('自定义题库格式不正确');s.custom.forEach(validate);}
    for(const r of s.scores)if(!r||typeof r.score!=='number'||typeof r.time!=='string'||typeof r.total!=='number')throw Error('成绩记录格式不正确');
    for(const r of Object.values(s.mistakes))if(!r||typeof r.resolved!=='boolean'||typeof r.wrong_count!=='number')throw Error('错题记录格式不正确');

  }

<script>(function(){
  'use strict';
  const C=TrialCore,B=QUESTION_BANK,KEY='sanguo-night-v1';

  try{const raw=localStorage.getItem(KEY);if(raw){const saved=C.validState(JSON.parse(raw));state={...state,...saved,custom:saved.custom||[],settings:{...state.settings,...saved.settings}};}}
  catch(e){blockedStorage=true;storageOK=false;msg('本机记录无法读取。为保护旧数据，本页暂不覆盖保存；可导出原始记录，或导入正常备份恢复。');}
  function persist(){if(blockedStorage)return false;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;return true;}catch{storageOK=false;msg('浏览器未能保存记录（可能空间不足或禁用存储）。当前仍可练习，请在题库页导出备份。');return false;}}
  function theme(){document.documentElement.dataset.theme=state.settings.theme;document.querySelector('#theme').textContent=state.settings.theme==='light'?'☾':'☀';document.querySelector('#theme').setAttribute('aria-label',state.settings.theme==='dark'?'切换日间模式':'切换夜间模式');document.querySelector('meta[name=theme-color]').content=state.settings.theme==='light'?'#f3f1e9':'#141a19';}

  function route(target){const page=typeof target==='string'?target:currentPage;currentPage=page;document.querySelectorAll('.bottom-nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page||(page==='quiz'&&a.dataset.page==='home')));selected='';({home,mistakes,history,library,quiz,result}[page]||home)();window.scrollTo(0,0);}

  document.querySelectorAll('.bottom-nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.page);}));
  function home(){
    const topics=['全部专题',...new Set(active().map(q=>q.topic||'综合'))];const periods=['全部时期',"184—189 黄巾与汉末危机","189—196 董卓与诸侯割据","197—207 官渡与河北归曹","194—208 江东与淮南经营","208—215 赤壁与荆益格局","216—223 汉中襄樊与三国建国","223—234 魏蜀吴对峙与诸葛北伐","235—249 魏明帝后政与三国中期","249—263 权臣更替与三国晚局","264—280 吴晋对峙与统一战争"];const st=state.settings;
    el.innerHTML=`<section class="hero"><span class="eyebrow">一卷史书 · 片刻试炼</span><h1>夜静，<br>再辨一局。</h1><div class="hero-line"></div><p>读史不急于求胜。<br>用几个问题，想清一场成败。</p></section>
      <div class="stats"><div class="stat"><strong>${active().length}</strong><span>可练题目</span></div><div class="stat"><strong>${pending().length}</strong><span>待复习错题</span></div><div class="stat"><strong>${state.scores.length}</strong><span>已完成试炼</span></div></div>
      ${state.session?`<section class="card"><span class="pill gold">未完的题卷</span><h3 style="margin:12px 0">${esc(C.levels[state.session.level]||'混合')} · 已答${Object.keys(state.session.answers).length}/${state.session.paper.length}题</h3><div class="row"><button class="primary" data-act="resume">继续上次</button><button class="plain" data-act="discard">结束这一轮</button></div></section>`:''}
      <section class="card"><div class="row"><h2>今晚练什么</h2><span class="pill">默认 5 题</span></div><label class="section-label">练习模式</label><div class="segmented">${['考试','错题复习'].map(x=>`<button data-act="mode" data-value="${x}" class="${st.mode===x?'selected':''}" aria-pressed="${st.mode===x}">${x==='考试'?'随机试炼':x}</button>`).join('')}</div>

      <div class="row"><p class="hint">夜间／日间模式 · 无计时压力</p><button class="plain" data-act="theme">${st.theme==='dark'?'切换日间模式':'切换夜间模式'}</button></div><p class="hint" style="margin-top:18px">学习记录保存在此设备、此浏览器中。手机与电脑不会自动同步，可在题库页导入 / 导出备份。</p>`;
    document.querySelector('#period').addEventListener('change',e=>{state.settings.period=e.target.value;persist();});document.querySelector('#topic').addEventListener('change',e=>{state.settings.topic=e.target.value;persist();});document.querySelector('#count').addEventListener('change',e=>{state.settings.count=Number(e.target.value);persist();});document.querySelector('#mixed').addEventListener('change',e=>{state.settings.level=e.target.checked?'all':'hard';persist();home();});
  }
  async function start(){if(state.session){msg('还有一轮未完成，请先继续或结束上次题卷。');home();return;}const st=state.settings,paper=C.select(bank(),st,state.mistakes);if(!paper.length){msg('当前范围没有可练题目。试试全部专题或混合难度。');return;}state.session={id:Date.now()+'-'+Math.random().toString(36).slice(2),paper,index:0,answers:{},mode:st.mode,level:st.level,topic:st.topic,period:st.period,started:new Date().toISOString()};persist();go('quiz');}
  function quiz(){
    const s=state.session;if(!s){go('home');return;}const q=s.paper[s.index],chosen=s.answers[q.id];
    el.innerHTML=`<div class="row"><span class="pill gold">${esc(C.levels[q.level])}</span><span class="hint">${s.index+1} / ${s.paper.length}</span></div><div class="progress"><i style="width:${s.index/s.paper.length*100}%"></i></div><p class="hint">${esc(q.period||'未分类时期')} · ${esc(q.topic||'综合')}${q.archived?' · 旧版错题档案':''}</p><h2 class="question">${esc(q.question)}</h2><div class="options" role="group" aria-label="选择答案">${Object.entries(q.options).map(([k,v])=>`<button class="option ${chosen?(k===q.answer?'correct':k===chosen?'wrong':''):''}" data-act="choose" data-value="${k}" ${chosen?'disabled':''} aria-pressed="false"><span class="letter">${k}</span><span>${esc(v)}</span></button>`).join('')}</div>
      ${chosen?`<section class="card feedback ${chosen===q.answer?'good':'bad'}" aria-live="polite"><span class="eyebrow">${chosen===q.answer?'看对了条件':'再审一次局势'}</span><h2 style="margin-top:10px">${chosen===q.answer?'回答正确':'本题答错'}</h2><p><strong>正确答案：${q.answer} · ${esc(q.options[q.answer])}</strong></p><p>${esc(q.explanation)}</p>${q.option_explanations?`<details><summary>展开四项辨析</summary>${Object.entries(q.option_explanations).map(([k,v])=>`<div class="reason"><strong>${k}.</strong> ${esc(v)}</div>`).join('')}</details>`:''}<div class="source">${esc(q.source)}${q.source_locator?`<br>原文检索词：${esc(q.source_locator)}`:''}${safeURL(q.source_url)?`<br><a href="${safeURL(q.source_url)}" target="_blank" rel="noopener noreferrer">打开史料原文 ↗</a>`:''}</div></section>`:''}
      <div class="quiz-actions"><button class="secondary" data-act="pause">稍后继续</button><button class="primary" data-act="${chosen?'next':'submit'}" ${!chosen&&!selected?'disabled':''}>${chosen?(s.index+1===s.paper.length?'查看成绩':'下一题 →'):'提交答案'}</button></div><p class="hint">${storageOK?'进度已在本机保存，离开页面后可继续。':'当前记录未能保存，请在题库页导出备份。'}</p>`;
  }
  function finish(){const s=state.session;if(!s)return;lastResult=C.report(s);state=C.saveResult(state,lastResult);persist();go('result');}
  function result(){const r=lastResult||state.scores[state.scores.length-1];if(!r){go('home');return;}el.innerHTML=head('这一局，已读完。','得分只描述本轮表现，不代表完整历史能力。')+`<section class="card"><span class="pill gold">${esc(C.levels[r.level]||'混合')} · ${esc(r.mode)}</span><div class="result-score">${r.score}<small> / 100</small></div><p class="muted">正确 ${r.correct} / ${r.total} 题 · 错误 ${r.wrong} 题 · ${esc(r.period||'全部时期')}</p><p class="hint" style="margin-top:12px">${storageOK?'成绩与错题已保存在本机。':'本轮记录未能保存，请导出备份。'}</p><div class="wide-action"><button class="primary" data-act="home">回到首页</button><button class="secondary" data-act="review">复习错题</button></div></section><section class="card"><h2>回顾本轮</h2>${(r.details||[]).map(x=>`<div class="list-item"><span class="${x.correct?'good':'error'}">${x.correct?'✓ 答对':'× 答错'}</span><h3>${esc(x.question)}</h3><p>你的选择：${esc(x.chosen_text||x.chosen)}<br>正确选项：${esc(x.answer_text||x.answer)}</p></div>`).join('')}</section>`;}
  function mistakes(){const ids=pending(),byId=new Map(bank().map(q=>[q.id,q]));el.innerHTML=head('误判，也是线索。','答对后标为已掌握，旧版错题仍按原题复习。')+`<div class="row"><span class="pill">待复习 ${ids.length} 题</span><button class="primary" data-act="review" ${ids.length?'':'disabled'}>练习错题 →</button></div><section class="card">${ids.length?ids.map(id=>{const r=state.mistakes[id],q=byId.get(id);return`<div class="list-item"><span class="pill">${q?esc(C.levels[q.level]):'原题库未导入'}</span><h3 style="margin-top:8px">${esc(r.question||q?.question||id)}</h3><p>上次选择：${esc(r.chosen_text||q?.options[r.chosen]||r.chosen)}<br>正确选项：${esc(r.answer_text||q?.options[r.answer]||r.answer)}<br>累计答错 ${r.wrong_count} 次${q?.archived?' · 旧版题档案':''}</p></div>`;}).join(''):'<div class="empty">暂无待复习错题。<br>今晚先读一轮题卷吧。</div>'}</section>`;}

  function library(){el.innerHTML=head('一座随身小书库。','题目留在题库里，学习记录留在你手里。')+`<section class="card"><h2>${active().length} 道可练题</h2><p class="subtitle" style="margin-bottom:10px">${Object.entries(C.levels).map(([k,v])=>v+' '+active().filter(q=>q.level===k).length).join(' · ')}</p><p class="hint">按历史时期与专题双维度筛选；新题附史书出处及解析，另保留25道旧题档案。</p></section>
      <section class="card"><h2>题库批量导入</h2><p class="subtitle">支持 JSON / CSV；CSV可用Excel填写后另存为UTF-8。</p><div class="row"><button class="secondary" data-act="template-json">JSON模板</button><button class="secondary" data-act="template-csv">CSV模板</button></div><label class="section-label" for="question-file">选择题库文件</label><input class="file-picker" type="file" id="question-file" accept=".json,.csv"><div id="import-result"></div><p class="hint">格式检查不等于史实审核。须填写答案、解析、出处；同号不同内容会报错，不覆盖。</p></section>

      <section class="card"><h2>阅读设置</h2><div class="font-controls" style="margin:12px 0"><button class="secondary" data-act="theme">${state.settings.theme==='dark'?'切换日间模式':'切换夜间模式'}</button></div><p class="hint">不播放声音、不强制倒计时。将网页添加到手机主屏幕，可快速打开；仍需网络打开网站。</p></section>`;
    document.querySelector('#question-file').addEventListener('change',importQuestions);document.querySelector('#record-file').addEventListener('change',importRecords);
  }
  const template=()=>{const q=C.clone(active()[0]);q.id='my-example-001';q.topic='导入示例';q.period='全部时期';return[q];};
  function csvTemplate(){const fields=['id','level','topic','period','category','question','option_a','option_b','option_c','option_d','answer','explanation','source','source_url','source_locator'];const q=template()[0],row={...q};for(const k of 'ABCD')row['option_'+k.toLowerCase()]=q.options[k];const quote=x=>'"'+String(x||'').replace(/"/g,'""')+'"';return '\uFEFF'+fields.join(',')+'\r\n'+fields.map(k=>quote(row[k])).join(',')+'\r\n';}
  async function importQuestions(e){const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024){msg('文件超过10MB，请分批导入。');return;}try{const text=await file.text();plan=C.importPlan(text,file.name.toLowerCase().endsWith('.csv')?'csv':'json',bank());const holder=document.querySelector('#import-result');holder.innerHTML=`<p class="hint">检查 ${plan.total} 条 · 新增 ${plan.rows.length} · 跳过 ${plan.skipped}</p>${plan.errors.length?`<p class="error">本批有错误，不会写入任何题目。</p><div class="import-preview">${plan.errors.map(x=>`<p class="hint">${esc(x)}</p>`).join('')}</div>`:`<div class="import-preview">${plan.rows.map(q=>`<div class="list-item"><h3>${esc(q.question)}</h3><p>${esc(q.id)} · ${esc(C.levels[q.level])}<br>答案：${q.answer} · ${esc(q.options[q.answer])}<br>解析：${esc(q.explanation)}<br>出处：${esc(q.source)}</p></div>`).join('')}</div><button class="primary full" data-act="import-commit" ${plan.rows.length?'':'disabled'} style="margin:16px 0">确认新增${plan.rows.length}题</button>`}`;}catch(err){msg('无法读取导入文件：'+err.message);}}
  async function importRecords(e){const file=e.target.files[0];if(!file)return;try{const data=C.validState(JSON.parse(await file.text()));if(!await confirmAction('导入学习备份','将替换本机成绩与错题。先自动下载当前备份，原文件不会修改。继续吗？'))return;exportRecords();const custom=data.custom||state.custom;const ids=new Set(B.map(q=>q.id));for(const q of custom){if(ids.has(q.id))throw Error('备份题号与内置题冲突');ids.add(q.id);}const previous=state,wasBlocked=blockedStorage;state={...state,...data,custom,settings:{...state.settings,...data.settings}};blockedStorage=false;if(!persist()){state=previous;blockedStorage=wasBlocked;throw Error('浏览器未能保存导入记录');}theme();msg('学习记录已导入。');library();}catch(err){msg('导入失败，当前记录未替换：'+err.message);}}
  function exportRecords(){if(blockedStorage){let raw='';try{raw=localStorage.getItem(KEY)||'';}catch{}download('三国试炼-原始记录.json',raw||JSON.stringify(state,null,2));return;}download('三国试炼-学习备份.json',JSON.stringify(state,null,2));}
  el.addEventListener('click',async e=>{
    const button=e.target.closest('[data-act]');if(!button||button.disabled)return;const act=button.dataset.act,value=button.dataset.value;

    else if(act==='submit'){const s=state.session;if(!s||!selected||s.answers[s.paper[s.index].id])return;s.answers[s.paper[s.index].id]=selected;persist();quiz();}
    else if(act==='next'){const s=state.session;if(!s||!s.answers[s.paper[s.index].id])return;if(s.index+1===s.paper.length)finish();else{s.index++;selected='';persist();quiz();window.scrollTo(0,0);}}
    else if(act==='review'){state.settings.mode='错题复习';state.settings.level='all';state.settings.topic='全部专题';state.settings.period='全部时期';persist();go('home');}
    else if(act==='theme'){document.querySelector('#theme').click();route();}
    else if(act==='template-json')download('三国题库模板.json',JSON.stringify(template(),null,2));
    else if(act==='template-csv')download('三国题库模板.csv',csvTemplate(),'text/csv;charset=utf-8');
    else if(act==='import-commit'){if(!plan||plan.errors.length||!plan.rows.length)return;const existing=new Set(bank().map(q=>q.id));if(plan.rows.some(q=>existing.has(q.id))){msg('题库已变化，请重新选择文件检查。');return;}const previous=state.custom;state.custom=[...previous,...plan.rows];if(!persist()){state.custom=previous;msg('保存失败，没有写入这批题目。请先导出备份并检查浏览器存储。');return;}msg(`成功新增${plan.rows.length}题。`);plan=null;library();}
    else if(act==='export')exportRecords();
  });
  route();
})();
</script>
