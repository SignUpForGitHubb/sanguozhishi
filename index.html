dding:12px 0;margin-top:18px;z-index:3}.quiz-actions .primary{flex:1}.quiz-actions .secondary{font-size:12px}.result-score{font-family:Georgia,serif;font-size:72px;color:var(--gold);line-height:1.1;margin:12px 0}.result-score small{font-family:system-ui,sans-serif;font-size:16px;color:var(--muted)}.list-item{border-bottom:1px solid var(--line);padding:16px 0}.list-item:last-child{border:0}.list-item h3{font-size:15px}.list-item p{font-size:12px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}.empty{padding:30px 4px;color:var(--muted);font-size:14px;text-align:center}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;max-width:760px;margin:auto;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));min-height:73px}.bottom-nav a{flex:1;text-align:center;font-size:10px;text-decoration:none;color:var(--muted);padding:5px;border-radius:10px;line-height:1.2}.bottom-nav a span{display:block;font-size:21px;margin-bottom:5px}.bottom-nav a.active{color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--card))}#notice{max-width:716px;margin:12px auto 0;padding:0 22px}#notice:not(:empty){background:var(--raised);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:12px}dialog{width:calc(100% - 40px);max-width:420px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:26px}dialog::backdrop{background:#0009}dialog p{font-size:14px;color:var(--muted);margin:12px 0 24px}.dialog-actions{display:flex;justify-content:flex-end;gap:12px}.import-preview{max-height:430px;overflow:auto;border-top:1px solid var(--line);margin-top:15px}.file-picker{padding:12px;border:1px dashed var(--line);margin:16px 0}.loading{text-align:center;padding:80px 0;color:var(--muted)}.font-controls{display:flex;gap:8px}.font-controls button{font-size:12px;min-height:40px}.muted{color:var(--muted)}.sr- <script>globalThis.QUESTION_BANK = [{"id":"v11-001","level":"easy","category":"史实记忆","question":"官渡之战主要交战双方是谁？","options":{"A":"刘备与孙权","B":"曹操与袁绍","C":"刘备与袁绍","D":"曹操与孙权"},"answer":"B","explanation":"官渡之战是曹操与袁绍争夺北方优势的关键战役。","source":"《三国志》卷1","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"曹魏军政","period":"197—207 官渡与河北归曹","source_locator":"武帝纪"},{"id":"v11-002","level":"easy","category":"史实记忆","question":"曹操迎汉献帝后，将朝廷迁往哪里？","options":{"A":"成都","B":"长安","C":"建业","D":"许县"},"answer":"D","explanation":"《武帝纪》记载迁都许。注意这里是汉廷所在地，不是后来魏国的所有都城。","source":"《三国志》卷1","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","novel_note":"董卓废立、迁都与献帝东归须按史书时间区分；貂蝉连环计、曹操献刀等演义情节不用于补定政治事件的因果。","topic":"曹魏军政","period":"189—196 董卓与诸侯割据","source_locator":"武帝纪"},{"id":"v11-003","level":"easy","category":"史实记忆","question":"赤壁之战中，哪位将领向周瑜提出火攻建议并实施诈降？","options":{"A":"程普","B":"鲁肃","C":"吕蒙","D":"黄盖"},"answer":"D","explanation":"《周瑜传》记黄盖指出曹军船舰相连，建议火攻，并致书诈降。","source":"《三国志》卷54","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","novel_note":"《周瑜传》把建策、诈降火攻归于黄盖，记当时东南风急；“借东风”、蒋干盗书及庞统献连环计不能据此传作为已证史实。","topic":"东吴外交与战争","period":"208—215 赤壁与荆益格局","source_locator":"周瑜传"},{"id":"v11-004","level":"easy","category":"人物关系","question":"隆中对是谁向刘备提出的战略构想？","options":{"A":"诸葛亮","B":"法正","C":"庞统","D":"鲁肃"},"answer":"A","explanation":"《诸葛亮传》记刘备拜访诸葛亮，两人讨论天下形势。","source":"《三国志》卷35","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"蜀汉战略与北伐","period":"197—207 官渡与河北归曹","source_locator":"诸葛亮传"},{"id":"v11-005","level":"easy","category":"史实记忆","question":"刘备称帝时，统治中心位于哪座城市？","options":{"A":"建业","B":"洛阳","C":"成都","D":"许县"},"answer":"C","explanation":"刘备于章武元年在成都即皇帝位。","source":"《三国志》卷32","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"刘备入蜀与建国","period":"216—223 汉中襄樊与三国建国","source_locator":"先主传"},{"id":"v11-006","level":"easy","category":"人物关系","question":"孙权承接了哪位兄长在江东建立的事业？","options":{"A":"孙休","B":"孙策","C":"孙登","D":"孙坚"},"answer":"B","explanation":"孙策去世后，孙权接掌其部众与江东政权。孙坚是孙权的父亲。","source":"《三国志》卷47","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"东吴外交与战争","period":"194—208 江东与淮南经营","source_locator":"吴主传"},{"id":"v11-007","level":"easy","category":"史实记忆","question":"陆抗主要效力于哪个政权？","options":{"A":"曹魏","B":"孙吴","C":"蜀汉","D":"西晋"},"answer":"B","explanation":"陆抗是孙吴后期重要将领，不是西晋将领。","source":"《三国志》卷58","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"三国后期与禅代","period":"264—280 吴晋对峙与统一战争","source_locator":"陆抗传"},{"id":"v11-008","level":"easy","category":"史实记忆","question":"诸葛亮最后一次北伐时，屯驻于哪里？","options":{"A":"西陵","B":"官渡","C":"合肥","D":"五丈原"},"answer":"D","explanation":"《诸葛亮传》记建兴十二年出斜谷，屯于五丈原。","source":"《三国志》卷35","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","novel_note":"北伐各次路线、统帅与补给条件不同，不能将陈仓、祁山、五丈原合为一役；禳星续命等演义情节不作史实依据。","topic":"蜀汉战略与北伐","period":"223—234 魏蜀吴对峙与诸葛北伐","source_locator":"诸葛亮传"},{"id":"v11-009","level":"easy","category":"史实记忆","question":"曹操在官渡时期袭击了袁绍哪处重要粮屯？","options":{"A":"寿春","B":"白帝","C":"乌巢","D":"江陵"},"answer":"C","explanation":"《武帝纪》记曹操亲率部队袭击淳于琼等所守粮屯，即乌巢。","source":"《三国志》卷1","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"曹魏军政","period":"197—207 官渡与河北归曹","source_locator":"武帝纪"},{"id":"v11-010","level":"easy","category":"人物关系","question":"陆抗是哪位东吴将领的儿子？","options":{"A":"鲁肃","B":"陆逊","C":"吕蒙","D":"陆绩"},"answer":"B","explanation":"《陆抗传》记陆抗为陆逊之子，承接父亲部众。","source":"《三国志》卷58","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"三国后期与禅代","period":"264—280 吴晋对峙与统一战争","source_locator":"陆抗传"},{"id":"v11-011","level":"medium","category":"战略理解","question":"官渡之战中，袭击乌巢首先打击袁军的哪项条件？","options":{"A":"黄河渡运","B":"攻城器械","C":"粮食供应","D":"骑兵草料"},"answer":"C","explanation":"乌巢是粮屯，袭击首先破坏补给；袁军随后溃败还涉及战场与内部因素。","source":"《三国志》卷1","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"曹魏军政","period":"197—207 官渡与河北归曹","source_locator":"武帝纪"},{"id":"v11-012","level":"medium","category":"战略理解","question":"隆中对设想刘备取得哪两地，作为发展的基础？","options":{"A":"幽州与并州","B":"扬州与交州","C":"荆州与益州","D":"冀州与青州"},"answer":"C","explanation":"隆中对提出跨有荆、益，并与孙权结援。","source":"《三国志》卷35","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"蜀汉战略与北伐","period":"197—207 官渡与河北归曹","source_locator":"诸葛亮传"},{"id":"v11-013","level":"medium","category":"战略理解","question":"黄盖认为火攻可用，直接利用了曹军舰船的什么状态？","options":{"A":"首尾相接","B":"横列江中互不连接","C":"分作前后两队","D":"船尾系岸而首端外向"},"answer":"A","explanation":"《周瑜传》记曹军船舰首尾相接，黄盖据此提出焚烧。","source":"《三国志》卷54","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","novel_note":"《周瑜传》把建策、诈降火攻归于黄盖，记当时东南风急；“借东风”、蒋干盗书及庞统献连环计不能据此传作为已证史实。","topic":"东吴外交与战争","period":"208—215 赤壁与荆益格局","source_locator":"周瑜传"},{"id":"v11-014","level":"medium","category":"战略理解","question":"诸葛亮在五丈原分兵屯田，主要针对什么困难？","options":{"A":"军官选拔","B":"粮食接续","C":"江面封锁","D":"荆州归属"},"answer":"B","explanation":"《诸葛亮传》将分兵屯田与此前粮不继的困难直接联系起来。","source":"《三国志》卷35","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","novel_note":"北伐各次路线、统帅与补给条件不同，不能将陈仓、祁山、五丈原合为一役；禳星续命等演义情节不作史实依据。","topic":"蜀汉战略与北伐","period":"223—234 魏蜀吴对峙与诸葛北伐","source_locator":"诸葛亮传"},{"id":"v11-015","level":"medium","category":"战略理解","question":"西陵之战时，陆抗修筑围垒的双重用途是什么？","options":{"A":"诱步阐出城，再截其退路","B":"内围步阐，外御晋军","C":"先阻晋援，再全军攻城","D":"先取城外粮屯，再阻晋援"},"answer":"B","explanation":"陆抗命诸军筑围，自赤溪至故市，内围步阐、外御晋军。","source":"《三国志》卷58","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"三国后期与禅代","period":"264—280 吴晋对峙与统一战争","source_locator":"陆抗传"},{"id":"v11-016","level":"medium","category":"史实记忆","question":"刘备称汉中王与称帝的先后顺序是什么？","options":{"A":"先称帝，同年称汉中王","B":"先称汉中王，次年称帝","C":"先称汉中王，四年后称帝","D":"先称汉中王，两年后称帝"},"answer":"D","explanation":"刘备于建安二十四年称汉中王，章武元年称帝。","source":"《三国志》卷32","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"刘备入蜀与建国","period":"216—223 汉中襄樊与三国建国","source_locator":"先主传"},{"id":"v11-017","level":"medium","category":"战略理解","question":"曹操在许下推行屯田，直接帮助解决什么问题？","options":{"A":"统一军器生产","B":"扩大盐铁官营收入","C":"军粮筹措","D":"稳定边境马匹交易"},"answer":"C","explanation":"《武帝纪》记用枣祗、韩浩等议始兴屯田，经济供给是其直接作用。","source":"《三国志》卷1","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"曹魏军政","period":"189—196 董卓与诸侯割据","source_locator":"武帝纪"},{"id":"v11-018","level":"medium","category":"人物关系","question":"周瑜在赤壁前主张迎战时，主要支持孙权作出什么决定？","options":{"A":"抵抗曹操南下","B":"先退守吴会再等待曹军撤离","C":"先接受汉廷任命再另议出兵","D":"出兵攻合肥以避开荆州主力"},"answer":"A","explanation":"《周瑜传》记周瑜分析曹军弱点，坚定孙权抵抗的决心。","source":"《三国志》卷54","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","novel_note":"《周瑜传》把建策、诈降火攻归于黄盖，记当时东南风急；“借东风”、蒋干盗书及庞统献连环计不能据此传作为已证史实。","topic":"东吴外交与战争","period":"208—215 赤壁与荆益格局","source_locator":"周瑜传"},{"id":"v11-019","level":"medium","category":"战略理解","question":"隆中对对孙权的基本外交判断是什么？","options":{"A":"可先取江东，再联荆州","B":"应联合孙权立即攻河北","C":"可结援，不宜图取","D":"应先借兵入益州，后取江东"},"answer":"C","explanation":"诸葛亮认为孙权有地利与人和，可为援而不可图。","source":"《三国志》卷35","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"蜀汉战略与北伐","period":"197—207 官渡与河北归曹","source_locator":"诸葛亮传"},{"id":"v11-020","level":"medium","category":"史实记忆","question":"孙权称帝后，从武昌迁都至哪里？","options":{"A":"洛阳","B":"建业","C":"成都","D":"许县"},"answer":"B","explanation":"《吴主传》记黄龙元年称帝，随后迁都建业。","source":"《三国志》卷47","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","novel_note":"本题限于所列史料的具体记载；解析中的因果说明为据史料所作分析。没有记载的细节不能凭小说补成史实。","topic":"东吴外交与战争","period":"223—234 魏蜀吴对峙与诸葛北伐","source_locator":"吴主传"},{"id":"v12-001","level":"easy","topic":"刘备入蜀与建国","category":"史实记忆","question":"刘备入蜀前，益州牧是谁？","options":{"A":"刘表","B":"刘焉","C":"刘璋","D":"张鲁"},"answer":"C","explanation":"法正出使时效力于益州牧刘璋，后来转而辅佐刘备。刘焉是刘璋的父亲。","source":"《三国志》卷37·法正传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"刘璋","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"208—215 赤壁与荆益格局"},{"id":"v12-002","level":"easy","topic":"刘备入蜀与建国","category":"史实记忆","question":"哪位谋士随刘备入蜀，而诸葛亮起初留镇荆州？","options":{"A":"郭嘉","B":"庞统","C":"荀彧","D":"鲁肃"},"answer":"B","explanation":"庞统与诸葛亮并为军师中郎将，刘备入蜀时庞统随行，诸葛亮留镇荆州。","source":"《三国志》卷37·庞统传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"軍師中郎將","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"208—215 赤壁与荆益格局"},{"id":"v12-003","level":"easy","topic":"蜀汉战略与北伐","category":"史实记忆","question":"街亭之败时，统率蜀军前部的是谁？","options":{"A":"马良","B":"马谡","C":"魏延","D":"吴壹"},"answer":"B","explanation":"马谡被诸葛亮选为前部统帅，在街亭为张郃所破。马良是其兄。","source":"《三国志》卷39·马良传附马谡（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷39","source_locator":"街亭","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v12-004","level":"easy","topic":"三国后期与禅代","category":"史实记忆","question":"魏军灭蜀时，在绵竹战死的蜀汉将领是谁？","options":{"A":"诸葛恪","B":"诸葛瑾","C":"诸葛瞻","D":"诸葛诞"},"answer":"C","explanation":"邓艾传记魏军在绵竹击败诸葛瞻并斩之。诸葛诞、诸葛瑾、诸葛恪均不是这次蜀军统帅。","source":"《三国志》卷28·邓艾传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"綿竹","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-005","level":"easy","topic":"三国后期与禅代","category":"史实记忆","question":"魏军攻入蜀汉腹地后，哪位蜀汉皇帝遣使请降？","options":{"A":"曹奂","B":"刘备","C":"刘禅","D":"孙休"},"answer":"C","explanation":"邓艾进军到雒，刘禅遣使奉皇帝玺绶请降。","source":"《三国志》卷28·邓艾传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"請降","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-006","level":"medium","topic":"刘备入蜀与建国","category":"战略理解","question":"刘璋迎刘备入蜀，名义上希望刘备承担什么任务？","options":{"A":"帮助抵御张鲁","B":"支持曹操讨袁绍","C":"护送汉帝入蜀","D":"助其征讨孙权"},"answer":"A","explanation":"刘璋因张鲁方向的威胁而迎刘备。法正、张松则有另拥刘备的打算，公开任务与内部意图需区分。","source":"《三国志》卷37·法正传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"使之討魯","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"208—215 赤壁与荆益格局"},{"id":"v12-007","level":"medium","topic":"刘备入蜀与建国","category":"战略理解","question":"法正建议取汉中后广农积谷，主要为哪类行动准备基础？","options":{"A":"先迁汉中人口入蜀，再放弃诸关","B":"立刻撤出汉中，把军力全用于荆州","C":"进取敌国、拓取雍凉或守险持久","D":"把汉中交给孙权，换取荆州东部"},"answer":"C","explanation":"法正提出上、中、下三种前景，农业积粮既支撑扩张，也支撑守要害的持久之计。","source":"《三国志》卷37·法正传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"廣農積谷","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v12-008","level":"medium","topic":"三国后期与禅代","category":"战略理解","question":"邓艾经阴平险道进军的主要战役作用是什么？","options":{"A":"绕过沓中，直取汉中以断姜维粮运","B":"由阴平出祁山，截蜀军撤往陇右","C":"绕过剑阁，进逼涪地，使正面与腹地相牵制","D":"出阴平接应钟会，以两军合攻剑阁"},"answer":"C","explanation":"邓艾提出出剑阁以西、趋涪的方案，迫使蜀军面临剑阁正面与腹地之间的兵力选择。","source":"《三国志》卷28·邓艾传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"陰平","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-009","level":"medium","topic":"东吴外交与战争","category":"战略理解","question":"东兴之战中，丁奉加快前进，首先希望争取哪项优势？","options":{"A":"先据有利地形，抢在敌军布置前突击","B":"先夺敌粮船，使魏军放弃东兴","C":"先截断桥梁，把魏军引向江边","D":"先会合后军，集足兵力再正面围城"},"answer":"A","explanation":"丁奉认为诸军行迟，若敌据便地便难争锋；其行动重在抢先与突击。","source":"《三国志》卷55·丁奉传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷55","source_locator":"東興","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-010","level":"medium","topic":"曹魏军政","category":"战略理解","question":"任峻在官渡战役中主要负责哪方面工作？","options":{"A":"前军营垒修筑","B":"乌巢突击队的战斗指挥","C":"军器和粮食运输","D":"渡河舟船与水军操练"},"answer":"C","explanation":"任峻典军器粮运，并采取护运措施。战役中的后勤保障与前线决战同样值得学习。","source":"《三国志》卷16·任峻传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷16","source_locator":"軍器糧運","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"197—207 官渡与河北归曹"},{"id":"v12-026","level":"hard","topic":"曹魏军政","category":"制度与细节","question":"任峻募百姓屯田于许下时，被任命为何职？","options":{"A":"绥集都尉","B":"典农校尉","C":"典农都尉","D":"典农中郎将"},"answer":"D","explanation":"《任峻传》正文记任峻为典农中郎将。屯田都尉见枣祗，绥集都尉见仓慈，不能只因都与屯田有关而混用。","source":"《三国志》卷16·任峻传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷16","source_locator":"典農中郎將","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"189—196 董卓与诸侯割据"},{"id":"v12-027","level":"hard","topic":"曹魏军政","category":"制度与细节","question":"《任峻传》记官渡护送粮运时，采用哪项具体组织方式？","options":{"A":"十乘为一部，多路分散，不设护卫","B":"百乘为一部，逐队前进，以轻骑开路","C":"千乘为一部，十道方行，以复阵营卫","D":"千乘为一部，集中一路，以步卒断后"},"answer":"C","explanation":"传文记千乘为一部、十道方行、为复陈以营卫之。题目考护运组织细节，不是曹操夜袭乌巢的行军方式。","source":"《三国志》卷16·任峻传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷16","source_locator":"十道方行","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"197—207 官渡与河北归曹"},{"id":"v12-028","level":"hard","topic":"曹魏军政","category":"制度与细节","question":"卫固等封锁陕津时，杜畿由哪处津渡绕道进入河东？","options":{"A":"郖津","B":"延津","C":"孟津","D":"白马津"},"answer":"A","explanation":"《杜畿传》记诡道从郖津度，并注郖音豆。不要将官渡战役的白马、延津等地名套入河东事件。","source":"《三国志》卷16·杜畿传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷16","source_locator":"郖津","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"197—207 官渡与河北归曹"},{"id":"v12-029","level":"hard","topic":"曹魏军政","category":"制度与细节","question":"《郑浑传》所记“郑陂”水利工程，兴建于哪两县交界？","options":{"A":"雒县与成都","B":"萧县与相县","C":"邺县与临漳","D":"许县与长社"},"answer":"B","explanation":"郑浑在萧、相两县界兴陂遏、开稻田，因地低湿而发展灌溉，郡人刻石称郑陂。","source":"《三国志》卷16·郑浑传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷16","source_locator":"鄭陂","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v12-030","level":"hard","topic":"曹魏军政","category":"制度与细节","question":"仓慈为欲前往洛阳的西域来客提供什么文书？","options":{"A":"封过所","B":"军中传檄","C":"屯田田券","D":"授官印绶"},"answer":"A","explanation":"《仓慈传》记欲诣洛者，为封过所，涉及通行凭证。返回者则由官府公平交易并护送，二者措施不同。","source":"《三国志》卷16·仓慈传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷16","source_locator":"為封過所","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v12-031","level":"medium","topic":"曹魏军政","category":"制度与细节","question":"《田豫传》记田豫离开刘备时，提出的直接理由是什么？","options":{"A":"曹操辟用，奉命离开刘备","B":"母亲年老，请求归家","C":"公孙瓒征兵，要求返回北方","D":"刘备改任豫州，令其留守幽州"},"answer":"B","explanation":"田豫在刘备为豫州刺史时以母老求归。刘备涕泣作别，此后仕历不能倒推当时离别理由。","source":"《三国志》卷26·田豫传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷26","source_locator":"母老求歸","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"189—196 董卓与诸侯割据"},{"id":"v12-032","level":"hard","topic":"曹魏军政","category":"制度与细节","question":"田豫随曹彰征代郡，遭伏骑时采取哪项阵形措施？","options":{"A":"依地形列车为直阵，弓弩居后，骑兵两翼","B":"依地形回车结圆阵，弓弩居内，以疑兵塞缺","C":"弃车据高地，弓弩前列，步兵环护","D":"以车护后路，轻骑先冲，再让步卒接战"},"answer":"B","explanation":"传文记因地形回车结圜阵，弓弩持满于内，并以疑兵塞隙。曹彰是鄢陵侯，不应误认成曹丕。","source":"《三国志》卷26·田豫传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷26","source_locator":"回車結圜陣","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"216—223 汉中襄樊与三国建国"},{"id":"v12-033","level":"medium","topic":"曹魏军政","category":"制度与细节","question":"向扬州求降并请求派兵迎接，而被满宠判断为诈降的吴将是谁？","options":{"A":"孙泰","B":"孙韶","C":"孙桓","D":"孙布"},"answer":"D","explanation":"《满宠传》记吴将孙布求迎，满宠拒绝给兵；王凌另派七百人后遭夜袭。几个孙氏将领不能互换。","source":"《三国志》卷26·满宠传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷26","source_locator":"孫布","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v12-034","level":"hard","topic":"曹魏军政","category":"制度与细节","question":"满宠建议将合肥旧城守军迁往哪一方向的新位置？","options":{"A":"旧城以东三十里","B":"旧城以北三十里","C":"旧城以西三十里","D":"旧城以南三十里"},"answer":"C","explanation":"《满宠传》记其西三十里有奇险可依，更立城以固守。该方位关系服务于引敌远水的构想。","source":"《三国志》卷26·满宠传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷26","source_locator":"其西三十里","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v12-035","level":"medium","topic":"曹魏军政","category":"制度与细节","question":"邓艾论述淮南水利、屯田与漕运时，著有何论？","options":{"A":"仇国论","B":"济河论","C":"典论","D":"辨亡论"},"answer":"B","explanation":"《邓艾传》明确记乃著济河论以喻其指。此题考具体文献名，其他书名属于不同作者与议题。","source":"《三国志》卷28·邓艾传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"濟河論","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"235—249 魏明帝后政与三国中期"},{"id":"v12-036","level":"hard","topic":"蜀汉战略与北伐","category":"制度与细节","question":"廖化在白水南对邓艾结营时，邓艾判断姜维真正要袭取哪里？","options":{"A":"祁山","B":"街亭","C":"洮城","D":"剑阁"},"answer":"C","explanation":"邓艾认为廖化的作用是牵制自己，姜维将从东袭洮城，因此连夜先据洮城。","source":"《三国志》卷28·邓艾传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"白水南","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-037","level":"medium","topic":"三国后期与禅代","category":"制度与细节","question":"邓艾先登至江由时，投降的蜀守将是谁？","options":{"A":"马邈","B":"傅佥","C":"师纂","D":"蒋舒"},"answer":"A","explanation":"《邓艾传》正文记蜀守将马邈降。师纂是邓艾部属，不是江由蜀将。","source":"《三国志》卷28·邓艾传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"馬邈","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-038","level":"medium","topic":"三国后期与禅代","category":"制度与细节","question":"王凌与令狐愚谋议废立，拟迎立的曹魏宗王是谁？","options":{"A":"曹霖","B":"曹植","C":"曹彪","D":"曹宇"},"answer":"C","explanation":"《王凌传》记二人拟迎楚王曹彪都许昌，理由涉及其年长有才。曹植并不是这次谋议对象。","source":"《三国志》卷28·王凌传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"楚王彪","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-039","level":"expert","topic":"史料辨析","category":"史料辨析","question":"裴松之对《汉晋春秋》中王广长篇劝父言辞的判断是什么？","options":{"A":"只质疑王凌的官爵称号，认为王广言辞基本可信","B":"因王广卒年早于王凌起事，断言整段年代错误","C":"前史不载、言语体式不似古，怀疑习凿齿自造","D":"认为引书应为《魏略》，仅反对题名《汉晋春秋》"},"answer":"C","explanation":"《王凌传》裴松之评论王广劝父的话：前史不载、言语体式不像当时，因而怀疑为习凿齿所造。这是注家据文体和载录提出的怀疑，不能写成已凭档案证实伪作；也不是因王广卒年或王凌官爵作出的判断。","source":"《三国志》卷28·王凌传（裴注评论《汉晋春秋》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"疑悉鑿齒所自造","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局","option_explanations":{"A":"这里并非只校正王凌官爵；裴松之明确怀疑这段辞令的形成。","B":"裴松之的质疑依据是前史载录与语言体式，本段没有以王广卒年论证。","C":"《王凌传》裴松之评论王广劝父的话：前史不载、言语体式不像当时，因而怀疑为习凿齿所造。这是注家据文体和载录提出的怀疑，不能写成已凭档案证实伪作；也不是因王广卒年或王凌官爵作出的判断。","D":"裴松之针对所引《汉晋春秋》内容发议论，不是仅更换书名。"}},{"id":"v12-040","level":"hard","topic":"三国后期与禅代","category":"制度与细节","question":"哪项朝廷任命直接加深诸葛诞的恐惧，并成为其起兵的近因？","options":{"A":"命诸葛诞赴陇右督军","B":"降诸葛诞为郡太守","C":"授诸葛诞征东将军留镇","D":"征诸葛诞入朝为司空"},"answer":"D","explanation":"《诸葛诞传》记甘露二年五月征为司空，诞被诏书愈恐遂反。征入朝与升官表面并不等于实际安全。","source":"《三国志》卷28·诸葛诞传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"徵為司空","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-041","level":"hard","topic":"三国后期与禅代","category":"制度与细节","question":"寿春粮食转竭时，文钦提出什么办法，随后与诸葛诞发生争执？","options":{"A":"遣出吴援军以省食，留北方人守城","B":"所有部队同夜分路突围，弃守寿春","C":"先使北方人出城攻围，吴人在城接应","D":"遣出北方人以省食，留吴人继续守城"},"answer":"D","explanation":"文钦欲尽出北方人以省食，与吴人坚守，诸葛诞不听。旧有嫌隙与危急形势使冲突加剧，后来诞杀欽。","source":"《三国志》卷28·诸葛诞传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"省食","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-042","level":"medium","topic":"三国后期与禅代","category":"制度与细节","question":"钟会在成都发难时，用何种伪造文书为起兵赋予名义？","options":{"A":"刘禅禅位诏","B":"太后遗诏","C":"孙休求援书","D":"邓艾自劾表"},"answer":"B","explanation":"《钟会传》记矫太后遗诏，使会起兵废文王。这里文王指司马昭，是史书追称，不是周文王。","source":"《三国志》卷28·钟会传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"太后遺詔","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"264—280 吴晋对峙与统一战争"},{"id":"v12-043","level":"hard","topic":"刘备入蜀与建国","category":"制度与细节","question":"庞统入蜀三计中，被刘备采用的中计包括哪项关键步骤？","options":{"A":"率轻兵袭成都，令白水军自行归附","B":"先擒刘璋，利用其印信调走白水守兵","C":"退到白帝，接诸葛亮援军后重入蜀","D":"佯归荆州，引杨怀高沛轻骑来见，除之并取其兵"},"answer":"D","explanation":"庞统的中计利用杨怀、高沛既惧刘备又喜其离去的心理；刘备然其中计。径袭成都为上计，退白帝为下计。","source":"《三国志》卷37·庞统传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"此中計也","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"208—215 赤壁与荆益格局"},{"id":"v12-044","level":"medium","topic":"刘备入蜀与建国","category":"制度与细节","question":"《庞统传》正文如何记载庞统之死？","options":{"A":"初会刘璋时遭伏兵袭杀","B":"攻雒县时中流矢而卒","C":"攻绵竹时在阵前被斩","D":"自葭萌退还荆州途中病卒"},"answer":"B","explanation":"正文记进围雒县，庞统率众攻城，为流矢所中。正文没有交代射手姓名，不能据小说补成明确凶手。","source":"《三国志》卷37·庞统传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"流矢","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"208—215 赤壁与荆益格局"},{"id":"v12-045","level":"hard","topic":"刘备入蜀与建国","category":"制度与细节","question":"向刘璋提出迁民、烧除仓廪野谷、坚壁待敌的谋士是谁？","options":{"A":"许靖","B":"张松","C":"郑度","D":"黄权"},"answer":"C","explanation":"《法正传》记郑度判断刘备孤军深入、依赖野谷，建议迁民毁粮、深沟高垒，待其退却再击。刘璋以不愿驱民避敌为由拒绝，法正则早已预测刘璋不会采纳。献策、预测和实际行动是三个不同层次。","source":"《三国志》卷37《法正传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"法正","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"208—215 赤壁与荆益格局"},{"id":"v12-046","level":"hard","topic":"刘备入蜀与建国","category":"制度与细节","question":"法正建议刘备厚待许靖，主要基于什么考虑？","options":{"A":"许靖代表刘璋宗族，厚待可获得继承名义","B":"许靖实掌成都守兵，厚待可防军事反攻","C":"许靖名望广布，冷落他会影响招贤观感","D":"许靖主持汉中粮运，厚待可保证军需"},"answer":"C","explanation":"《法正传》记法正认为许靖虽有虚誉，却名望广布，若新政权冷落他，天下会以为刘备轻贤。这里考的是名望与招贤观感，不能把许靖名声直接等同于实际才干。裴注所引孙盛及裴松之评论另有立场，应与法正的当时意见区分。","source":"《三国志》卷37·法正传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"浮稱播流四海","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"208—215 赤壁与荆益格局"},{"id":"v12-047","level":"hard","topic":"刘备入蜀与建国","category":"制度与细节","question":"裴注引《零陵先贤传》记刘巴在成都府库不足时提出什么办法？","options":{"A":"铸直百钱、平物价、令吏为官市","B":"禁止铸钱、只征实物、专向荆州借贷","C":"铸五铢钱、加田租、禁止私市","D":"废旧钱、以蜀锦统一兑换、罢官市"},"answer":"A","explanation":"裴注引《零陵先贤传》记成都府库因士卒争取财物而军用不足，刘巴提出直百钱、平物价与官市的组合措施；不能只归结为加征田租，也不能据此断定没有货币贬值或交易影响。","source":"《三国志》卷39《刘巴传》（裴注引《零陵先贤传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷39","source_locator":"刘巴","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"208—215 赤壁与荆益格局"},{"id":"v12-048","level":"expert","topic":"史料辨析","category":"史料辨析","question":"比较《三国志》几处记载，哪项准确区分了马谡结局的传文措辞？","options":{"A":"《马良传》附马谡记下狱物故，《诸葛亮传》记诛马谡，《王平传》记戮谡","B":"《马良传》附马谡记诛马谡，《诸葛亮传》记戮谡，《王平传》记下狱物故","C":"《马良传》附马谡记戮谡，《诸葛亮传》记下狱物故，《王平传》记诛马谡","D":"《马良传》附马谡记下狱物故，《诸葛亮传》记戮谡，《王平传》记诛马谡"},"answer":"D","explanation":"《马良传》附马谡用“下狱物故”，《诸葛亮传》用“戮谡”，《王平传》用“诛马谡及将军张休、李盛”。这些措辞需要合读；单靠“物故”不能确定具体死法，也不能据此反证未被处死。相关链接另见 https://zh.wikisource.org/wiki/三國志/卷35 与 https://zh.wikisource.org/wiki/三國志/卷43 。","source":"《三国志》卷39《马良传附马谡》（正文，并参卷35《诸葛亮传》、卷43《王平传》）","source_url":"https://zh.wikisource.org/wiki/三國志/卷39","source_locator":"马良附马谡","novel_note":"《三国演义》强化了“挥泪斩马谡”的戏剧场景；本题比较史书用语，不凭小说确定具体行刑方式。","period":"223—234 魏蜀吴对峙与诸葛北伐","option_explanations":{"A":"把《诸葛亮传》的“戮谡”与《王平传》的“诛马谡”对换了。","B":"“下狱物故”见《马良传》附马谡，不在《王平传》。","C":"把《马良传》附马谡与《诸葛亮传》的措辞对换了。","D":"《马良传》附马谡用“下狱物故”，《诸葛亮传》用“戮谡”，《王平传》用“诛马谡及将军张休、李盛”。这些措辞需要合读；单靠“物故”不能确定具体死法，也不能据此反证未被处死。相关链接另见 https://zh.wikisource.org/wiki/三國志/卷35 与 https://zh.wikisource.org/wiki/三國志/卷43 。"}},{"id":"v12-049","level":"hard","topic":"东吴外交与战争","category":"制度与细节","question":"孙休有关教育的诏令明确要求设立哪类学官？","options":{"A":"五经博士","B":"四门助教","C":"太子洗马","D":"国子祭酒"},"answer":"A","explanation":"《孙休传》记置学官、立五经博士，并令有志的现任吏及将吏子弟就学，按年课试授奖。不要把后世学官名套入此诏。","source":"《三国志》卷48·孙休传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷48","source_locator":"五經博士","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v12-050","level":"hard","topic":"东吴外交与战争","category":"制度与细节","question":"丁奉建议孙休借什么场合控制并诛除孙綝？","options":{"A":"临朝策拜新任将领","B":"在江陵会见魏国使者","C":"巡视武昌驻军","D":"岁末腊会群臣朝集"},"answer":"D","explanation":"丁奉考虑孙綝兄弟友党势盛，建议利用臘会及皇帝兵力。臘会是岁末祭祀宴集相关场合；綝读chēn。","source":"《三国志》卷55·丁奉传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷55","source_locator":"臘會","novel_note":"本题依据所列史书层级；注引、注家判断和现代战略分析分别说明，小说情节不直接用作史实。","period":"249—263 权臣更替与三国晚局"},{"id":"v13-hard-001","level":"hard","topic":"三国后期与禅代","category":"战略与史料判断","question":"西陵战事中，陆抗命张咸毁掉此前所筑水堰。其意图与羊祜军随后反应相符的是哪一组？","options":{"A":"泄水便利步战—晋军加快抵城","B":"泄水削弱舟运—晋军改用车运","C":"保留陆路诱敌—晋军转攻西陵","D":"改变水势隔军—晋军撤回襄阳"},"answer":"B","explanation":"羊祜欲借蓄水浮船运粮；堰败后改船以车运，大费功力。","option_explanations":{"A":"便利步军正是羊祜对外声称的理由，实际后果却是其粮运成本上升。","B":"羊祜欲借蓄水浮船运粮；堰败后改船以车运，大费功力。","C":"毁堰与晋军改粮运有关，不能据此说羊祜转攻西陵。","D":"该段没有记载毁堰使羊祜立即撤回襄阳。"},"source":"《三国志》卷58·陆抗传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"堰敗","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"264—280 吴晋对峙与统一战争"},{"id":"v13-hard-002","level":"hard","topic":"三国后期与禅代","category":"战略与史料判断","question":"诸将建议趁晋援未至速攻步阐。陆抗坚持先筑围，最关键的判断是哪一项？","options":{"A":"城固粮足，速攻难免两面受敌","B":"援军粮少，筑围可使其自溃","C":"叛军善野战，筑围旨在截其骑兵","D":"城内有应，筑围便于接应开门"},"answer":"A","explanation":"陆抗知道城防与储备，判断难以卒克且北救必至，因此必须兼防内外。","option_explanations":{"A":"陆抗知道城防与储备，判断难以卒克且北救必至，因此必须兼防内外。","B":"传文未以晋军粮少作为先筑围的判断前提。","C":"其顾虑是攻坚未成而外援到来，不是叛军骑兵突出的野战优势。","D":"该段没有可靠内应开门的前提；选择围困不是接应内应。"},"source":"《三国志》卷58·陆抗传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"表裡受難","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"264—280 吴晋对峙与统一战争"},{"id":"v13-hard-003","level":"hard","topic":"蜀汉战略与北伐","category":"战略与史料判断","question":"隆中对设想天下有变后的两路行动。哪项把出兵地区、方向及统率者对应正确？","options":{"A":"荆军向宛洛，上将；益军向秦川，刘备","B":"荆军向宛洛，刘备；益军向秦川，上将","C":"荆军向秦川，上将；益军向宛洛，刘备","D":"荆军向秦川，刘备；益军向宛洛，上将"},"answer":"A","explanation":"原文两路为荆州军向宛洛、刘备率益州众出秦川。","option_explanations":{"A":"原文两路为荆州军向宛洛、刘备率益州众出秦川。","B":"方向正确，但原文刘备亲率益州之众，上将统荆州军。","C":"统率位置正确，两个出兵方向却互换了。","D":"既交换方向，也交换了刘备与上将的统率位置。"},"source":"《三国志》卷35·诸葛亮传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"向宛","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"197—207 官渡与河北归曹"},{"id":"v13-hard-004","level":"hard","topic":"蜀汉战略与北伐","category":"战略与史料判断","question":"关于五丈原屯田，下列哪项组合与《诸葛亮传》正文相符？","options":{"A":"屯田服务速决；先迁出渭滨居民","B":"屯田补充供粮；耕区只设在蜀境","C":"屯田替代流马；耕者均从汉中迁入","D":"屯田支撑久驻；耕者杂于当地居民"},"answer":"D","explanation":"原文将粮不继、久驻之基、耕者杂于渭滨居民联系起来。","option_explanations":{"A":"目的为久驻之基，且百姓安堵，不是为速决而先迁居民。","B":"屯田与供粮有关，但原文位置是渭滨，不限于蜀境。","C":"传文同段仍记以流马运，没有说屯田替代全部运输，更没有说耕者均迁自汉中。","D":"原文将粮不继、久驻之基、耕者杂于渭滨居民联系起来。"},"source":"《三国志》卷35·诸葛亮传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"雜於渭濱","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v13-hard-005","level":"hard","topic":"东吴外交与战争","category":"战略与史料判断","question":"《周瑜传》正文记周瑜分析曹军用兵之患。哪组因素均在该段列举之中？","options":{"A":"江夏未下、马匹不足、盛暑疫病","B":"北军疲弊、舟船连锁、淮南缺粮","C":"荆州兵疑、川峡运粮、北土新乱","D":"关西后患、水战不长、盛寒缺草"},"answer":"D","explanation":"正文列关西马韩后患、舍鞍马用舟、盛寒马无蒿草及不习水土。","option_explanations":{"A":"该段是盛寒而非盛暑，且没有这一组关于江夏和马数的列举。","B":"连船是黄盖火攻判断的另一段，淮南缺粮也不在此段。","C":"荆州降众狐疑见同传注引材料，川峡运粮不是该段列举因素。","D":"正文列关西马韩后患、舍鞍马用舟、盛寒马无蒿草及不习水土。"},"source":"《三国志》卷54·周瑜传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"北土既未平安","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"208—215 赤壁与荆益格局"},{"id":"v13-hard-006","level":"hard","topic":"曹魏军政","category":"战略与史料判断","question":"据《武帝纪》正文，曹操袭淳于琼粮屯时对兵力的使用，哪项叙述正确？","options":{"A":"自守官渡；令曹洪与徐晃并攻粮屯","B":"撤弃官渡；自将诸军先破援骑","C":"留曹洪守营；自将精兵夜袭粮屯","D":"留张郃守营；令曹仁断袁军退路"},"answer":"C","explanation":"正文记留曹洪守，自将步骑五千人夜往，主营与突击分工并行。","option_explanations":{"A":"曹洪留守；徐晃此前曾击运粮车，不能将两次行动合并为此次部署。","B":"正文没有撤弃主营；援骑接近时曹操也未按建议分兵迎拒。","C":"正文记留曹洪守，自将步骑五千人夜往，主营与突击分工并行。","D":"张郃当时属袁绍，不能作为曹军留守将。"},"source":"《三国志》卷1·武帝纪（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"留曹洪守","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"197—207 官渡与河北归曹"},{"id":"v13-hard-007","level":"hard","topic":"三国后期与禅代","category":"战略与史料判断","question":"俞赞投奔杨肇后，陆抗判断其会透露围垒弱处。陆抗采取的对应措施是什么？","options":{"A":"放弃旧围，另筑围垒引其深入","B":"佯撤江陵守兵，截击晋军后路","C":"夜换弱部，以旧将加强原来守段","D":"暂撤前军，先攻击杨肇粮车"},"answer":"C","explanation":"俞赞知吴军虚实，陆抗夜换不简练夷兵，翌日杨肇果攻原处。","option_explanations":{"A":"陆抗利用既有围垒，没有把主措施改为放弃旧围。","B":"该段调整的是围垒中夷兵守段，不是抽空江陵。","C":"俞赞知吴军虚实，陆抗夜换不简练夷兵，翌日杨肇果攻原处。","D":"直接针对杨肇预期攻击点的措施是换防，不是该段所记攻击粮车。"},"source":"《三国志》卷58·陆抗传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"即夜易夷民","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"264—280 吴晋对峙与统一战争"},{"id":"v13-hard-008","level":"hard","topic":"蜀汉战略与北伐","category":"战略与史料判断","question":"隆中对对周边关系的安排中，哪项将方位、对象与措辞对应正确？","options":{"A":"西和诸戎，南结孙权，外抚夷越","B":"西和诸戎，南抚夷越，外结孙权","C":"西结孙权，南抚夷越，外和诸戎","D":"西抚夷越，南和诸戎，外结孙权"},"answer":"B","explanation":"原文为西和诸戎、南抚夷越、外结好孙权，并内修政理。这些关系为根据地与后续行动提供条件。","option_explanations":{"A":"西和诸戎正确，南抚夷越与外结好孙权的对象被互换。","B":"原文为西和诸戎、南抚夷越、外结好孙权，并内修政理。这些关系为根据地与后续行动提供条件。","C":"南抚夷越正确，西部诸戎关系与对孙权结援的对应被互换。","D":"对孙权的结援对应正确，诸戎与夷越的方位及和抚对应互换。"},"source":"《三国志》卷35·诸葛亮传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"西和諸戎","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"197—207 官渡与河北归曹"},{"id":"v13-hard-009","level":"hard","topic":"三国后期与禅代","category":"战略与史料判断","question":"羊祜进向江陵时，陆抗仍把主力重心放在西陵。哪组判断与其答复相符？","options":{"A":"江陵尚能自守；西陵久据会牵动南山诸夷","B":"江陵晋军已退；西陵援军尚无渡水能力","C":"江陵便于弃守；西陵是吴军唯一粮仓","D":"江陵守卒不足；西陵必须速攻才能解围"},"answer":"A","explanation":"陆抗认为江陵城固兵足，西陵若被叛军稳固盘结则南山群夷会受扰动。","option_explanations":{"A":"陆抗认为江陵城固兵足，西陵若被叛军稳固盘结则南山群夷会受扰动。","B":"他处理的是羊祜军正在接近的威胁，没有晋军已退的前提。","C":"其答复不是江陵随时应弃，也没称西陵唯一粮仓。","D":"陆抗恰说江陵兵足，并反对在外援风险下仓促攻西陵。"},"source":"《三国志》卷58·陆抗传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷58","source_locator":"寧棄江陵","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"264—280 吴晋对峙与统一战争"},{"id":"v13-hard-010","level":"hard","topic":"东吴外交与战争","category":"战略与史料判断","question":"《周瑜传》记黄盖火攻时，下列哪组手段及作用对应最准确？","options":{"A":"船后系走舸—加强冲撞；致书诈降—拖延出发","B":"船后系走舸—拖带火船；竖旗覆幕—遮断风势","C":"薪草灌油—起火延烧；船后系走舸—预备脱离","D":"薪草灌油—阻碍登船；致书诈降—诱其追入江口"},"answer":"C","explanation":"正文记装薪草灌油，并预备走舸系大船后；结合使用可解释火攻与人员脱离安排。","option_explanations":{"A":"走舸不是为加强撞击，诈降书的作用也不是拖延己方出发。","B":"走舸预备逃离，而非以小船拖带火船；帷幕旗号也不能解释为遮断风势。","C":"正文记装薪草灌油，并预备走舸系大船后；结合使用可解释火攻与人员脱离安排。","D":"燃料用于焚烧，诈降使曹军误认来降，并非诱敌船追入江口。"},"source":"《三国志》卷54·周瑜传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"豫備走舸","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"208—215 赤壁与荆益格局"},{"id":"v13-hard-011","level":"hard","topic":"曹魏军政","category":"战略与史料判断","question":"杜畿已被卫固、范先接纳后，如何逐步削弱二人对部众的控制？","options":{"A":"优先处决渠帅，赦免外围军卒","B":"先收回兵权，再统一征发百姓","C":"迁民至许都，令曹军接管诸县","D":"改急发为慢募，分遣将吏休息"},"answer":"D","explanation":"徐以赀募兵拖缓动员，分遣休息使众离，随后善人在外形成援助。","option_explanations":{"A":"处决渠帅发生在叛势败后，不是初被接纳时的核心分化办法。","B":"他一度让卫固任都督、范先督吏兵，并没有先直接收回兵权。","C":"传文所述不是以迁民许都和立即曹军接管实现分化。","D":"徐以赀募兵拖缓动员，分遣休息使众离，随后善人在外形成援助。"},"source":"《三国志》卷16·杜畿传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷16","source_locator":"徐以赀募兵","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"197—207 官渡与河北归曹"},{"id":"v13-hard-012","level":"hard","topic":"曹魏军政","category":"战略与史料判断","question":"仓慈处理西域来客时，哪项把“欲诣洛”与“欲从郡还”两类措施区分正确？","options":{"A":"诣洛者由豪族担保；返者全部在郡留居","B":"诣洛者直接授官；返者发通行文书","C":"诣洛者封过所；返者官府公平交易并护送","D":"两类均先给田，后由屯田官统一遣送"},"answer":"C","explanation":"正文区分这两类来客，反映通行与返程交易保障的不同需要。","option_explanations":{"A":"传文恰是纠正豪族阻断欺诈，不依赖豪族担保，也不是强令返者留居。","B":"前往洛阳给过所而非授官；返者措施包括官平取和护送。","C":"正文区分这两类来客，反映通行与返程交易保障的不同需要。","D":"给田是另一项针对当地贫民的治理措施，不是两类商旅的统一安置办法。"},"source":"《三国志》卷16·仓慈传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷16","source_locator":"欲從郡還","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v13-hard-013","level":"medium","topic":"曹魏军政","category":"战略与史料判断","question":"蔣济反对内移合肥守军，满宠的回应主要重新区分了哪一对概念？","options":{"A":"蔣济担心移城妨碍舟运，满宠认为粮运可全改骑兵运输","B":"蔣济主张移城择险，满宠认为退让外形会使吴军更勇","C":"蔣济把移城视为示弱，满宠认为示弱外形可与择险制敌相配","D":"蔣济担心新城距江太近，满宠认为近水便于速战"},"answer":"C","explanation":"蔣济视移城为示弱自拔，满宠强调形实不必相应，外观退弱可用于引敌远水。","source":"《三国志》卷26·满宠传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷26","source_locator":"形實不必相應","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v13-hard-014","level":"hard","topic":"曹魏军政","category":"战略与史料判断","question":"孙权扬声攻合肥后暂退。满宠判断退军可能是诱罢魏军，其依据最接近哪项？","options":{"A":"孙权舟船受损，只能改走陆路","B":"大举而未达目的，可能再返乘虚","C":"吴军已知魏军粮尽，必将分兵屯田","D":"吴军已夺寿春，暂退为调换守军"},"answer":"B","explanation":"满宠指出大举而还非本意，可能利用魏军解散召集军后再回击。","option_explanations":{"A":"本段不以舟船损坏与改道解释退军。","B":"满宠指出大举而还非本意，可能利用魏军解散召集军后再回击。","C":"该段没有魏军粮尽或吴军屯田的前提。","D":"孙权当时未据寿春，这会把战局基础改写。"},"source":"《三国志》卷26·满宠传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷26","source_locator":"表不罷兵","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v13-hard-015","level":"hard","topic":"曹魏军政","category":"战略与史料判断","question":"邓艾在淮南屯田建议中，将劳动力、生产与运输作了怎样的联动安排？","options":{"A":"各城自储自用，减少江淮舟船运输","B":"只扩稻田数量，军队继续依赖远途车运","C":"近战区且田且守，开渠灌溉兼通漕运","D":"屯兵尽归许昌，粮船由淮南上溯补给"},"answer":"C","explanation":"淮北淮南分屯、轮休且田且守，开渠既提高生产也减少远途运粮压力。","option_explanations":{"A":"方案强调通运漕之道，后来东南有事可泛舟而下，不是减少漕运。","B":"田、水、运输一并安排，不能缩为只扩田亩。","C":"淮北淮南分屯、轮休且田且守，开渠既提高生产也减少远途运粮压力。","D":"他提出可省许昌左右诸稻田并水东下，不是集中回许昌。"},"source":"《三国志》卷28·邓艾传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"運兵過半","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"235—249 魏明帝后政与三国中期"},{"id":"v13-hard-016","level":"medium","topic":"三国后期与禅代","category":"战略与史料判断","question":"赦免出降的文鸯、文虎后，司马昭让他们巡城传话。其最直接的攻心对象是谁？","options":{"A":"洛阳群臣，以证明其没有废立意图","B":"寿春守众，以减轻降后被杀的恐惧","C":"魏军将领，以制止对淮南军的争功","D":"江东吴廷，以争取孙綝停止救援"},"answer":"B","explanation":"文钦之子尚获赦，传话使其他守众相信出降未必受杀，城内因此扰动。","option_explanations":{"A":"本段没有巡城向洛阳群臣证明废立立场的目的。","B":"文钦之子尚获赦，传话使其他守众相信出降未必受杀，城内因此扰动。","C":"该举措不是围绕魏军争功，而是影响守方继续抵抗的意愿。","D":"传话对城内，不能将直接对象换成远在江东的吴廷。"},"source":"《三国志》卷28·诸葛诞传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"使將兵數百騎","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"249—263 权臣更替与三国晚局"},{"id":"v13-hard-017","level":"hard","topic":"三国后期与禅代","category":"战略与史料判断","question":"司马昭初围寿春主张先围困而非急攻。他将哪两种风险联系在一起？","options":{"A":"城固众多使强攻力屈，外援到来使内外夹击","B":"城内粮足使围困延长，吴军沿水使补给受阻","C":"守军外突使围垒破裂，吴援深入使地方易主","D":"吴军来援使魏军分兵，淮水上涨使围垒失效"},"answer":"A","explanation":"正文明确先说攻之必力屈，再说外寇到来可能表里受敌。","option_explanations":{"A":"正文明确先说攻之必力屈，再说外寇到来可能表里受敌。","B":"这是可能讨论的另一组战争风险，却不是正文此处不急攻的论证链。","C":"围垒与外围控制虽相关，该段重在强攻使自身力屈后面临外援夹击。","D":"淮水上涨是注引材料中诸葛诞对围垒的预计，不能移为司马昭此段拒急攻的依据。"},"source":"《三国志》卷28·诸葛诞传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"若有外寇","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"249—263 权臣更替与三国晚局"},{"id":"v13-hard-018","level":"hard","topic":"三国后期与禅代","category":"战略与史料判断","question":"邓艾预计奇兵趋涪后，剑阁守军两种选择会分别给魏军带来什么机会？","options":{"A":"剑阁军回救涪地，则诸葛绪攻成都；不回，则钟会改攻沓中","B":"剑阁军回救涪地，则邓艾北撤；不回，则钟会退汉中","C":"剑阁军回救涪地，则钟会推进；不回，则涪地抵抗较少","D":"剑阁军回救涪地，则钟会攻阴平；不回，则邓艾守剑阁"},"answer":"C","explanation":"邓艾奏议把两种敌方选择分别对应到己方收益：回援使钟会能沿正面前进，不回使涪地兵少。它仍是战前判断，不能写成剑阁守军实际已经回援。阴平山道艰险、粮运将匮则说明执行风险。","source":"《三国志》卷28·邓艾传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"方軌而進","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"249—263 权臣更替与三国晚局"},{"id":"v13-hard-019","level":"hard","topic":"三国后期与禅代","category":"战略与史料判断","question":"邓艾绕开剑阁后的推进路线，哪项按《邓艾传》记载顺序排列正确？","options":{"A":"阴平险道—绵竹决战—江由受降—进军到雒","B":"阴平险道—进军到雒—江由受降—绵竹决战","C":"阴平险道—江由受降—进军到雒—绵竹决战","D":"阴平险道—江由受降—绵竹决战—进军到雒"},"answer":"D","explanation":"传文先写险道行军，后记江由马邈降、绵竹破诸葛瞻，再进军到雒。","option_explanations":{"A":"马邈在江由降于邓艾先登部队，先于诸葛瞻的绵竹决战。","B":"进军到雒已是绵竹战后，不在江由受降之前。","C":"江由与阴平先后正确，但绵竹战胜后才进军到雒。","D":"传文先写险道行军，后记江由马邈降、绵竹破诸葛瞻，再进军到雒。"},"source":"《三国志》卷28·邓艾传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"先登至江由","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"249—263 权臣更替与三国晚局"},{"id":"v13-hard-020","level":"hard","topic":"刘备入蜀与建国","category":"战略与史料判断","question":"郑度建议迁民毁粮，刘璋拒绝。哪项最准确区分“献策依据”与“拒绝理由”？","options":{"A":"依据刘备舟师强；拒绝因己方水军薄","B":"依据曹操将南下；拒绝因不愿联吴","C":"依据刘备围城久；拒绝因将领争权","D":"依据刘备赖野谷；拒绝因不愿动民避敌"},"answer":"D","explanation":"郑度从野谷供资着手，刘璋则提出拒敌以安民的政治理由。","option_explanations":{"A":"该计针对客军粮资，不以刘备舟师优势为出发点。","B":"曹操将南下与联吴意愿不构成该段策与拒的对应关系。","C":"郑度判断客军无辎重、可断资使自走，并非以已围城久为条件。","D":"郑度从野谷供资着手，刘璋则提出拒敌以安民的政治理由。"},"source":"《三国志》卷37·法正传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"吾聞拒敵","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"208—215 赤壁与荆益格局"},{"id":"v13-hard-021","level":"hard","topic":"刘备入蜀与建国","category":"战略与史料判断","question":"法正劝取汉中后，对上、中、下三种前景的排序是哪一项？","options":{"A":"倾覆寇敌—蚕食雍凉—固守要害","B":"蚕食雍凉—固守要害—倾覆寇敌","C":"固守要害—倾覆寇敌—蚕食雍凉","D":"倾覆寇敌—固守要害—蚕食雍凉"},"answer":"A","explanation":"原文上为倾覆寇敌、尊奖王室，中为蚕食雍凉，下为固守要害持久。","option_explanations":{"A":"原文上为倾覆寇敌、尊奖王室，中为蚕食雍凉，下为固守要害持久。","B":"把最高目标放到最后，交换了层级。","C":"防守是下策前景，不是首先列出的最大成果。","D":"上策位置正确，中下的拓地与持久防守却互换。"},"source":"《三国志》卷37·法正传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"下可以固守","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"216—223 汉中襄樊与三国建国"},{"id":"v13-hard-022","level":"hard","topic":"刘备入蜀与建国","category":"战略与史料判断","question":"刘备初会刘璋时不愿当场擒之，与后来采纳庞统中计相比，哪项区分正确？","options":{"A":"初拒因曹军临涪；中计改为会同张鲁","B":"初拒因成都粮足；中计改为先攻成都","C":"初拒因荆州失守；中计改为退回白帝","D":"初拒因恩信未著；中计先处理关头将兵"},"answer":"D","explanation":"正文初会与后来的三计分属不同决策时点，中计利用杨怀高沛轻骑来见。","option_explanations":{"A":"原文没有曹军临涪及联张鲁作为这两步的对应前提。","B":"初拒理由为恩信未著；径袭成都是上计，不是后来采用的中计。","C":"此时并非因荆州已失而拒执璋；退白帝是下计。","D":"正文初会与后来的三计分属不同决策时点，中计利用杨怀高沛轻骑来见。"},"source":"《三国志》卷37·庞统传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷37","source_locator":"初入他國","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"208—215 赤壁与荆益格局"},{"id":"v13-hard-023","level":"hard","topic":"东吴外交与战争","category":"战略与史料判断","question":"六安居民散走后，全琮不准分兵捕民。哪项体现他对该行动价值的判断？","options":{"A":"所获能显著弱敌，唯路远而不便运输","B":"收益不足以弱敌，分兵遇敌却可能重损","C":"捕民会妨碍围城，先拔城可尽取人口","D":"居民已应承归附，捕民会破坏受降仪式"},"answer":"B","explanation":"既评估有限收益，又评估分散兵力后的遭遇风险，传文两者相连。","option_explanations":{"A":"全琮恰说纵有所获仍不足以弱敌，不是仅受运输限制。","B":"既评估有限收益，又评估分散兵力后的遭遇风险，传文两者相连。","C":"其理由集中于分兵得失风险，不能补写为先围城尽取人口。","D":"本段没有居民已经应承归附与受降仪式的前提。"},"source":"《三国志》卷60·全琮传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷60","source_locator":"不足以弱敵","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"223—234 魏蜀吴对峙与诸葛北伐"},{"id":"v13-hard-024","level":"expert","topic":"三国后期与禅代","category":"战略与史料判断","question":"《邓艾传》记灭蜀后邓艾要求承制处置新附，司马昭却令事当须报。哪项把争议的具体内容对应正确？","options":{"A":"邓艾先请示获准任官，司马昭经钟会撤回授权；邓艾以已有诏命申辩","B":"邓艾承制任官，司马昭经卫瓘令上报；邓艾以新附待安和往返延日申辩","C":"钟会承制任官，司马昭经邓艾令上报；钟会以新附待安和往返延日申辩","D":"卫瓘承制任官，司马昭经钟会令上报；卫瓘以路途延误军机申辩"},"answer":"B","explanation":"邓艾承制任命蜀官、安排刘禅等，司马昭使卫瓘传意，要求事情上报，不宜擅行。邓艾以新附待安与道路往返延误为由再次解释；这与同时出现的伐吴筹划有关，但不能把权宜理由等同于中枢已授权。政治嫌疑还涉及钟会等构陷，不能单因成功或功劳便下结论。","source":"《三国志》卷28《邓艾传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"邓艾","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"264—280 吴晋对峙与统一战争","option_explanations":{"A":"传文是任命后被要求上报，未记事先已经获准再被撤回。传意者为卫瓘。","B":"邓艾承制任命蜀官、安排刘禅等，司马昭使卫瓘传意，要求事情上报，不宜擅行。邓艾以新附待安与道路往返延误为由再次解释；这与同时出现的伐吴筹划有关，但不能把权宜理由等同于中枢已授权。政治嫌疑还涉及钟会等构陷，不能单因成功或功劳便下结论。","C":"把邓艾的承制安置和申辩转给钟会；钟会在另一环节指控邓艾。","D":"卫瓘传达司马昭的要求，不是这段承制任命的发起者。"}},{"id":"v13-hard-025","level":"hard","topic":"三国后期与禅代","category":"战略与史料判断","question":"钟会将诸将拘于益州诸曹后，胡烈如何把信息传到外军，从而削弱封锁效果？","options":{"A":"借姜维公开告示，令蜀民转告魏军","B":"借郭太后洛阳使者，传出恢复曹魏的诏书","C":"借邓艾营中旧吏，传出撤回淮南的军令","D":"借准入送饭的亲兵，传出将被坑杀的消息"},"answer":"D","explanation":"丘建请求让胡烈有亲兵送饮食，各牙门援例；胡烈向亲兵与其子传话，一夜遍军。消息真假须按传文语境辨析。","option_explanations":{"A":"封锁破口不是姜维向蜀民公开告示。","B":"此时太后遗诏为钟会伪造的起兵名义，不能换成洛阳使者传入的真实诏书。","C":"邓艾营中旧吏与淮南撤军令不构成此段的信息传递链。","D":"丘建请求让胡烈有亲兵送饮食，各牙门援例；胡烈向亲兵与其子传话，一夜遍军。消息真假须按传文语境辨析。"},"source":"《三国志》卷28·钟会传（正文；战略效果为基于正文的分析）","source_url":"https://zh.wikisource.org/wiki/三國志/卷28","source_locator":"內一親兵","novel_note":"题目限定所列传文；不同史书的叙述须另行比较。","period":"264—280 吴晋对峙与统一战争"},{"id":"v14-001","level":"easy","topic":"汉末群雄与政局","category":"史实记忆","question":"黄巾起事的主要组织者张角，以哪一种宗教性教化网络聚集徒众？","options":{"A":"太平道","B":"五斗米道","C":"地方经学博士弟子","D":"西园八校尉的军户"},"answer":"A","explanation":"张角奉事黄老、以符水咒说治病，逐步聚众；其太平道与汉中张鲁的五斗米道不属同一组织。","source":"《后汉书》卷71·皇甫嵩朱儁列传（正文）","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"皇甫嵩朱儁列传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"184—189 黄巾与汉末危机"},{"id":"v14-002","level":"medium","topic":"汉末群雄与政局","category":"史实记忆","question":"184年皇甫嵩在长社对波才所部获胜，特别利用了什么条件？","options":{"A":"敌军依草结营，夜间纵火配合出击","B":"敌军水寨连船，借东风放火","C":"先夺敌军渡口，再断其粮道","D":"利用山间雪崩阻断援军"},"answer":"A","explanation":"波才依草结营；皇甫嵩见风起而纵火并出击，和赤壁火攻并非同一事件。","source":"《后汉书》卷71·皇甫嵩朱儁列传（正文）","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"皇甫嵩朱儁列传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"184—189 黄巾与汉末危机"},{"id":"v14-003","level":"easy","topic":"汉末群雄与政局","category":"史实记忆","question":"黄巾起事时，张角为自己所立的称号是哪一个？","options":{"A":"地公将军","B":"车骑将军","C":"人公将军","D":"天公将军"},"answer":"D","explanation":"张角号天公将军；其弟张宝号地公将军、张梁号人公将军。","source":"《后汉书》卷71·皇甫嵩朱儁列传（正文）","source_url":"https://zh.wikisource.org/wiki/後漢書/卷71","source_locator":"皇甫嵩朱儁列传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"184—189 黄巾与汉末危机"},{"id":"v14-004","level":"medium","topic":"汉末群雄与政局","category":"史实与因果","question":"汉灵帝死后，何进召董卓入京的直接政治背景是什么？","options":{"A":"令董卓护驾东巡，避开京师宦官","B":"以外兵胁迫太后，推进诛宦官","C":"请边军驻洛阳，防止袁绍自行诛宦官","D":"借董卓兵追击黄巾，暂缓宫廷清算"},"answer":"B","explanation":"《董卓传》记何进与袁绍谋诛宦官，太后不从，故召董卓兵入京；董卓尚未抵京何进已遇害。","source":"《三国志》卷6·董卓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-005","level":"medium","topic":"汉末群雄与政局","category":"史实与因果","question":"董卓入洛阳后废黜少帝刘辩，改立哪位宗室为帝？","options":{"A":"渤海王刘悝","B":"陈留王刘协","C":"山阳公刘协","D":"弘农王刘辩"},"answer":"B","explanation":"董卓废刘辩而立其弟陈留王刘协，后者即汉献帝；山阳公是刘协退位后的封号。","source":"《三国志》卷6·董卓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-006","level":"medium","topic":"汉末群雄与政局","category":"史实与因果","question":"董卓获得丁原部众控制权的一项关键行动是？","options":{"A":"使吕布杀丁原，收其部众","B":"与丁原共推刘协，事后将其罢官","C":"以何进遗令让丁原主动让兵","D":"先将丁原调出京师，再接管部众"},"answer":"A","explanation":"《董卓传》记董卓使吕布杀丁原并吞并其军，扩充洛阳兵权。","source":"《三国志》卷6·董卓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-007","level":"medium","topic":"汉末群雄与政局","category":"史实与因果","question":"董卓控制朝廷后，将汉廷由洛阳迁往哪座城市？","options":{"A":"许县","B":"宛城","C":"长安","D":"邺城"},"answer":"C","explanation":"董卓迁都长安，洛阳宫室遭焚毁；这是东汉末年关东战乱的重要节点。","source":"《三国志》卷6·董卓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-008","level":"medium","topic":"汉末群雄与政局","category":"史实与因果","question":"初平年间关东诸侯共同起兵讨董，袁绍被推为何种盟内角色？","options":{"A":"监国","B":"盟主","C":"关中都督","D":"大将军兼尚书令"},"answer":"B","explanation":"诸州郡推袁绍为盟主，但联盟并未建立统一指挥体系，成员行动亦不一致。","source":"《三国志》卷6·袁绍传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"袁绍传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-009","level":"medium","topic":"汉末群雄与政局","category":"史实与因果","question":"曹操追击西撤董卓军时，在荥阳汴水败于哪位将领？","options":{"A":"张济","B":"华雄","C":"李傕","D":"徐荣"},"answer":"D","explanation":"《武帝纪》记曹操到荥阳汴水，为董卓将徐荣所败；孙坚击华雄是另一战事。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-010","level":"medium","topic":"汉末群雄与政局","category":"史实与因果","question":"孙坚在阳人之战破董卓部队时，击斩的董卓将领是谁？","options":{"A":"华雄","B":"胡轸","C":"樊稠","D":"郭汜"},"answer":"A","explanation":"《孙破虏讨逆传》记孙坚大破卓军于阳人，枭其都督华雄等；将此战归为关羽功绩是小说情节。","source":"《三国志》卷46·孙破虏讨逆传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙破虏讨逆传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-011","level":"easy","topic":"汉末群雄与政局","category":"战略与历史判断","question":"使董卓最终被杀的宫廷谋划中，哪两人分别发挥策划与执行作用？","options":{"A":"李傕与郭汜","B":"何进与袁绍","C":"曹操与荀攸","D":"王允与吕布"},"answer":"D","explanation":"王允与吕布合谋诛董卓，吕布亲手参与诛杀；李傕郭汜反而在董卓死后反攻长安。","source":"《三国志》卷6·董卓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-012","level":"easy","topic":"汉末群雄与政局","category":"战略与历史判断","question":"董卓死后，哪一股西凉旧部势力攻入长安并击败王允？","options":{"A":"李傕、郭汜等人","B":"吕布、陈宫等人","C":"张绣、贾诩等人","D":"马超、韩遂等人"},"answer":"A","explanation":"董卓部将李傕等攻长安，吕布出奔、王允被杀；马超韩遂起事属于更晚阶段。","source":"《三国志》卷6·董卓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-013","level":"easy","topic":"汉末群雄与政局","category":"战略与历史判断","question":"汉献帝脱离李傕郭汜挟制后，先回到哪座旧都，随后才由曹操迎至许？","options":{"A":"长安","B":"谯县","C":"邺城","D":"洛阳"},"answer":"D","explanation":"献帝东归至洛阳后，曹操迎帝迁许；应区分东归旧都与迁许的两步。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-014","level":"medium","topic":"汉末群雄与政局","category":"战略与历史判断","question":"刘表入荆州后，依据《刘表传》，哪两位地方名士参与协助其经营荆州？","options":{"A":"陈宫与张邈","B":"蒯良与蒯越","C":"荀彧与荀攸","D":"田丰与沮授"},"answer":"B","explanation":"《刘表传》记刘表向蒯良、蒯越咨询治理荆州的方略，并联结蔡瑁等当地力量。","source":"《三国志》卷6·刘表传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"刘表传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-015","level":"medium","topic":"汉末群雄与政局","category":"战略与历史判断","question":"陶谦主政徐州时，与曹操形成长期冲突的直接导火索之一是什么？","options":{"A":"陶谦向袁术称帝表示拥护","B":"曹操父亲曹嵩在陶谦辖境遇害","C":"曹操在官渡杀死陶谦长子","D":"陶谦率兵袭占许县并劫献帝"},"answer":"B","explanation":"曹嵩遇害后曹操两度攻徐州；关于具体凶手及陶谦责任，记载有不同细节，不宜简化成陶谦亲自下令。","source":"《三国志》卷8·陶谦传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"陶谦传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-016","level":"easy","topic":"汉末群雄与政局","category":"战略与历史判断","question":"袁术自立为帝主要是在控制哪一地区期间发生的？","options":{"A":"淮南寿春一带","B":"益州成都一带","C":"荆州襄阳一带","D":"河北邺城一带"},"answer":"A","explanation":"袁术盘踞淮南，于寿春僭号；袁绍控制的河北与袁术政权不可混同。","source":"《三国志》卷6·袁术传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"袁术传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-017","level":"medium","topic":"汉末群雄与政局","category":"战略与历史判断","question":"据《董卓传》，董卓迁都并毁洛阳的一项直接结果是什么？","options":{"A":"宫庙官府和民居被焚，人口被驱往长安","B":"宫庙不受破坏，郡县军自愿护民西迁","C":"献帝留洛阳，董卓带宫廷卫军西迁","D":"旧都官民留洛阳，只有献帝和公卿西迁"},"answer":"A","explanation":"《董卓传》记焚烧洛阳宫庙、官府与居家，驱徙人口；不可把联盟后续崩溃误作搬迁的直接行政结果。","source":"《三国志》卷6·董卓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-018","level":"medium","topic":"汉末群雄与政局","category":"制度与史料细节","question":"孙坚奉袁术之命北上讨董期间，与哪位荆州地方长官发生冲突并将其杀死？","options":{"A":"荆州牧刘表","B":"长沙太守孙静","C":"南阳太守张咨","D":"豫州刺史孔伷"},"answer":"C","explanation":"孙坚行经南阳，与不肯供应军资的太守张咨发生冲突并将其杀死；刘表与孙坚后来的战争另属一事。","source":"《三国志》卷46·孙破虏讨逆传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙破虏讨逆传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-019","level":"hard","topic":"汉末群雄与政局","category":"制度与史料细节","question":"曹操在讨董联盟期间劝诸将积极进兵，最能体现其与联军主流行动差异的是哪项？","options":{"A":"主张袁绍先夺冀州再统一出兵","B":"主张共同驻守酸枣等待董卓主动东征","C":"建议先与袁术交战再考虑洛阳","D":"主张趁董卓西迁，分路进军控制要道"},"answer":"D","explanation":"《武帝纪》记曹操主张各路据要道进逼董卓，而诸军多疑不进。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-020","level":"hard","topic":"汉末群雄与政局","category":"制度与史料细节","question":"以下哪项能够准确说明董卓控制中央政权初期的兵权来源？","options":{"A":"先收皇甫嵩关中兵，再令丁原杀何苗收其军","B":"由何太后授其何进旧部，丁原仍独立统京师军","C":"先由袁绍转交何进旧部，再与丁原合兵掌宫门","D":"收何进、何苗旧部，继而使吕布杀丁原、并其军"},"answer":"D","explanation":"《董卓传》记何进、何苗死后部众无所归，继而董卓收丁原军，使京都兵权集中其手。","source":"《三国志》卷6·董卓传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"董卓传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-021","level":"easy","topic":"曹魏军政","category":"史实记忆","question":"曹操在兖州与吕布争夺期间，原来支持曹操的哪两人发动叛变，引吕布入兖州？","options":{"A":"张邈与陈宫","B":"刘晔与蒋济","C":"李典与乐进","D":"荀彧与程昱"},"answer":"A","explanation":"张邈、陈宫迎吕布入兖州，荀彧、程昱等保鄄城等地，曹操遂回军争夺。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-022","level":"hard","topic":"曹魏军政","category":"史实记忆","question":"兖州危机时，荀彧与程昱协助守住的主要据点组合是哪一组？","options":{"A":"鄄城、范、雍丘","B":"濮阳、范、东阿","C":"鄄城、定陶、东阿","D":"鄄城、范、东阿"},"answer":"D","explanation":"《荀彧传》《程昱传》记鄄城、范、东阿等得以坚守，使曹操未失尽兖州。","source":"《三国志》卷10·荀彧传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷10","source_locator":"荀彧传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"189—196 董卓与诸侯割据"},{"id":"v14-023","level":"easy","topic":"曹魏军政","category":"史实记忆","question":"张绣在宛城降而复叛时，曹操失去的长子是谁？","options":{"A":"曹彰","B":"曹昂","C":"曹冲","D":"曹植"},"answer":"B","explanation":"《武帝纪》等记张绣反击致曹昂、典韦等死；不能把后来的曹丕继承问题混入宛城战役。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-024","level":"easy","topic":"曹魏军政","category":"史实与因果","question":"宛城曹军遭袭时，力战掩护曹操撤离而战死的近卫将领是谁？","options":{"A":"许褚","B":"庞德","C":"李典","D":"典韦"},"answer":"D","explanation":"典韦以校尉侍卫曹操，宛城变乱时堵门死战，见《典韦传》。","source":"《三国志》卷18·典韦传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷18","source_locator":"典韦传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-025","level":"easy","topic":"曹魏军政","category":"史实与因果","question":"在下邳之战末期，吕布由谁率部围攻并最终被擒杀？","options":{"A":"曹操","B":"孙策","C":"袁绍","D":"刘表"},"answer":"A","explanation":"曹操围下邳，吕布最终被缚送曹操并处死；刘备与曹军合作，不是独立完成全役。","source":"《三国志》卷7·吕布传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷07","source_locator":"吕布传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-026","level":"medium","topic":"曹魏军政","category":"史实与因果","question":"吕布据徐州期间，谁表面仕吕布、暗中联结曹操并助其平定徐州？","options":{"A":"陈登","B":"张杨","C":"陈珪","D":"臧霸"},"answer":"A","explanation":"陈登与父陈珪支持曹操一方，陈登以广陵兵从曹操，陈珪是其父。","source":"《三国志》卷7·吕布传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷07","source_locator":"吕布传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-027","level":"easy","topic":"曹魏军政","category":"史实与因果","question":"曹操在官渡战役中先解白马之围时，按《关羽传》斩杀了哪位袁军将领？","options":{"A":"颜良","B":"高览","C":"文丑","D":"淳于琼"},"answer":"A","explanation":"关羽随曹操军在白马冲阵斩颜良；文丑之死另见官渡前期延津战事。","source":"《三国志》卷36·关羽传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"关羽传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-028","level":"easy","topic":"曹魏军政","category":"史实与因果","question":"曹操与袁绍在延津附近交战中，被击杀的袁军将领是哪位？","options":{"A":"文丑","B":"颜良","C":"张郃","D":"郭图"},"answer":"A","explanation":"《武帝纪》记延津附近曹军破袁军，斩文丑；不能把白马颜良之死与延津之役合并。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-029","level":"medium","topic":"曹魏军政","category":"史实与因果","question":"袁绍去世后，其继承纷争主要发生在哪两位儿子之间？","options":{"A":"袁尚与袁绍","B":"袁熙与袁术","C":"袁谭与袁尚","D":"袁谭与袁买"},"answer":"C","explanation":"袁谭为长子，袁尚获得部分幕僚拥立，双方相攻，客观上给曹操逐步平定河北创造条件。","source":"《三国志》卷6·袁绍传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"袁绍传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-030","level":"medium","topic":"曹魏军政","category":"史实与因果","question":"曹操攻破邺城时，主要是向哪位袁氏继承人的据点发动进攻？","options":{"A":"袁尚","B":"袁谭","C":"袁术","D":"袁熙"},"answer":"A","explanation":"邺为袁氏河北中心，袁尚离城迎战，审配守城，最终城破；袁谭另据南皮。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-031","level":"medium","topic":"曹魏军政","category":"战略与历史判断","question":"袁尚离开邺城迎战曹操时，留在城中负责防御的袁氏重臣是谁？","options":{"A":"审配","B":"逢纪","C":"田丰","D":"沮授"},"answer":"A","explanation":"《袁绍传》记审配守邺至城陷；沮授已在官渡前后亡故，田丰亦早死。","source":"《三国志》卷6·袁绍传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"袁绍传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-032","level":"medium","topic":"曹魏军政","category":"战略与历史判断","question":"袁谭在与曹操的冲突中最终于哪次作战中被斩？","options":{"A":"汉中之战","B":"白狼山之战","C":"南皮之战","D":"潼关之战"},"answer":"C","explanation":"《武帝纪》记曹操攻南皮斩袁谭；白狼山对应北征乌桓。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-033","level":"hard","topic":"曹魏军政","category":"战略与历史判断","question":"郭嘉支持曹操北征乌桓时，对袁氏残余与北方胡骑的联系作出何种判断？","options":{"A":"袁氏依乌桓仍有号召力，不除将留河北后患","B":"乌桓无力救袁氏，应先征辽东再回击柳城","C":"袁氏必先攻许，应以河北军南撤诱其入境","D":"乌桓已与刘表同盟，应先南征切断联系"},"answer":"A","explanation":"郭嘉认为袁氏兄弟依附乌桓而仍具号召可能，主张趁北方尚未安定彻底解决。","source":"《三国志》卷14·郭嘉传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷14","source_locator":"郭嘉传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-034","level":"medium","topic":"曹魏军政","category":"战略与历史判断","question":"曹操远征乌桓的关键决战地点是哪一处？","options":{"A":"白狼山","B":"长坂坡","C":"赤壁","D":"阳平关"},"answer":"A","explanation":"建安十二年曹操北征乌桓，白狼山战胜蹋顿等部；非后来的汉中与赤壁战场。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-035","level":"medium","topic":"曹魏军政","category":"战略与历史判断","question":"曹操远征乌桓时，冲击敌阵并斩蹋顿的魏军将领是谁？","options":{"A":"夏侯惇","B":"张郃","C":"徐晃","D":"张辽"},"answer":"D","explanation":"《张辽传》记曹操以麾授辽，使击之，大破乌桓、斩蹋顿。","source":"《三国志》卷17·张辽传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷17","source_locator":"张辽传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-036","level":"medium","topic":"曹魏军政","category":"战略与历史判断","question":"袁尚、袁熙投奔公孙康后，公孙康如何处置二人？","options":{"A":"斩二人并送首级于曹操","B":"许其暂驻，令其领乌桓兵守边","C":"扣为人质，向曹操索取辽东官号","D":"送二人到许，要求汉廷赦免"},"answer":"A","explanation":"公孙康杀袁尚、袁熙并送首于曹操，《武帝纪》有记；与曹操亲征公孙渊是不同年代。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-037","level":"hard","topic":"曹魏军政","category":"战略与历史判断","question":"官渡前袁绍谋划南进时，田丰针对时机提出的意见倾向于哪一项？","options":{"A":"先助袁术北进，联合夹攻许县","B":"先围白马，待曹操到后渡河速决","C":"先取兖州，放弃河北作为主战区","D":"依托河北，长久消耗曹操而避免仓促决战"},"answer":"D","explanation":"田丰认为袁绍应发挥其优势徐图曹操，反对仓促决战；与此后沮授的其他建议仍须区分。","source":"《三国志》卷6·袁绍传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"袁绍传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-038","level":"hard","topic":"曹魏军政","category":"制度与史料细节","question":"曹操与袁绍争衡时，荀彧指出曹操较袁绍具有的关键政治优势包括什么？","options":{"A":"门望、河北人口与宗族兵的比较优势","B":"度、谋、武、德方面的比较优势","C":"冀州财政与各州郡响应数量的比较优势","D":"四世三公名望与善于周旋士族的比较优势"},"answer":"B","explanation":"《荀彧传》记荀彧比较袁绍与曹操，列度胜、谋胜、武胜、德胜，涉及用人、决断、赏罚与诚心待人。河北人口、门望是袁氏资源，不能与此处荀彧列举的曹操优势混淆；这段是人物意见，不是精确量化评估。","source":"《三国志》卷10·荀彧传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷10","source_locator":"荀彧传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-039","level":"medium","topic":"曹魏军政","category":"制度与史料细节","question":"张绣第二次降曹的关键游说者是谁，尤其强调曹操需要招纳敌对势力？","options":{"A":"许攸","B":"法正","C":"郭嘉","D":"贾诩"},"answer":"D","explanation":"贾诩劝张绣归曹，说明曹操奉天子、势弱更需盟助等理由，见《贾诩传》。","source":"《三国志》卷10·贾诩传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷10","source_locator":"贾诩传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-040","level":"medium","topic":"曹魏军政","category":"制度与史料细节","question":"曹操将袁氏河北地盘逐步纳入统治后，最能表明其行政身份变化的是哪项任命？","options":{"A":"任交州刺史","B":"领冀州牧","C":"领益州牧","D":"任汉中太守"},"answer":"B","explanation":"建安九年曹操破邺后领冀州牧，以河北为新的治理与动员基础。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"197—207 官渡与河北归曹"},{"id":"v14-041","level":"easy","topic":"东吴外交与战争","category":"史实记忆","question":"孙策脱离袁术系统、开始争夺江东时，主要从哪位扬州刺史势力手中夺取曲阿一带？","options":{"A":"严白虎","B":"王朗","C":"黄祖","D":"刘繇"},"answer":"D","explanation":"孙策渡江后与刘繇部交战，夺取曲阿，逐步站稳吴会；王朗在会稽，严白虎为吴郡豪强。","source":"《三国志》卷46·孙讨逆传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙讨逆传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-042","level":"easy","topic":"东吴外交与战争","category":"史实记忆","question":"孙策攻刘繇期间，在神亭与孙策相遇交战、后被孙氏招纳的将领是谁？","options":{"A":"太史慈","B":"甘宁","C":"周泰","D":"凌统"},"answer":"A","explanation":"《太史慈传》记太史慈与孙策在神亭相遇交手，后来为孙策所用。","source":"《三国志》卷49·太史慈传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷49","source_locator":"太史慈传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-043","level":"easy","topic":"东吴外交与战争","category":"史实记忆","question":"孙策平定会稽时，主要击败的当地郡守是谁？","options":{"A":"许贡","B":"士燮","C":"刘繇","D":"王朗"},"answer":"D","explanation":"孙策进兵会稽，王朗据固陵等处抵抗，败后流亡；刘繇主扬州而不守会稽郡治。","source":"《三国志》卷46·孙讨逆传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙讨逆传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-044","level":"easy","topic":"东吴外交与战争","category":"史实与因果","question":"孙策早期在江东用兵时，哪名将领随孙策渡江并后来主持江东重要军事行动？","options":{"A":"张郃","B":"周瑜","C":"程昱","D":"蒋琬"},"answer":"B","explanation":"《周瑜传》记周瑜迎孙策于历阳，随攻横江、当利等处，为江东军事骨干。","source":"《三国志》卷54·周瑜传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"周瑜传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-045","level":"medium","topic":"东吴外交与战争","category":"史实与因果","question":"孙策遇刺身亡与何人的故吏、门客复仇直接有关？","options":{"A":"黄祖","B":"刘繇","C":"许贡","D":"王朗"},"answer":"C","explanation":"孙策先杀吴郡太守许贡，许贡门客后来伏击孙策；史书不支持将其说成孙权策划。","source":"《三国志》卷46·孙讨逆传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙讨逆传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-046","level":"medium","topic":"东吴外交与战争","category":"史实与因果","question":"孙策去世时，孙权接掌江东后最重要的文武辅佐组合之一是哪一组？","options":{"A":"张纮与陆抗","B":"张昭与周瑜","C":"诸葛瑾与陆逊","D":"鲁肃与吕蒙"},"answer":"B","explanation":"《孙讨逆传》《张昭传》等记孙策以事属孙权，张昭与周瑜等协助新主稳定政局。","source":"《三国志》卷46·孙讨逆传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙讨逆传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-047","level":"hard","topic":"东吴外交与战争","category":"史实与因果","question":"孙权与鲁肃早年讨论江东前景时，鲁肃提出的政治格局倾向于哪一项？","options":{"A":"先向曹操称臣，借魏军攻取荆州后长期守江东","B":"固据江东，取荆州，等待北方有变而图帝业","C":"先奉汉帝东迁江东，待汉廷诏令讨伐曹操","D":"先联刘表共治荆州，再将吴会交孙氏分支管理"},"answer":"B","explanation":"《鲁肃传》记鲁肃建议固据江东、进取荆州而图北方，形成足与中原抗衡的格局。","source":"《三国志》卷54·鲁肃传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"鲁肃传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-048","level":"easy","topic":"东吴外交与战争","category":"史实与因果","question":"黄祖长期据守的江夏势力，主要受命于哪位荆州牧？","options":{"A":"刘表","B":"刘璋","C":"曹操","D":"陶谦"},"answer":"A","explanation":"黄祖为刘表部将，守江夏对抗孙氏，孙权后来多次攻之。","source":"《三国志》卷47·吴主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"吴主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-049","level":"easy","topic":"东吴外交与战争","category":"史实与因果","question":"孙权在建安十三年攻克江夏、击杀的长期对手是谁？","options":{"A":"张杨","B":"黄祖","C":"王朗","D":"张绣"},"answer":"B","explanation":"孙权在赤壁同年进讨黄祖并斩之，之后曹操大军南下改变了战局。","source":"《三国志》卷47·吴主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"吴主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-050","level":"medium","topic":"东吴外交与战争","category":"史实与因果","question":"孙权军中的甘宁此前曾效力于谁麾下，因此与凌统有杀父之仇？","options":{"A":"曹操","B":"黄祖","C":"刘璋","D":"袁绍"},"answer":"B","explanation":"甘宁原在黄祖麾下，曾射杀凌统之父凌操；归吴后凌统与甘宁有私怨，孙权加以约束。","source":"《三国志》卷55·甘宁传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷55","source_locator":"甘宁传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-052","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"太史慈受孙策重用后，主要负责牵制谁在荆州方向的活动？","options":{"A":"张鲁","B":"张绣","C":"刘磐","D":"公孙瓒"},"answer":"C","explanation":"《太史慈传》记刘表从子刘磐数侵艾、西安等县，太史慈被任为建昌都尉防其进犯。","source":"《三国志》卷49·太史慈传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷49","source_locator":"太史慈传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-053","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"孙策攻江东后，在吴郡一带与之抗衡的地方豪强是谁？","options":{"A":"严白虎","B":"张燕","C":"孟获","D":"韩遂"},"answer":"A","explanation":"孙策击败严白虎等吴郡地方势力，扩大对吴会地区的实际控制。","source":"《三国志》卷46·孙讨逆传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙讨逆传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-054","level":"easy","topic":"东吴外交与战争","category":"战略与历史判断","question":"孙权政权早期，哪个人物以江东重臣身份长期担任文书政务与劝谏工作？","options":{"A":"吕范","B":"黄盖","C":"张昭","D":"周泰"},"answer":"C","explanation":"张昭为江东重要文臣，受孙策遗命辅孙权，屡有政务谏言；其他三人以军事工作著称。","source":"《三国志》卷52·张昭传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷52","source_locator":"张昭传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-055","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"《鲁肃传》记鲁肃从江东前往孙权处时，对孙权所谓替汉室恢复旧制持何种看法？","options":{"A":"只守吴会，永久停止向荆州扩张","B":"奉汉廷诏令，可先取荆州后还政朝廷","C":"汉室不可复兴，应自定江东长远之计","D":"暂依刘表结援，等河北袁氏统一再议"},"answer":"C","explanation":"鲁肃用高祖、项羽形势说明天下将变，建议孙权有自己的战略目标；这反映的是鲁肃在传中的判断。","source":"《三国志》卷54·鲁肃传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"鲁肃传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-056","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"孙策在江东与刘繇交战期间，刘繇任用哪两员将领据横江、当利抵抗？","options":{"A":"张任与刘璝","B":"樊能与于麋","C":"张郃与高览","D":"郭淮与陈泰"},"answer":"B","explanation":"《孙讨逆传》记樊能、于麋屯横江津等地，孙策进攻并夺取渡口。","source":"《三国志》卷46·孙讨逆传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷46","source_locator":"孙讨逆传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-057","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"交州割据时期，士燮长期担任的地方职务是什么？","options":{"A":"广陵太守","B":"会稽太守","C":"南郡太守","D":"交趾太守"},"answer":"D","explanation":"士燮以交趾太守立足交州，利用中原战乱形成地方影响力，见《士燮传》。","source":"《三国志》卷49·士燮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷49","source_locator":"士燮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-058","level":"medium","topic":"东吴外交与战争","category":"制度与史料细节","question":"孙权派往交州、后来经营南方边地的将领吕岱，主要与哪类任务关联？","options":{"A":"平定丹阳山越并长期镇守吴郡","B":"平定地方叛乱并维系交州控制","C":"主持荆州南郡与曹魏的边界划分","D":"督濡须沿江兵马抗击曹军南下"},"answer":"B","explanation":"吕岱多次在南部经略交州、岭南诸郡，属于江东对南部版图的军事行政经营。","source":"《三国志》卷60·吕岱传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷60","source_locator":"吕岱传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-059","level":"medium","topic":"东吴外交与战争","category":"制度与史料细节","question":"孙策早期攻会稽时，谁曾建议王朗利用险地拒战而未获充分采纳？","options":{"A":"鲁肃","B":"步骘","C":"虞翻","D":"张昭"},"answer":"C","explanation":"《虞翻传》记虞翻为王朗功曹，劝守据险，不宜轻出交战；后来归孙氏。","source":"《三国志》卷57·虞翻传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷57","source_locator":"虞翻传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-060","level":"medium","topic":"东吴外交与战争","category":"制度与史料细节","question":"与孙策亲历江东创业的孙氏长辈、协助掌兵与安集的哪位人物是孙坚之弟？","options":{"A":"孙瑜","B":"孙翊","C":"孙静","D":"孙匡"},"answer":"C","explanation":"孙静是孙坚之弟，在孙氏早期江东经营中有贡献；孙匡、孙翊为孙坚诸子。","source":"《三国志》卷51·孙静传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷51","source_locator":"孙静传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"194—208 江东与淮南经营"},{"id":"v14-061","level":"easy","topic":"东吴外交与战争","category":"史实记忆","question":"曹操南下荆州时，刘表死后代表荆州向曹操投降的是谁？","options":{"A":"蔡瑁","B":"蒯越","C":"刘琮","D":"刘琦"},"answer":"C","explanation":"刘琮为刘表少子，刘表死后继任并降曹；刘琦与刘备的行动方向不同。","source":"《三国志》卷6·刘表传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷06","source_locator":"刘表传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-062","level":"hard","topic":"东吴外交与战争","category":"史实记忆","question":"曹操取得荆州并南进后，刘备在长坂撤退中首先面对的具体困境是什么？","options":{"A":"后方荆州郡县相继归曹，无法坚守","B":"荆州地方军多持观望态度，补给不足","C":"随军民众众多，行动迟缓，曹军骑兵追及","D":"江夏水路尚未打通，关羽舟军迟迟不至"},"answer":"C","explanation":"《先主传》记刘备携大量士众南行，日行十余里，曹操以精骑急追至长坂。","source":"《三国志》卷32·先主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"先主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-063","level":"medium","topic":"东吴外交与战争","category":"史实记忆","question":"刘备在长坂败退后，与关羽水军在何处附近会合，再趋夏口？","options":{"A":"街亭","B":"汉津","C":"逍遥津","D":"阳平关"},"answer":"B","explanation":"《先主传》记刘备斜趋汉津，与关羽船会，得济沔，后向夏口方向移动。","source":"《三国志》卷32·先主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"先主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-064","level":"easy","topic":"东吴外交与战争","category":"史实与因果","question":"赤壁战前，刘备阵营中出使孙权以促成共同抗曹的主要人物是谁？","options":{"A":"法正","B":"庞统","C":"诸葛亮","D":"马良"},"answer":"C","explanation":"诸葛亮奉刘备意前往见孙权促其联抗曹操；与鲁肃出使联络相互呼应。","source":"《三国志》卷35·诸葛亮传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷35","source_locator":"诸葛亮传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-065","level":"medium","topic":"东吴外交与战争","category":"史实与因果","question":"赤壁抗曹同盟形成时，鲁肃对于刘备军的态度最符合哪项？","options":{"A":"主动联络刘备以共同抗曹","B":"主张先取夏口再决定是否与刘备结盟","C":"建议孙权独立迎敌，不与刘备共享兵力","D":"主张刘备暂守江夏，由吴军独自取南郡"},"answer":"A","explanation":"《鲁肃传》记鲁肃主张联结刘备共拒曹军，前往荆州接洽。","source":"《三国志》卷54·鲁肃传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"鲁肃传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-066","level":"medium","topic":"东吴外交与战争","category":"史实与因果","question":"周瑜向孙权判断曹军不易得志，其主要军事条件之一是什么？","options":{"A":"北军缺马，应趁其在平原行军时骑击","B":"曹军缺乏攻城器械，只能沿江劫掠","C":"不习水战、不服水土，且另有后方忧患","D":"荆州舟船不足，应先拦其船队抵达江陵"},"answer":"C","explanation":"《周瑜传》将江南水战环境、军中疾病与后方风险列入抗曹判断，不能将其归为神秘天象。","source":"《三国志》卷54·周瑜传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"周瑜传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-067","level":"medium","topic":"东吴外交与战争","category":"史实与因果","question":"曹操赤壁失利后，东吴军主帅周瑜接着重点攻取的战略据点是哪一处？","options":{"A":"江陵（南郡治所）","B":"邺城","C":"许昌","D":"汉中"},"answer":"A","explanation":"周瑜追击曹仁，历经围攻而取得南郡江陵，是赤壁后荆州格局的重要变化。","source":"《三国志》卷54·周瑜传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"周瑜传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-068","level":"medium","topic":"东吴外交与战争","category":"史实与因果","question":"曹仁在江陵抵抗周瑜期间，哪位骑将被围后曹仁亲自出城救援？","options":{"A":"夏侯尚","B":"牛金","C":"满宠","D":"文聘"},"answer":"B","explanation":"《曹仁传》记牛金陷重围，曹仁披甲出城救援，使部下感叹其勇。","source":"《三国志》卷9·曹仁传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"曹仁传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-069","level":"medium","topic":"东吴外交与战争","category":"史实与因果","question":"赤壁后曹操控制的江陵由哪位曹魏将领负责守卫？","options":{"A":"张辽","B":"曹仁","C":"夏侯渊","D":"曹休"},"answer":"B","explanation":"曹仁受命守江陵，抵挡周瑜与刘备联合势力的攻势。","source":"《三国志》卷9·曹仁传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷09","source_locator":"曹仁传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-070","level":"hard","topic":"东吴外交与战争","category":"史实与因果","question":"据《鲁肃传》，在刘备请求督荆州之事上，鲁肃为何劝孙权借地给刘备？","options":{"A":"刘备接受孙权任命，仅作为吴军驻荆州都督","B":"周瑜主张以整个荆州永久换取刘备臣服","C":"孙权与刘备订立继承刘表全部领地的统一诏令","D":"鲁肃主张借刘备形成抗曹伙伴，孙刘仍各有利益诉求"},"answer":"D","explanation":"《鲁肃传》记刘备诣京见孙权、求都督荆州，鲁肃劝借之，以共拒曹公。该处反映鲁肃的抗曹外交判断；不等于整个荆州的各郡在一次交涉中全部移交，更不等于孙刘从此没有地盘争议。","source":"《三国志》卷54《鲁肃传》（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"鲁肃","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-071","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"周瑜在赤壁获胜后曾提出的进一步扩张设想主要指向哪里？","options":{"A":"沿淮河攻合肥，以巩固北方边界","B":"攻取蜀地并吞并汉中张鲁","C":"先经营南郡，不向益州或关中扩张","D":"立即进取许县，绕开荆州和汉中"},"answer":"B","explanation":"《周瑜传》记周瑜请求与孙瑜取蜀、并张鲁，再图襄阳，但未及实施即去世。","source":"《三国志》卷54·周瑜传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"周瑜传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-072","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"赤壁后刘备势力向荆南扩展，哪项四郡组合与史书记载相符？","options":{"A":"广陵、九江、庐江、豫章","B":"南郡、江夏、襄阳、南阳","C":"武陵、长沙、桂阳、零陵","D":"汉中、巴西、梓潼、广汉"},"answer":"C","explanation":"《先主传》记刘备南征四郡，诸太守降；南郡和江夏的归属复杂，不能混作这四郡。","source":"《三国志》卷32·先主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"先主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-073","level":"hard","topic":"东吴外交与战争","category":"战略与历史判断","question":"赤壁战后孙权围攻合肥时，魏臣蒋济通过何种办法虚张声势，使吴军误判援军规模？","options":{"A":"伪称刘备已攻吴郡，派假吴使入孙权军报急","B":"伪称曹操已渡江至濡须，令吴军俘虏带回消息","C":"伪称张喜援军四万已到雩娄，令部分书信落入吴军","D":"伪称张辽八百骑已袭建业，令城中商人转告孙权"},"answer":"C","explanation":"《蒋济传》记蒋济伪称张喜援军四万已至，令一部分书信落入孙权军手中，孙权相信后撤围。","source":"《三国志》卷14·蒋济传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷14","source_locator":"蒋济传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-074","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"孙权取得江陵后，周瑜被任命为哪一郡太守并以江陵为治所？","options":{"A":"长沙太守","B":"南郡太守","C":"庐江太守","D":"江夏太守"},"answer":"B","explanation":"《周瑜传》记拜偏将军，领南郡太守，屯据江陵；应区分占领地与吴国对该郡的官员任命。","source":"《三国志》卷54·周瑜传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"周瑜传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-075","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"周瑜死后鲁肃接统其部众，先屯江陵、后下屯何处？","options":{"A":"濡须","B":"江夏","C":"合肥","D":"陆口"},"answer":"D","explanation":"《鲁肃传》记鲁肃领周瑜士众，初住江陵，后下屯陆口，威恩大行。此时尚未有221年建立的蜀汉，宜称刘备集团或孙刘接壤地带。","source":"《三国志》卷54·鲁肃传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"鲁肃传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-076","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"孙刘双方围绕荆州曾于建安二十年发生正面争执，最后以哪条水系为部分郡县划界？","options":{"A":"淮水","B":"渭水","C":"沔水","D":"湘水"},"answer":"D","explanation":"建安二十年孙刘划湘水为界，重新分配长沙、江夏、桂阳与南郡、零陵、武陵等地。","source":"《三国志》卷32·先主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"先主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-077","level":"medium","topic":"东吴外交与战争","category":"战略与历史判断","question":"建安二十年刘备得知东吴进取荆南后，亲自率兵到何处，与令关羽赴益阳的行动相配合？","options":{"A":"江陵","B":"西陵","C":"公安","D":"夷陵"},"answer":"C","explanation":"《先主传》记刘备引兵下公安，又令关羽入益阳，后与孙权议和划界。","source":"《三国志》卷32·先主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"先主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-078","level":"medium","topic":"东吴外交与战争","category":"制度与史料细节","question":"吕蒙争夺零陵时，受其计策影响而出降的郡守是谁？","options":{"A":"赵范","B":"韩玄","C":"金旋","D":"郝普"},"answer":"D","explanation":"《吕蒙传》记郝普固守零陵，吕蒙利用消息差与劝说使其出降。","source":"《三国志》卷54·吕蒙传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷54","source_locator":"吕蒙传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-079","level":"medium","topic":"东吴外交与战争","category":"制度与史料细节","question":"215年孙刘荆州交涉后，孙权进攻曹操一方哪处城池，遭张辽突击？","options":{"A":"合肥","B":"濡须","C":"广陵","D":"皖城"},"answer":"A","explanation":"孙权在合肥遭张辽主动突击，荆州争执与合肥战事同年发生，但属于不同方向。","source":"《三国志》卷47·吴主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷47","source_locator":"吴主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-080","level":"medium","topic":"东吴外交与战争","category":"制度与史料细节","question":"合肥之战时，张辽主动出城突击孙权军，他与哪两位将领共同率守军迎战？","options":{"A":"夏侯渊与张郃","B":"许褚与典韦","C":"李典与乐进","D":"曹仁与于禁"},"answer":"C","explanation":"《张辽传》记张辽与李典、乐进等守合肥，张辽募勇士出击；三人间既有嫌隙仍协同作战。","source":"《三国志》卷17·张辽传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷17","source_locator":"张辽传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-081","level":"easy","topic":"刘备入蜀与建国","category":"史实记忆","question":"建安十六年曹操与关中联军交战的核心战场是哪一处？","options":{"A":"潼关、渭水一线","B":"街亭、陇右一线","C":"西陵、夷道一线","D":"赤壁、乌林一线"},"answer":"A","explanation":"曹操与马超、韩遂等关中联军在潼关、渭水附近交战，时间在刘备正式入蜀前后。","source":"《三国志》卷1·武帝纪（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷01","source_locator":"武帝纪","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-082","level":"easy","topic":"刘备入蜀与建国","category":"史实记忆","question":"潼关战事中，曹操使用离间计以瓦解哪两位联军首领之间的信任？","options":{"A":"张任与刘璋","B":"马腾与张鲁","C":"刘备与孙权","D":"马超与韩遂"},"answer":"D","explanation":"曹操利用与韩遂旧交等制造猜疑，激化马超、韩遂间的不信任；马腾当时不在战场主帅之列。","source":"《三国志》卷10·贾诩传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷10","source_locator":"贾诩传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-083","level":"easy","topic":"刘备入蜀与建国","category":"史实记忆","question":"马超在关中战败后，曾短暂依附何人，然后转投刘备？","options":{"A":"张鲁","B":"袁绍","C":"刘表","D":"刘璋"},"answer":"A","explanation":"《马超传》记马超失陇上后奔汉中依张鲁，继而奔刘备。","source":"《三国志》卷36·马超传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"马超传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-084","level":"medium","topic":"刘备入蜀与建国","category":"史实与因果","question":"刘备围成都时，谁率军到城下形成对刘璋的新增压力？","options":{"A":"严颜","B":"黄忠","C":"魏延","D":"马超"},"answer":"D","explanation":"《马超传》记刘备围成都，密书招马超，马超至城下，刘璋恐惧而降。","source":"《三国志》卷36·马超传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"马超传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-085","level":"hard","topic":"刘备入蜀与建国","category":"史实与因果","question":"刘备入蜀夺成都过程中，诸葛亮、张飞、赵云等后续增援入蜀时采用的主要路线条件是什么？","options":{"A":"以汉中为基地，南下葭萌后再围成都","B":"由荆州分兵夺取张鲁占据的汉中","C":"以荆南为基地，从零陵陆路直趋巴郡","D":"沿长江自荆州西进，并分兵平定沿途郡县"},"answer":"D","explanation":"《先主传》《张飞传》记诸葛亮等溯江入蜀、分定郡县，与庞统随刘备最早入蜀不同。","source":"《三国志》卷32·先主传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷32","source_locator":"先主传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-086","level":"medium","topic":"刘备入蜀与建国","category":"史实与因果","question":"张飞入蜀援刘备时，在江州擒获哪位刘璋旧将，并因其不屈而释之？","options":{"A":"张任","B":"邓贤","C":"冷苞","D":"严颜"},"answer":"D","explanation":"《张飞传》记张飞生擒巴郡太守严颜，后敬其义而释放。","source":"《三国志》卷36·张飞传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷36","source_locator":"张飞传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-087","level":"medium","topic":"刘备入蜀与建国","category":"史实与因果","question":"建安二十年曹操取汉中后，向曹操投降的汉中割据者是谁？","options":{"A":"张既","B":"张绣","C":"张杨","D":"张鲁"},"answer":"D","explanation":"张鲁长期据汉中，曹操西征后其部降曹；不可与张绣宛城归降相混。","source":"《三国志》卷8·张鲁传（正文）","source_url":"https://zh.wikisource.org/wiki/三國志/卷08","source_locator":"张鲁传","novel_note":"以所引正史为依据；涉及策略时仅考证史书所载行动、先后与条件，不把小说改编及没有证据的动机当成史实。","period":"208—215 赤壁与荆益格局"},{"id":"v14-088","level":"medium","topic":"刘备入蜀与建国","category":"史实与因果","question":"曹操取得汉
